<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Admin Mitra Luar Kota</title>
<style>body{margin:0;background:#e4d3bf;color:#3a1f10;font-family:Roboto,system-ui,sans-serif}.w{max-width:720px;margin:0 auto;padding:16px}.b{background:#fff;border:1px solid #d3bfa8;border-radius:18px;padding:14px;margin-bottom:12px}
.f{display:block;width:100%;padding:10px;border:1px solid #d3bfa8;border-radius:10px;font:inherit;margin:5px 0 10px}.t{font:inherit;font-weight:700;padding:9px 12px;border-radius:12px;border:1px solid #7b3f1d;background:#fff;color:#7b3f1d;cursor:pointer;margin:4px 4px 0 0}.t.p{background:#7b3f1d;color:#fff}.t.r{border-color:#b83c2b;color:#b83c2b}
.s{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#fff3cd}.s.aktif{background:#d6f0de}.s.ditolak,.s.nonaktif{background:#f6d6d2}.m{font-size:13px;color:#5c4638}[hidden]{display:none!important}</style></head><body><div class="w">
<h2>🌍 Admin Mitra Luar Kota</h2>
<div class="b" id="vLogin"><label>Email admin<input id="em" class="f" type="email"></label><label>Kata sandi<input id="pw" class="f" type="password"></label><button class="t p" id="go">Masuk</button><div class="m" id="err"></div></div>
<div id="vList" hidden><button class="t" id="out">Keluar</button><div id="list"></div></div></div>
<script src="config.js"></script><script>
const C=window.CLOUD_CONFIG,B=String(C.supabaseUrl).replace(/\/$/,""),$=i=>document.getElementById(i);let tok="";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function rpc(fn,body){const r=await fetch(B+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:C.supabaseAnonKey,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||r.status);return j}
$("go").onclick=async()=>{$("err").textContent="";try{const r=await fetch(B+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:C.supabaseAnonKey,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"Gagal masuk");tok=d.access_token;await muat();$("vLogin").hidden=true;$("vList").hidden=false}catch(e){$("err").textContent=e.message}};
$("out").onclick=()=>location.reload();
async function muat(){const L=await rpc("mitra_admin_daftar");$("list").innerHTML=L.map(m=>`<div class="b"><b>${esc(m.toko)}</b> <span class="s ${m.status}">${m.status}</span><div class="m">${esc(m.nama)} • WA ${esc(m.wa)}<br>${esc([m.kota,m.provinsi].filter(Boolean).join(", "))} • ${esc(m.jenis)}<br>Izin: <b>${esc(m.izin)}</b> • ${m.produk} produk<br>${esc(m.alamat||"")}</div>
 ${["aktif","ditolak","nonaktif"].filter(s=>s!==m.status).map(s=>`<button class="t ${s==="aktif"?"p":"r"}" onclick="atur(${m.id},'${s}')">${({aktif:"✓ Setujui / aktifkan",ditolak:"✕ Tolak",nonaktif:"Nonaktifkan"})[s]}</button>`).join("")}<button class="t" onclick="pin(${m.id})">Reset PIN</button> <a class="t" style="text-decoration:none;display:inline-block" target="_blank" href="https://wa.me/${m.wa}">WA</a></div>`).join("")||'<div class="b m">Belum ada pendaftar.</div>'}
window.atur=async(id,s)=>{if(s==="aktif"&&!confirm("Sudah memeriksa nomor izin edar di BPOM/NIB?"))return;try{await rpc("mitra_admin_atur",{p_id:id,p_status:s});await muat()}catch(e){alert(e.message)}};
window.pin=async id=>{const p=prompt("PIN baru (4-8 angka):");if(!p)return;try{await rpc("mitra_admin_pin",{p_id:id,p_pin:p});alert("PIN diganti. Sesi lama dikeluarkan.")}catch(e){alert(e.message)}};
</script></body></html>
