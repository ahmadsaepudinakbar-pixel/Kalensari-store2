<style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ================== PENGATURAN ==================
const MODEL = 'model-3d/skinocong.glb';
const EFEK = 'gambar-game/skin-boneka/efek/';
const ARENA = { img: 'gambar-game/84f363fc17.webp', w: 1600, h: 900,
  // area bisa dilewati (piksel gambar) — sama dengan game.html
  poly: [[300, 235], [1300, 235], [1440, 590], [1575, 645], [1575, 790], [1275, 790], [1195, 700], [405, 700], [325, 790], [25, 790], [25, 655], [160, 590]],
  // tungku api & lampu gerbang [x, y, besar, lampu?]
  api: [[435, 248, .8, 0], [1167, 248, .8, 0], [285, 565, 1, 0], [1322, 565, 1, 0], [393, 742, .55, 1], [1120, 742, .55, 1]],
  // pohon di pojok depan (gambar terpisah, menutupi hero yang lewat di belakangnya)
  pohon: [{ s: 'gambar-game/61b3955d9f.webp', x: 0, y: 600, w: 340, h: 207, kx: 175, ky: 725 }, { s: 'gambar-game/3078d24eab.webp', x: 1266, y: 604, w: 334, h: 193, kx: 1425, ky: 720 }],
};
// SUDUT KAMERA harus sama dengan sudut lukisan. Lingkaran tengah lapangan di gambar: lebar 290, tinggi 136 → sin(sudut) ≈ 0.47
const SUDUT = Math.asin(136 / 290);
const K = 80;                 // piksel gambar per meter
const TINGGI = 1.9;           // tinggi hero (meter)
const LEBAR_PANDANG = 700;    // lebar arena yang terlihat (piksel gambar) di layar mendatar
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const SN = Math.sin(SUDUT), CS = Math.cos(SUDUT);
// konversi: piksel gambar <-> dunia 3D (x kanan, z ke arah kamera, y atas)
const keDunia = (gx, gy, y = 0) => new THREE.Vector3(gx / K, y, gy / (K * SN));
const kePiksel = v => [v.x * K, v.z * K * SN];

// ================== RENDERER, SCENE, KAMERA ==================
const renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07060a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .3;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200);
const ARAH_KAM = new THREE.Vector3(0, SN, CS);    // dari titik fokus ke kamera

// cahaya hero disamakan dengan suasana senja di lukisan
scene.add(new THREE.HemisphereLight(0xffd2a0, 0x3a2420, 1.1));
const sun = new THREE.DirectionalLight(0xffb070, 2.4);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 50; sun.shadow.bias = -.0008; sun.shadow.normalBias = .03;
scene.add(sun, sun.target);

const texLoader = new THREE.TextureLoader();
const muatTex = url => new Promise((res, rej) => texLoader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; res(t); }, undefined, rej));
function tex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }

// ================== ARENA 2D ==================
const LANTAI_W = ARENA.w / K, LANTAI_D = ARENA.h / (K * SN);
let POHON = [];
async function buatArena() {
  const t = await muatTex(ARENA.img);
  // gambar arena dibentangkan sebagai lantai; dari sudut kamera ini tampilannya sama persis dengan lukisan
  const lantai = new THREE.Mesh(new THREE.PlaneGeometry(LANTAI_W, LANTAI_D), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
  lantai.rotation.x = -Math.PI / 2; lantai.position.set(LANTAI_W / 2, 0, LANTAI_D / 2); scene.add(lantai);
  // penangkap bayangan (bayangan hero jatuh di atas lukisan)
  const bay = new THREE.Mesh(new THREE.PlaneGeometry(LANTAI_W, LANTAI_D), new THREE.ShadowMaterial({ opacity: .45, color: 0x1a0c08 }));
  bay.rotation.x = -Math.PI / 2; bay.position.set(LANTAI_W / 2, .003, LANTAI_D / 2); bay.receiveShadow = true; scene.add(bay);
  // pohon: papan tegak menghadap kamera, kakinya di tanah → menutupi hero yang ada di belakangnya
  POHON = await Promise.all(ARENA.pohon.map(async p => {
    const tt = await muatTex(p.s);
    const m = new THREE.MeshBasicMaterial({ map: tt, transparent: true, alphaTest: .45, toneMapped: false });
    const me = new THREE.Mesh(new THREE.PlaneGeometry(p.w / K, p.h / K), m);
    me.geometry.translate(0, p.h / K / 2, 0);
    me.position.copy(keDunia(p.x + p.w / 2, p.y + p.h)); me.rotation.x = -SUDUT;   // tegak lurus arah pandang kamera me.renderOrder = 2; scene.add(me);
    return { me, m, p };
  }));
}
function diDalam(gx, gy) { const Q = ARENA.poly; let ins = false; for (let i = 0, j = Q.length - 1; i < Q.length; j = i++) { const a = Q[i], b = Q[j]; if ((a[1] > gy) !== (b[1] > gy) && gx < (b[0] - a[0]) * (gy - a[1]) / (b[1] - a[1]) + a[0]) ins = !ins; } return ins; }
function jepit(v) {   // tahan posisi dunia di dalam area lapangan
  let [gx, gy] = kePiksel(v); if (diDalam(gx, gy)) return v;
  const Q = ARENA.poly; let bx = gx, by = gy, bd = 1e9;
  for (let i = 0, j = Q.length - 1; i < Q.length; j = i++) { const a = Q[j], b = Q[i], dx = b[0] - a[0], dy = b[1] - a[1], t = Math.max(0, Math.min(1, ((gx - a[0]) * dx + (gy - a[1]) * dy) / (dx * dx + dy * dy || 1))), px = a[0] + dx * t, py = a[1] + dy * t, d = (px - gx) ** 2 + (py - gy) ** 2; if (d < bd) { bd = d; bx = px; by = py; } }
  const w = keDunia(bx, by); v.x = w.x; v.z = w.z; return v;
}
// skala kedalaman: makin ke depan (bawah layar) makin besar, mengikuti perspektif lukisan
const skalaDalam = v => { const gy = kePiksel(v)[1]; return .86 + .3 * THREE.MathUtils.clamp((gy - 235) / 555, 0, 1); };

// ================== API HIDUP ==================
const T_API = tex(64, 128, (x, w, h) => { const g = x.createRadialGradient(w / 2, h * .72, 2, w / 2, h * .6, h * .55); g.addColorStop(0, 'rgba(255,250,220,1)'); g.addColorStop(.25, 'rgba(255,190,80,.95)'); g.addColorStop(.6, 'rgba(255,90,20,.5)'); g.addColorStop(1, 'rgba(200,40,0,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(w / 2, h * .62, w / 2, h * .62, 0, 0, 7); x.fill(); });
const T_BULAT = tex(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.4, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });
const API = [];
function siapkanApi() {
  ARENA.api.forEach((a, i) => {
    const p = keDunia(a[0], a[1]), o = { p, s: a[2], lampu: a[3], ph: i * 1.7, sp: [] };
    if (!a[3]) for (let k = 0; k < 2; k++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: T_API, color: k ? 0xff7a30 : 0xffffff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true })); s.center.set(.5, .15); s.position.copy(p).setY(.15); s.renderOrder = 3; scene.add(s); o.sp.push(s); }
    o.light = new THREE.PointLight(a[3] ? 0xffc070 : 0xff8a3a, 0, a[3] ? 7 : 10, 1.5); o.light.position.copy(p).setY(1.2); scene.add(o.light);
    API.push(o);
  });
}
const BARA = { n: 120, v: [], a: [] };
function siapkanBara() {
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(BARA.n * 3), 3));
  for (let i = 0; i < BARA.n; i++) { BARA.v.push(new THREE.Vector3()); BARA.a.push(0); }
  BARA.p = new THREE.Points(geo, new THREE.PointsMaterial({ map: T_BULAT, color: 0xffa040, size: .1, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  BARA.p.frustumCulled = false; scene.add(BARA.p);
}
function updApi(t, dt) {
  API.forEach(a => { const k = .75 + .25 * Math.sin(t * 9 + a.ph) * Math.sin(t * 5.3 + a.ph) + Math.random() * .1;
    a.light.intensity = (a.lampu ? 5 : 11) * k;
    a.sp.forEach((s, j) => { const sc = a.s * (j ? .75 : .5) * (.9 + .2 * k); s.scale.set(sc * .8, sc * 1.5, 1); }); });
  const pos = BARA.p.geometry.attributes.position.array, tg = API.filter(a => !a.lampu);
  for (let i = 0; i < BARA.n; i++) { BARA.a[i] -= dt;
    if (BARA.a[i] <= 0) { const a = tg[i % tg.length]; pos[i * 3] = a.p.x + rnd(-.15, .15); pos[i * 3 + 1] = .4; pos[i * 3 + 2] = a.p.z + rnd(-.15, .15); BARA.v[i].set(rnd(-.2, .2), rnd(.8, 1.8), rnd(-.2, .2)); BARA.a[i] = rnd(.6, 1.6); }
    pos[i * 3] += (BARA.v[i].x + Math.sin(t * 2 + i) * .25) * dt; pos[i * 3 + 1] += BARA.v[i].y * dt; pos[i * 3 + 2] += BARA.v[i].z * dt; }
  BARA.p.geometry.attributes.position.needsUpdate = true;
}

// ================== KUALITAS ==================
const KUAL = { lv: 1, bloom: false };
let composer = null;
function setKual(lv) {
  KUAL.lv = lv; try { localStorage.setItem('uji2d3dKual', lv); } catch (e) { }
  document.querySelectorAll('#kual button').forEach(b => b.classList.toggle('on', +b.dataset.q === lv));
  renderer.setPixelRatio(Math.min(devicePixelRatio, [1, 1.5, 2][lv]));
  renderer.shadowMap.enabled = lv > 0; sun.castShadow = lv > 0; sun.shadow.mapSize.setScalar(lv === 2 ? 2048 : 1024);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  KUAL.bloom = lv === 2;
  scene.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); });
  resize();
}
document.querySelectorAll('#kual button').forEach(b => b.onclick = () => setKual(+b.dataset.q));
let viewW = 1, viewH = 1;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  const lebarPx = w < h ? LEBAR_PANDANG * .62 : LEBAR_PANDANG;      // HP tegak: lebih dekat
  viewW = lebarPx / K; viewH = viewW * h / w;
  camera.left = -viewW / 2; camera.right = viewW / 2; camera.top = viewH / 2; camera.bottom = -viewH / 2; camera.updateProjectionMatrix();
  if (KUAL.bloom) { if (!composer) { composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), .5, .45, .85)); composer.addPass(new OutputPass()); } composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
}
addEventListener('resize', resize);

// ================== EFEK 3D YANG MENYATU DENGAN HERO ==================
// lingkaran sihir: digambar rata di lantai (tampak lonjong dari sudut kamera, sama seperti lingkaran di lukisan)
const T_SIHIR = tex(512, 512, (x) => {
  x.translate(256, 256); x.strokeStyle = '#ff3a20'; x.shadowColor = '#ff2a10'; x.shadowBlur = 18; x.lineCap = 'round';
  [[240, 8], [222, 3], [170, 5], [150, 2]].forEach(([r, w]) => { x.lineWidth = w; x.beginPath(); x.arc(0, 0, r, 0, 7); x.stroke(); });
  x.lineWidth = 3; for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2; x.beginPath(); x.moveTo(Math.cos(a) * 226, Math.sin(a) * 226); x.lineTo(Math.cos(a) * (i % 4 ? 236 : 246), Math.sin(a) * (i % 4 ? 236 : 246)); x.stroke(); }
  x.font = 'bold 22px serif'; x.fillStyle = '#ff6a40'; for (let i = 0; i < 16; i++) { x.save(); x.rotate(i / 16 * Math.PI * 2); x.fillText('ᛟᚨᛞᛉᛗᛚᛜᛝ'[i % 8], -8, -186); x.restore(); }
  x.lineWidth = 5; x.beginPath(); for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + i * 4 * Math.PI / 5; i ? x.lineTo(Math.cos(a) * 150, Math.sin(a) * 150) : x.moveTo(Math.cos(a) * 150, Math.sin(a) * 150); } x.stroke();
  x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 58, 0, 7); x.stroke();
  const g = x.createRadialGradient(0, 0, 0, 0, 0, 250); g.addColorStop(0, 'rgba(255,80,40,.35)'); g.addColorStop(.6, 'rgba(255,40,20,.12)'); g.addColorStop(1, 'rgba(255,30,10,0)'); x.fillStyle = g; x.beginPath(); x.arc(0, 0, 250, 0, 7); x.fill();
});
const T_CINCIN = tex(256, 256, (x) => { const g = x.createRadialGradient(128, 128, 70, 128, 128, 128); g.addColorStop(0, 'rgba(255,60,30,0)'); g.addColorStop(.7, 'rgba(255,90,40,.9)'); g.addColorStop(.85, 'rgba(255,230,190,1)'); g.addColorStop(1, 'rgba(255,60,30,0)'); x.fillStyle = g; x.fillRect(0, 0, 256, 256); });
const T_TIANG = tex(32, 256, (x, w, h) => { const g = x.createLinearGradient(0, h, 0, 0); g.addColorStop(0, 'rgba(255,220,180,1)'); g.addColorStop(.3, 'rgba(255,80,40,.8)'); g.addColorStop(1, 'rgba(255,40,20,0)'); x.fillStyle = g; x.fillRect(0, 0, w, h); const s = x.createLinearGradient(0, 0, w, 0); s.addColorStop(0, 'rgba(0,0,0,1)'); s.addColorStop(.5, 'rgba(0,0,0,0)'); s.addColorStop(1, 'rgba(0,0,0,1)'); x.globalCompositeOperation = 'destination-out'; x.fillStyle = s; x.fillRect(0, 0, w, h); });
const FXT = {};
const FX_NAMA = ['dasar-ledakan', 's1-ledakan', 's3-lingkaran-4', 'ikon-dasar', 'ikon-skill1', 'ikon-skill2', 'ikon-skill3'];
const muatEfek = () => Promise.all(FX_NAMA.map(n => muatTex(EFEK + n + '.webp').then(t => FXT[n] = t).catch(() => 0)));
const FXS = [];
const tambah = (o, upd, umur, buang) => { scene.add(o); FXS.push({ o, upd, umur, t: 0, buang }); return o; };
const add = (map, warna = 0xffffff, op = 1) => new THREE.MeshBasicMaterial({ map, color: warna, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });

function lingkaranLantai(pos, R, umur, putar = 1.5) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), add(T_SIHIR)); m.rotation.x = -Math.PI / 2; m.position.copy(pos).setY(.02); m.renderOrder = 1;
  return tambah(m, (e, q) => { const s = R * Math.min(1, e.t / .18) ; m.scale.set(s, s, 1); m.rotation.z += putar * .016; m.material.opacity = Math.min(1, (e.umur - e.t) / .3); }, umur);
}
function gelombang(pos, R, umur = .5, warna = 0xff5030) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), add(T_CINCIN, warna)); m.rotation.x = -Math.PI / 2; m.position.copy(pos).setY(.03);
  return tambah(m, (e, q) => { const s = R * (.2 + .8 * (1 - (1 - q) ** 3)); m.scale.set(s, s, 1); m.material.opacity = 1 - q; }, umur);
}
function tiangCahaya(pos, n, R, umur) {   // tiang cahaya naik dari lingkaran

    if (P.kenaT <= 0) { let h = 0; MUSUH.forEach(m => { if (!m.mati && m.g.position.distanceTo(pos) < 1.1) { kena(m, 70, pos.clone().addScaledVector(f, -1), 4); h = 1; } }); if (h) { P.kenaT = .25; goyang = .1; } }
    if (Math.random() < .4) percik(pos, 3, 0x9a8a78, 1.5, .16, .6);
    if (t > .95) { P.state = 'bebas'; main('diam', .2); } }
  else if (P.state === 'lingkaran') { const t = P.t; main('diam', .1);
    if (t < .35) { P.tilt.rotation.y = (t / .35) * Math.PI * 2; P.tilt.position.y = Math.sin(t / .35 * Math.PI) * .4; }
    if (t > .45 && !P.hit) { P.hit = 1; tiangCahaya(pos.clone(), 8, 2.1, .9); ledakanGambar('s3-lingkaran-4', pos.clone(), 5.2, .7); gelombang(pos, 5.5, .6, 0xff3a10); gelombang(pos, 3.6, .5, 0xffb060);
      percik(pos, 70, 0xff4020, 6, .16); kilat(pos, 55); goyang = .35; MUSUH.forEach(m => { if (!m.mati && m.g.position.distanceTo(pos) < 2.7) kena(m, 190, pos, 8, 6); }); }
    if (t > 1.1) P.state = 'bebas'; }
  jepit(pos); P.root.scale.setScalar(skalaDalam(pos));
  let d = P.arah - P.root.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); P.root.rotation.y += d * Math.min(1, dt * 14);
  P.mixer && P.mixer.update(dt); aura(dt);
  // pohon jadi tembus pandang saat hero bersembunyi di baliknya
  const [gx, gy] = kePiksel(pos); POHON.forEach(t => { const di = ((gx - t.p.kx) / 150) ** 2 + ((gy - t.p.ky) / 62) ** 2 <= 1; t.m.opacity = di ? .55 : 1; t.m.alphaTest = di ? .02 : .45; t.m.depthWrite = !di; });
  ['bA', 'b1', 'b2', 'b3'].forEach((id, i) => { const b = $('#' + id), c = P.cd[i]; b.querySelector('.cd').style.background = c > 0 ? `conic-gradient(#000c ${c / CD_MAX[i]}turn,#0006 0)` : ''; b.querySelector('em').textContent = c > .5 && i ? Math.ceil(c) : ''; });
}

// ================== KAMERA (tidak berputar, mengikuti hero) ==================
const fokus = new THREE.Vector3();
function updKamera(dt) {
  fokus.lerp(P.root.position, Math.min(1, dt * 6)); const f = fokus.clone();
  // jangan sampai keluar dari gambar arena
  const hx = viewW / 2, hz = viewH / 2 / SN;
  f.x = viewW >= LANTAI_W ? LANTAI_W / 2 : THREE.MathUtils.clamp(f.x, hx, LANTAI_W - hx);
  f.z = viewH / SN >= LANTAI_D ? LANTAI_D / 2 : THREE.MathUtils.clamp(f.z, hz, LANTAI_D - hz);
  if (goyang > 0) { goyang -= dt; f.x += rnd(-1, 1) * goyang * .25; f.z += rnd(-1, 1) * goyang * .25; }
  camera.position.copy(f).addScaledVector(ARAH_KAM, 40); camera.lookAt(f);
  sun.position.copy(f).add(new THREE.Vector3(-6, 12, 5)); sun.target.position.copy(f);
}

// ================== MULAI ==================
async function mulai() {
  siapkanApi(); siapkanBara();
  let lv = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 1 : 2; try { const s = localStorage.getItem('uji2d3dKual'); if (s !== null) lv = +s; } catch (e) { }
  setKual(lv);
  try { await Promise.all([buatArena(), muatHero(x => $('#load .bar u').style.width = Math.round(x * 100) + '%'), muatEfek()]); }
  catch (e) { console.error(e); $('#load b').textContent = 'Arena / model tidak bisa dimuat'; $('#lmsg').textContent = 'Pastikan ' + MODEL + ' dan ' + ARENA.img + ' sudah diunggah.'; return; }
  [[620, 430], [1000, 420], [820, 600]].forEach(p => buatMusuh(p[0], p[1]));
  fokus.copy(P.root.position); $('#load').classList.add('off');
  let last = performance.now(), fN = 0, fT = 0, t0 = 0;
  renderer.setAnimationLoop(now => {
    let dt = Math.min(.05, (now - last) / 1000); last = now; t0 += dt;
    fN++; fT += dt; if (fT > .5) { $('#fps').textContent = Math.round(fN / fT) + ' fps · ' + ['Rendah', 'Sedang', 'Tinggi'][KUAL.lv]; fN = 0; fT = 0; }
    if (hentiSejenak > 0) { hentiSejenak -= dt; dt *= .15; }
    updHero(dt); updMusuh(dt); updEfek(dt); updApi(t0, dt); updKamera(dt); updLabel(dt);
    if (KUAL.bloom && composer) composer.render(); else renderer.render(scene, camera);
  });
}
mulai();
