<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a3d">
<title>Admin Kalensari Store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0f7a3d;--g2:#16a34a;--gl:#e8f6ee;--side:#172033;--side2:#1f2a40;
  --bg:#f3f6f9;--card:#fff;--tx:#1b2433;--mut:#6b7686;--line:#e9edf2;
  --blue:#3b82f6;--bl:#e8f0fe;--orange:#f97316;--ol:#fff1e6;--purple:#8b5cf6;--pl:#f1ebfe;--red:#ef4444;--rl:#fdecec;
  --r:16px;--sh:0 2px 10px rgba(20,30,50,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hide{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e9f8ef 0%,#fff 45%,#e3f5ea 100%);padding:24px}
.lbox{width:100%;max-width:380px;text-align:center}
.logo-big{width:110px;height:110px;margin:0 auto 10px}
.lbox h1{font-size:40px;font-weight:800;line-height:1;color:var(--g)}
.lbox h1 span{display:block;color:var(--g2)}
.lbox .sub{color:var(--g);margin:10px 0 36px;font-weight:600}
.lbox h2{font-size:18px;margin-bottom:6px}
.lbox p.m{color:var(--mut);margin-bottom:24px}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.btn:disabled{cursor:wait}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700}
.btn-g{background:var(--g);color:#fff}.btn-g:active{transform:scale(.98)}
.btn-o{border:1.5px solid var(--g);color:var(--g);background:#fff}
.btn-light{background:var(--gl);color:var(--g)}
.btn-red{background:var(--rl);color:var(--red)}
.full{width:100%}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--side);color:#c9d1de;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:40;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand b{color:#fff;font-size:20px;line-height:1.05;font-weight:800}
.brand b span{display:block;color:#4ade80}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;margin-bottom:4px;cursor:pointer;font-weight:500;color:#c9d1de;text-decoration:none}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--g2);color:#fff;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--g2);color:#fff;font-size:11px;border-radius:99px;padding:2px 8px;font-weight:700}
.nav a.on .cnt{background:#fff;color:var(--g)}
.sidebar .bottom{margin-top:auto;border-top:1px solid #2a3550;padding-top:12px}
.main{flex:1;margin-left:250px;min-width:0}
.top{background:#fff;display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top h1{font-size:24px;font-weight:800}
.top .welcome{color:var(--mut);font-size:13px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:20px}
.bell{position:relative;color:var(--mut)}
.bell .dot{position:absolute;top:-6px;right:-7px;background:var(--red);color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:700}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800}
.who b{display:block;font-size:14px}.who small{color:var(--mut);font-size:12px}
.burger{display:none}
.content{padding:24px 28px 40px}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3{font-size:17px;font-weight:700}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.link{color:var(--blue);font-size:13px;font-weight:600;cursor:pointer}
.grid-dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.grid-dash>div,.row2>div{min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{display:flex;gap:14px;align-items:flex-start}
.ic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ic svg.i{width:26px;height:26px}
.stat .lbl{font-size:13px;color:var(--tx);font-weight:500}
.stat .val{font-size:clamp(17px,1.6vw,24px);font-weight:800;margin:4px 0;white-space:nowrap}
.up{color:var(--g2);font-size:12px;font-weight:700}
.stat small{display:block;color:var(--mut);font-size:11px}
.row2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:12px}
.donutwrap{display:flex;align-items:center;gap:24px}
.donut{width:160px;height:160px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:11px;color:var(--mut)}
.donut .c b{font-size:22px;color:var(--tx)}
.legend{flex:1}
.legend div{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.legend i{width:12px;height:12px;border-radius:50%}
.legend span:last-child{margin-left:auto;font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:#f6f8fa;text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px}
td{white-space:nowrap;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.pimg{width:42px;height:42px;border-radius:10px;background:#fff7ed;display:inline-flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pcell{display:flex;align-items:center;gap:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.b-Baru{background:var(--bl);color:var(--blue)}
.b-Diproses{background:var(--ol);color:var(--orange)}
.b-Dikirim{background:var(--pl);color:var(--purple)}
.b-Selesai{background:var(--gl);color:var(--g2)}
.b-Batal{background:var(--rl);color:var(--red)}
.banner{background:linear-gradient(120deg,var(--g),#1aa556);color:#fff;border-radius:var(--r);padding:22px;display:flex;align-items:center;gap:14px;margin-bottom:20px;position:relative;overflow:hidden}
.banner b{font-size:19px;display:block}.banner small{opacity:.9}
.banner::after{content:"🛒";position:absolute;right:10px;bottom:-6px;font-size:52px;opacity:.25}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtn{border-radius:12px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:600}
.qbtn .qi{width:36px;height:36px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center}
.olist .it{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.olist .it:last-child{border:0}
.olist .meta{flex:1;min-width:0}
.olist b{font-size:13px;display:block}
.olist .sm{font-size:12px;color:var(--mut)}
.olist .pr{font-weight:700;font-size:13px;margin:3px 0}

/* LIST PAGES */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--mut)}
.search input{border:0;outline:0;padding:11px 0;width:100%;background:none;color:var(--tx)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab .n{font-size:11px;border-radius:99px;padding:1px 7px;background:#eef1f5}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.tab.on .n{background:rgba(255,255,255,.25)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:14px;display:flex;gap:12px;align-items:center}
.lc .meta{flex:1;min-width:0}
.lc b{display:block;font-size:14px}
.lc .sm{font-size:12px;color:var(--mut)}
.lc .pr{font-weight:700;margin:2px 0}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.more{color:var(--mut);padding:4px;border-radius:8px}.more:hover{background:#f1f3f6}
.sw{width:40px;height:22px;border-radius:99px;background:#cfd5dd;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g2)}.sw.on::after{left:21px}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.ms{border-radius:14px;padding:16px}
.ms .lbl{font-size:12px;font-weight:600;margin:8px 0 4px}
.ms .val{font-size:22px;font-weight:800}
.ms .ic{width:34px;height:34px;border-radius:9px}.ms .ic svg.i{width:18px;height:18px}
.promo-tag{width:80px;height:72px;border-radius:12px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1;transform:rotate(-4deg);flex-shrink:0;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.cat-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ppl{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:linear-gradient(180deg,#22c55e,var(--g));border-radius:6px 6px 0 0;position:relative;min-height:4px;transition:height .4s}
.bars div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.blabels{display:flex;gap:12px;padding:6px 4px 0}.blabels span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bank{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.bank .bl{font-weight:900;color:#0b3d91;width:46px;font-size:13px}
.menu-list a{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500;color:var(--tx);text-decoration:none}
.menu-list a .ch{margin-left:auto;color:#b6bec9}
.profile-head{background:linear-gradient(120deg,var(--g),#1aa556);color:#fff;border-radius:var(--r);padding:22px;display:flex;align-items:center;gap:14px;margin-bottom:16px}

/* MOBILE NAV */
.bnav{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:35}

/* MODAL / TOAST */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:22px}
.mbox h3{font-size:18px;margin-bottom:16px}
.mact{display:flex;gap:10px;margin-top:18px}.mact .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.st-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-pick button{padding:10px;border-radius:10px;border:1.5px solid var(--line);font-weight:600}
.st-pick button.on{border-color:var(--g2);background:var(--gl);color:var(--g)}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}

/* RESPONSIVE */
.tbl-wrap{overflow-x:auto}
@media(max-width:1440px){.stats{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1200px){.grid-dash{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .main{margin-left:0}
  .burger{display:flex}
  .top{padding:12px 16px;background:var(--g);color:#fff;border:0}
  .top h1{font-size:18px}.top .welcome,.who,.top .chev{display:none}
  .bell{color:#fff}.avatar{width:34px;height:34px}
  .content{padding:16px 14px 96px}
  .row2,.form-grid{grid-template-columns:1fr}
  .stats{gap:12px}
  .stat{flex-direction:column;gap:8px}
  .ic{width:40px;height:40px;border-radius:11px}.ic svg.i{width:20px;height:20px}
  .stat .val{font-size:19px}
  .card{padding:16px}
  .donut{width:130px;height:130px}.donut::after{inset:22px}
  .hide-m{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);padding:4px 0;font-weight:600}
  .bnav button.on{color:var(--g)}
  .cards{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
}
@media(max-width:420px){.donutwrap{flex-direction:column;align-items:stretch}.donut{margin:0 auto}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="lbox">
    <svg class="logo-big" viewBox="0 0 100 100"><path d="M30 34 50 12 70 34" fill="none" stroke="#0f7a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="32" width="80" height="12" rx="4" fill="#0f7a3d"/><path d="M15 44h70l-7 44a6 6 0 0 1-6 5H28a6 6 0 0 1-6-5z" fill="#16a34a"/><text x="50" y="80" text-anchor="middle" font-size="28" font-weight="900" fill="#fff" font-family="Plus Jakarta Sans,sans-serif">KS</text></svg>
    <h1>Kalensari<span>Store</span></h1>
    <div class="sub">Panel Admin</div>
    <h2>Selamat datang di Kalensari Store</h2>
    <p class="m">Kelola toko Anda dengan mudah dan praktis</p>
    <div class="field"><label>Email admin</label><input class="inp" id="lUser" type="email" autocomplete="username" placeholder="email@contoh.com"></div>
    <div class="field"><label>Kata sandi</label><input class="inp" id="lPass" type="password" autocomplete="current-password" placeholder="Kata sandi"></div>
    <button class="btn btn-g full" id="lBtn" onclick="doLogin()" style="margin-top:8px">Masuk</button>
    <p class="m" style="margin:14px 0 0;font-size:12px">Pakai akun admin yang sama dengan menu ⚙️ Admin di toko.</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hide">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 100 100"><path d="M30 34 50 12 70 34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="32" width="80" height="12" rx="4" fill="#16a34a"/><path d="M15 44h70l-7 44a6 6 0 0 1-6 5H28a6 6 0 0 1-6-5z" fill="#16a34a"/><text x="50" y="80" text-anchor="middle" font-size="28" font-weight="900" fill="#fff" font-family="Plus Jakarta Sans,sans-serif">KS</text></svg>
      <b>Kalensari<span>Store</span></b>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="bottom nav"><a onclick="logout()"><svg class="i"><use href="#i-out"/></svg>Logout</a></div>
  </aside>
  <div class="overlay hide" id="overlay" onclick="toggleSide(false)"></div>

  <main class="main">
    <header class="top">
      <button class="burger" onclick="toggleSide(true)"><svg class="i"><use href="#i-menu"/></svg></button>
      <div><h1 id="pTitle">Dashboard</h1><div class="welcome" id="pSub">Ringkasan toko dari data asli</div></div>
      <div class="right">
        <button class="bell" onclick="go('pesanan','Baru')"><svg class="i" style="width:22px;height:22px"><use href="#i-bell"/></svg><span class="dot hide" id="bellN">0</span></button>
        <div style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="go('lainnya')">
          <div class="avatar" id="avatarL">A</div>
          <div class="who"><b id="whoName">Admin</b><small>Administrator</small></div>
          <svg class="i chev" style="width:16px;color:var(--mut)"><use href="#i-down"/></svg>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <nav class="bnav" id="bnav"></nav>
</div>

<div id="modalRoot"></div>

<!-- ICONS -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 8M22 21a6 6 0 0 0-4-5.6"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M3 9 5 4h14l2 5M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 13v7h14v-7M10 20v-4h4v4"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-5M12 17V8M16 17v-3"/></symbol>

<script src="config.js"></script>
<script>
/* =====================================================================
   ADMIN KALENSARI STORE — tersambung ke data asli Supabase
   Login memakai akun admin Supabase yang sama dengan menu ⚙️ Admin di toko.
   ===================================================================== */
const CFG=window.CLOUD_CONFIG||{};
const BASE=String(CFG.supabaseUrl||'').replace(/\/$/,'');
const AUTH_KEY='kalensari_admin_auth';
let auth=(()=>{try{return JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}})();
const saveAuth=a=>{auth=a;try{a?sessionStorage.setItem(AUTH_KEY,JSON.stringify(a)):sessionStorage.removeItem(AUTH_KEY)}catch(e){}};
async function authReq(grant,body){
  const r=await fetch(`${BASE}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return {access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),email:(d.user&&d.user.email)||''};
}
async function fresh(){
  if(!auth||!auth.refresh_token)throw new Error('login');
  if(auth.expires_at*1000-Date.now()>60000)return;
  try{saveAuth({...await authReq('refresh_token',{refresh_token:auth.refresh_token}),email:auth.email})}
  catch(e){saveAuth(null);throw new Error('login')}
}
async function api(path,opt={}){
  try{await fresh()}catch(e){sessionExpired();throw e}
  const r=await fetch(`${BASE}/rest/v1/${path}`,{...opt,headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+auth.access_token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  const t=await r.text();
  if(!r.ok)throw new Error(t||('HTTP '+r.status));
  return t?JSON.parse(t):[];
}
const setSetting=(key,value)=>api('store_settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{key,value}])});

/* ========== DATA ASLI ========== */
const S={products:[],orders:[],settings:{},loaded:false};
const BASE_CATS=['Makanan','Minuman'];
const STATUS_LABEL={menunggu:'Baru',baru:'Baru',diproses:'Diproses',dikirim:'Dikirim',selesai:'Selesai',dibatalkan:'Batal'};
const STATUS_DB={Baru:'menunggu',Diproses:'diproses',Dikirim:'dikirim',Selesai:'selesai',Batal:'dibatalkan'};
const stLabel=s=>STATUS_LABEL[String(s||'').toLowerCase()]||'Baru';
const phoneKey=v=>String(v||'').replace(/\D/g,'').replace(/^0/,'62');
const itemPrice=it=>Number(it.sale)>0&&Number(it.sale)<Number(it.price)?Number(it.sale):Number(it.price)||0;
const isCancelled=o=>stLabel(o.status)==='Batal';

async function loadAll(silent){
  try{
    const [p,o,s]=await Promise.all([
      api('products?select=*&order=id.asc'),
      api('orders?select=*&order=created_at.desc&limit=1000'),
      api('store_settings?select=key,value')
    ]);
    S.products=Array.isArray(p)?p:[];S.orders=Array.isArray(o)?o:[];
    S.settings={};(Array.isArray(s)?s:[]).forEach(r=>S.settings[r.key]=r.value);
    S.loaded=true;render();if(!silent)toast('Data terbaru dimuat');
  }catch(e){if(e.message!=='login'){console.error(e);toast('Gagal memuat data: '+String(e.message).slice(0,70))}}
}
const customCats=()=>Array.isArray(S.settings.categories)?S.settings.categories:[];
const removedCats=()=>Array.isArray(S.settings.removed_categories)?S.settings.removed_categories:[];
function allCats(){
  const used=new Set(S.products.map(p=>p.category).filter(Boolean));
  return [...new Set([...BASE_CATS,...customCats(),...used])].filter(c=>!removedCats().includes(c)||used.has(c));
}
const catEmoji=c=>/minum|jus|es |kopi|teh/i.test(c)?'🥤':/makan|nasi|mie|kue|jajan/i.test(c)?'🍛':'🏷️';
const prodThumb=(p,size)=>p&&p.image?`<img src="${esc(p.image)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" loading="lazy" onerror="this.replaceWith(document.createTextNode('${catEmoji(p.category||'')}'))">`:catEmoji((p&&p.category)||'');

// Penjualan per produk dihitung dari pesanan yang tidak dibatalkan.
function soldMap(orders=S.orders){
  const m=new Map();
  orders.filter(o=>!isCancelled(o)).forEach(o=>(Array.isArray(o.items)?o.items:[]).forEach(it=>{
    const k=it.id!=null?'id:'+it.id:'n:'+it.name;const cur=m.get(k)||{name:it.name,qty:0,rev:0,id:it.id};
    const q=Number(it.qty)||1;cur.qty+=q;cur.rev+=itemPrice(it)*q;m.set(k,cur);}));
  return m;
}
const soldOf=p=>{const m=soldMap();return (m.get('id:'+p.id)||{qty:0}).qty};
function customers(orders=S.orders){
  const m=new Map();
  orders.forEach(o=>{const k=phoneKey(o.customer_phone)||('nama:'+(o.customer_name||'-'));
    const c=m.get(k)||{name:o.customer_name||'Tanpa nama',wa:o.customer_phone||'',orders:0,spent:0,first:o.created_at,last:o.created_at};
    c.orders++;if(!isCancelled(o))c.spent+=Number(o.total)||0;
    if(o.created_at<c.first)c.first=o.created_at;if(o.created_at>c.last){c.last=o.created_at;c.name=o.customer_name||c.name}
    m.set(k,c);});
  return [...m.values()].sort((a,b)=>b.orders-a.orders||b.spent-a.spent);
}
const revenue=(orders=S.orders)=>orders.filter(o=>!isCancelled(o)).reduce((a,o)=>a+(Number(o.total)||0),0);
const inDays=(o,d)=>Date.now()-new Date(o.created_at).getTime()<=d*864e5;
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);out.push(d)}return out}
const fmtDay=d=>d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
const fmtTime=d=>new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const fmtDate=d=>new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function ago(d){const s=(Date.now()-new Date(d).getTime())/1000;if(s<60)return 'baru saja';if(s<3600)return Math.floor(s/60)+' menit yang lalu';if(s<86400)return Math.floor(s/3600)+' jam yang lalu';if(s<86400*30)return Math.floor(s/86400)+' hari yang lalu';return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
const orderCode=o=>o.order_code||('#'+o.id);
const cleanMap=t=>String(t||'').replace(/\s*__KS_MAP__-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?__END__\s*/g,' ').trim();
const firstItem=o=>(Array.isArray(o.items)&&o.items[0])||null;

/* ========== HELPERS ========== */
const $=s=>document.querySelector(s);
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const ico=(n,st='')=>`<svg class="i" style="${st}"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq=s=>esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const colors=['#16a34a','#3b82f6','#f97316','#8b5cf6','#ec4899','#0ea5e9','#ef4444','#eab308'];
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="mbox">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
async function busy(btn,fn){if(btn){btn.disabled=true;btn.style.opacity=.6}try{return await fn()}catch(e){if(e.message!=='login'){console.error(e);toast('Gagal menyimpan: '+String(e.message).slice(0,80))}}finally{if(btn){btn.disabled=false;btn.style.opacity=''}}}

/* ========== NAVIGASI ========== */
const MENU=[
  ['dashboard','Dashboard','home'],['pesanan','Pesanan','doc'],['produk','Produk','box'],['kategori','Kategori','list'],
  ['pelanggan','Pelanggan','users'],['toko','Daftar Toko','store'],['kurir','Daftar Kurir','truck'],['persetujuan','Persetujuan','check'],['promosi','Promosi','tag'],['laporan','Laporan','chart'],['pengaturan','Pengaturan','gear']
];
const BNAV=[['dashboard','Beranda','home'],['pesanan','Pesanan','doc'],['produk','Produk','box'],['pelanggan','Pelanggan','users'],['lainnya','Lainnya','dots']];
let route='dashboard',orderFilter='Semua',prodFilter='Semua',q='',repTab='Ringkasan',repDays=30,chartDays=7;

function renderNav(){
  const aktif=S.orders.filter(o=>['Baru','Diproses'].includes(stLabel(o.status))).length;
  $('#nav').innerHTML=MENU.map(([k,l,i])=>`<a class="${route===k?'on':''}" onclick="go('${k}')">${ico(i)}${l}${k==='pesanan'&&aktif?`<span class="cnt">${aktif}</span>`:''}${k==='persetujuan'&&pendingTotal()?`<span class="cnt" style="background:var(--orange)">${pendingTotal()}</span>`:''}</a>`).join('');
  $('#bnav').innerHTML=BNAV.map(([k,l,i])=>{
    const on=route===k||(k==='lainnya'&&['kategori','toko','kurir','persetujuan','promosi','laporan','pengaturan','lainnya'].includes(route));
    const dot=k==='lainnya'&&pendingTotal()?`<span style="position:absolute;top:2px;right:calc(50% - 16px);background:var(--orange);color:#fff;font-size:10px;border-radius:99px;min-width:16px;padding:0 4px;font-weight:700">${pendingTotal()}</span>`:'';
    return `<button class="${on?'on':''}" style="position:relative" onclick="go('${k}')">${ico(i,'width:22px;height:22px')}${l}${dot}</button>`}).join('');
  const baru=S.orders.filter(o=>stLabel(o.status)==='Baru').length;
  $('#bellN').textContent=baru;$('#bellN').classList.toggle('hide',!baru);
}
function go(r,filter){
  route=r;q='';if(r==='pesanan')orderFilter=filter||'Semua';
  if(r==='persetujuan'&&typeof GROUPS!=='undefined'&&!pendingOf(apTab).length){const g=GROUPS.find(x=>pendingOf(x.k).length);if(g)apTab=g.k}
  toggleSide(false);render();window.scrollTo(0,0);
}
function toggleSide(o){$('#sidebar').classList.toggle('open',o);$('#overlay').classList.toggle('hide',!o)}

/* ========== LOGIN ========== */
async function doLogin(){
  const em=$('#lUser').value.trim(),pw=$('#lPass').value,btn=$('#lBtn');
  if(!em||!pw){toast('Isi email dan kata sandi');return}
  if(!BASE||!CFG.supabaseAnonKey){toast('config.js belum berisi data Supabase');return}
  btn.disabled=true;const t=btn.textContent;btn.textContent='Memeriksa...';
  try{
    const sess=await authReq('password',{email:em,password:pw});
    const r=await fetch(`${BASE}/rest/v1/rpc/is_admin`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok)throw new Error('cek-admin-gagal');
    if((await r.json())!==true){fetch(`${BASE}/auth/v1/logout`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+sess.access_token}}).catch(()=>{});throw new Error('bukan-admin')}
    saveAuth(sess);$('#lPass').value='';enterApp();
  }catch(e){
    const m=String(e.message||e);
    toast(m==='bukan-admin'?'Akun ini bukan admin':m==='cek-admin-gagal'?'Jalankan supabase-admin-auth.sql di Supabase dulu':/invalid|credentials/i.test(m)?'Email atau kata sandi salah':/confirm/i.test(m)?'Email admin belum dikonfirmasi':'Gagal masuk: '+m.slice(0,70));
  }finally{btn.disabled=false;btn.textContent=t}
}
function enterApp(){
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  const em=(auth&&auth.email)||'Admin';$('#whoName').textContent=em.split('@')[0];$('#avatarL').textContent=initials(em);
  go('dashboard');loadAll(true);
}
function logout(){
  if(auth&&auth.access_token)fetch(`${BASE}/auth/v1/logout`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+auth.access_token}}).catch(()=>{});
  saveAuth(null);S.loaded=false;$('#app').classList.add('hide');$('#login').classList.remove('hide');toggleSide(false);closeModal();
}
function sessionExpired(){if(!$('#app').classList.contains('hide')){logout();toast('Sesi admin habis, silakan masuk lagi')}}

const TITLES={dashboard:['Dashboard','Ringkasan toko dari data asli'],pesanan:['Pesanan','Kelola semua pesanan masuk'],
  produk:['Produk','Atur produk, harga, dan stok'],kategori:['Kategori','Kelompokkan produk toko'],pelanggan:['Pelanggan','Dihitung dari pesanan yang masuk'],
  promosi:['Promosi','Produk dengan harga coret (diskon)'],laporan:['Laporan','Ringkasan penjualan toko'],pengaturan:['Pengaturan Toko','WhatsApp toko dan akun admin'],lainnya:['Menu','Semua menu admin']};

function render(){
  renderNav();
  const [t,s]=TITLES[route];$('#pTitle').textContent=t;$('#pSub').textContent=s;
  $('#content').innerHTML=S.loaded||route==='lainnya'?PAGES[route]():'<div class="empty">Memuat data toko...</div>';
}

/* ========== GRAFIK ========== */
function lineChart(data,labels){
  const W=520,H=210,pl=30,pb=26,pt=10,rawMax=Math.max(...data,0),step=Math.max(1,Math.ceil(rawMax/4)),max=step*4||4;
  const n=Math.max(data.length-1,1),x=i=>pl+i*(W-pl-10)/n,y=v=>pt+(H-pt-pb)*(1-v/max);
  let grid='';for(let v=0;v<=max;v+=step)grid+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f4"/><text x="${pl-8}" y="${y(v)+4}" font-size="10" fill="#8a94a3" text-anchor="end">${v}</text>`;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');const every=Math.ceil(data.length/8);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a34a" stop-opacity=".22"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></linearGradient></defs>
    ${grid}<polygon points="${x(0)},${y(0)} ${pts} ${x(data.length-1)},${y(0)}" fill="url(#gf)"/>
    <polyline points="${pts}" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    ${data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${data.length>10?3:4}" fill="#16a34a" stroke="#fff" stroke-width="2"><title>${labels[i]}: ${v} pesanan</title></circle>${i%every===0||i===data.length-1?`<text x="${x(i)}" y="${H-6}" font-size="10" fill="#8a94a3" text-anchor="${i===0?'start':i===data.length-1?'end':'middle'}">${labels[i]}</text>`:''}`).join('')}
  </svg>`;
}
function ordersPerDay(n){const days=lastDays(n),m=new Map(days.map(d=>[dayKey(d),0]));S.orders.forEach(o=>{const k=dayKey(o.created_at);if(m.has(k))m.set(k,m.get(k)+1)});return{labels:days.map(fmtDay),data:days.map(d=>m.get(dayKey(d)))}}
function catShare(){
  const counts=new Map();S.products.forEach(p=>{const c=p.category||'Lainnya';counts.set(c,(counts.get(c)||0)+1)});
  const rows=[...counts.entries()].sort((a,b)=>b[1]-a[1]);const total=S.products.length;
  if(!total)return '<div class="empty">Belum ada produk</div>';
  let acc=0;const grad=rows.map(([c,n],i)=>{const s=acc;acc+=n/total*100;return `${colors[i%colors.length]} ${s}% ${acc}%`}).join(',');
  return `<div class="donutwrap"><div class="donut" style="background:conic-gradient(${grad})"><div class="c">Total Produk<b>${total}</b></div></div>
  <div class="legend">${rows.map(([c,n],i)=>`<div><i style="background:${colors[i%colors.length]}"></i><span>${esc(c)}</span><span>${n} (${Math.round(n/total*100)}%)</span></div>`).join('')}</div></div>`;
}

/* ========== HALAMAN ========== */
const stat=(lbl,val,note,icon,bg)=>`<div class="card stat"><div class="ic" style="background:${bg}">${ico(icon)}</div><div><div class="lbl">${lbl}</div><div class="val">${val}</div><small>${note}</small></div></div>`;
const statusBadge=o=>{const s=stLabel(o.status);return `<span class="badge b-${s}">${s}</span>`};
const orderItem=o=>{const it=firstItem(o),n=Array.isArray(o.items)?o.items.length:0;return `<div class="it" onclick="openOrder(${Number(o.id)})"><div class="pimg" style="overflow:hidden">${prodThumb(it)}</div><div class="meta"><b>${esc(o.customer_name||'Tanpa nama')}</b><div class="sm">${esc(orderCode(o))}${n>1?` · ${n} item`:''}</div><div class="pr">${rp(o.total)}</div><div class="sm">${ago(o.created_at)}</div></div><div style="align-self:flex-start">${statusBadge(o)}</div></div>`};
const soldTotal=()=>[...soldMap().values()].reduce((a,x)=>a+x.qty,0);

const PAGES={
dashboard(){
  const sm=soldMap();
  const top=S.products.map(p=>({p,s:sm.get('id:'+p.id)||{qty:0,rev:0}})).filter(x=>x.s.qty>0).sort((a,b)=>b.s.qty-a.s.qty).slice(0,5);
  const today=S.orders.filter(o=>dayKey(o.created_at)===dayKey(new Date()));
  const ch=ordersPerDay(chartDays);
  return `<div class="grid-dash"><div>
    <div class="stats">
      ${stat('Total Pesanan',S.orders.length.toLocaleString('id-ID'),`${S.orders.filter(o=>inDays(o,30)).length} dalam 30 hari`,'bag','#0f7a3d')}
      ${stat('Total Pelanggan',customers().length.toLocaleString('id-ID'),'nomor WA berbeda','users','#3b82f6')}
      ${stat('Total Pendapatan',rp(revenue()),'tanpa pesanan batal','rp','#f97316')}

      <div class="card"><div class="chead"><h3>Kategori Produk</h3></div>${catShare()}</div>
    </div>
    <div class="row2">
      <div class="card"><div class="chead"><h3>Produk Terlaris</h3><span class="link" onclick="go('laporan');repTab='Penjualan';render()">Lihat Semua</span></div>
        ${top.length?`<div class="tbl-wrap"><table><tr><th>No</th><th>Produk</th><th>Terjual</th><th>Pendapatan</th></tr>

pesanan(){

  const cnt=s=>s==='Semua'?S.orders.length:S.orders.filter(o=>stLabel(o.status)===s).length;

laporan(){
  const os=S.orders.filter(o=>inDays(o,repDays)),ok=os.filter(o=>!isCancelled(o));
  const tabs=['Ringkasan','Penjualan','Pelanggan'];let body='';
  if(repTab==='Ringkasan'){const rev=revenue(os);body=`<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="ms" style="background:var(--gl)"><div class="ic" style="background:var(--g2)">${ico('bag')}</div><div class="lbl">Total Pendapatan</div><div class="val">${rp(rev)}</div></div>

      <div class="ms" style="background:var(--pl)"><div class="ic" style="background:var(--purple)">${ico('rp')}</div><div class="lbl">Rata-rata Order</div><div class="val">${rp(ok.length?Math.round(rev/ok.length):0)}</div></div></div>`}
  else if(repTab==='Penjualan'){const rows=[...soldMap(os).values()].sort((a,b)=>b.qty-a.qty);body=`<div class="card" style="margin-bottom:16px"><div class="tbl-wrap"><table><tr><th>Produk</th><th>Terjual</th><th>Pendapatan</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.qty}</td><td>${rp(r.rev)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Belum ada penjualan</td></tr>'}</table></div></div>`}
  else{const rows=customers(os);body=`<div class="card" style="margin-bottom:16px"><div class="tbl-wrap"><table><tr><th>Pelanggan</th><th>No. WA</th><th>Pesanan</th><th>Belanja</th></tr>${rows.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.wa)}</td><td>${c.orders}</td><td>${rp(c.spent)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada pelanggan</td></tr>'}</table></div></div>`}
  const bd=Math.min(repDays,30),days=lastDays(bd),m=new Map(days.map(d=>[dayKey(d),0]));ok.forEach(o=>{const k=dayKey(o.created_at);if(m.has(k))m.set(k,m.get(k)+(Number(o.total)||0))});
  const vals=days.map(d=>m.get(dayKey(d))),max=Math.max(...vals,1),every=Math.ceil(bd/8);
  const short=v=>v>=1e6?(v/1e6).toFixed(1)+' jt':v>=1e3?Math.round(v/1e3)+' rb':v||'';
  return `<div class="toolbar"><div class="search" style="max-width:320px">${ico('cal')}<select style="border:0;outline:0;padding:11px 0;width:100%;background:none" onchange="repDays=+this.value;render()">${[[7,'7 hari terakhir'],[30,'30 hari terakhir'],[90,'90 hari terakhir'],[3650,'Semua waktu']].map(([v,l])=>`<option value="${v}" ${repDays===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${repTab===t?'on':''}" onclick="repTab='${t}';render()">${t}</button>`).join('')}</div>
  ${body}
  <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Pendapatan per Hari</h3><span class="sm" style="color:var(--mut);font-size:12px">${bd} hari terakhir</span></div>
    <div class="bars" style="margin-top:20px;gap:${bd>10?3:12}px">${vals.map(v=>`<div style="height:${v/max*100}%" title="${rp(v)}">${bd<=10?`<span>${short(v)}</span>`:''}</div>`).join('')}</div>
    <div class="blabels" style="gap:${bd>10?3:12}px">${days.map((d,i)=>`<span>${i%every===0?fmtDay(d):''}</span>`).join('')}</div></div>
  <button class="btn btn-g full" onclick="exportCSV()">${ico('dl')}Export Laporan (CSV)</button>`;
},

/* ========== MITRA: TOKO, KURIR, PERSETUJUAN ========== */
// Data sama dengan menu ⚙️ Admin di toko: penjual_members, kurir_members, jasa_members (+ *_accounts),
// closed_sellers (tutup paksa) dan seller_schedule (jadwal otomatis, waktu WIB).
const GROUPS=[
  {k:'kurir',label:'Kurir',em:'🛵',info:m=>[m.kendaraan,m.wilayah].filter(Boolean).join(' • ')||'-'},
  {k:'jasa',label:'Penyedia Jasa',em:'🤝',info:m=>[m.kategori,m.dusun].filter(Boolean).join(' • ')||'-'},
  {k:'penjual',label:'Penjual',em:'🏪',info:m=>[m.toko||m.usaha,m.dusun].filter(Boolean).join(' • ')||'-'}
];
const members=k=>(Array.isArray(S.settings[k+'_members'])?S.settings[k+'_members']:[]).filter(Boolean);
const pendingOf=k=>members(k).filter(m=>m.pending===true);
const pendingTotal=()=>GROUPS.reduce((t,g)=>t+pendingOf(g.k).length,0);
async function readKey(key,def){const r=await api('store_settings?select=value&key=eq.'+encodeURIComponent(key));return r[0]&&r[0].value!=null?r[0].value:def}
const sKey=n=>String(n||'').trim().toLowerCase();
const sellerNames=p=>String(p.seller||'').split(',').map(x=>x.trim()).filter(Boolean);
const closedMap=()=>S.settings.closed_sellers&&typeof S.settings.closed_sellers==='object'&&!Array.isArray(S.settings.closed_sellers)?S.settings.closed_sellers:{};
const schedMap=()=>S.settings.seller_schedule&&typeof S.settings.seller_schedule==='object'&&!Array.isArray(S.settings.seller_schedule)?S.settings.seller_schedule:{};
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const tMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(t||''));return m?+m[1]*60+ +m[2]:null};
const wibNow=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{d:`${p.year}-${p.month}-${p.day}`,m:+p.hour*60+ +p.minute}};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const prevDay=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-1);return t.toISOString().slice(0,10)};
const offOn=(s,d)=>(s.off||[]).includes(dow(d))||(s.h||[]).includes(d);
function sellerState(name){
  const k=sKey(name);if(closedMap()[k])return{open:false,why:'Ditutup admin'};
  const s=schedMap()[k];if(!s)return{open:true,why:''};
  const {d,m}=wibNow(),o=tMin(s.o),c=tMin(s.c),hasT=o!==null&&c!==null&&o!==c;let open;
  if(!hasT)open=!offOn(s,d);else if(o<c)open=!offOn(s,d)&&m>=o&&m<c;else open=(m>=o&&!offOn(s,d))||(m<c&&!offOn(s,prevDay(d)));
  return open?{open:true,why:''}:{open:false,why:offOn(s,d)?'Libur hari ini':`Buka ${String(s.o).slice(0,5)}–${String(s.c).slice(0,5)} WIB`};
}
const schedText=s=>!s?'Belum diatur':[s.o&&s.c?`${String(s.o).slice(0,5)}–${String(s.c).slice(0,5)}`:'',(s.off||[]).length?'libur '+[1,2,3,4,5,6,0].filter(d=>s.off.includes(d)).map(d=>DAYS[d]).join(', '):'',(s.h||[]).length?(s.h.length+' tgl libur'):''].filter(Boolean).join(' • ')||'Belum diatur';
function shops(){
  const map=new Map();
  S.products.forEach(p=>sellerNames(p).forEach(n=>{const k=sKey(n);if(!map.has(k))map.set(k,{name:n,count:0,member:null});map.get(k).count++}));
  members('penjual').filter(m=>!m.pending).forEach(m=>{const n=(m.toko||m.usaha||m.nama||'').trim();if(!n)return;const k=sKey(n);if(!map.has(k))map.set(k,{name:n,count:0,member:null});map.get(k).member=m});
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'id'));
}

async function approve(gk,id,ok,btn){
  const g=GROUPS.find(x=>x.k===gk);
  if(!ok&&!confirm('Tolak dan hapus pendaftaran ini? Orangnya bisa mendaftar ulang.'))return;
  await busy(btn,async()=>{
    const key=gk+'_members',arr=await readKey(key,[]),list=Array.isArray(arr)?arr:[],m=list.find(x=>x&&x.id===id);
    if(!m){toast('Data tidak ditemukan, mungkin sudah diproses');await loadAll(true);return}
    if(ok){const upd={...m,pending:false,updated:Date.now()};if(gk==='jasa')upd.status='Show';const nl=list.map(x=>x&&x.id===id?upd:x);await setSetting(key,nl);S.settings[key]=nl;toast(`${m.nama||'Akun'} disetujui`)}
    else{await removeMember(gk,id,list);toast('Pendaftaran ditolak')}
    render();
  });
}
async function removeMember(gk,id,list){
  const key=gk+'_members';list=list||await readKey(key,[]);const nl=(Array.isArray(list)?list:[]).filter(x=>x&&x.id!==id);

async function saveProd(id,btn){

  const d={name:$('#fN').value.trim(),price:Number($('#fP').value),sale:num($('#fSale').value),category:$('#fC').value,unit:$('#fU').value.trim()||null,seller:$('#fSel').value.trim()||null,stock:num($('#fS').value),image:$('#fI').value.trim()||null,status:$('#fSt').value};

  await busy(btn,async()=>{
    if(id){await patchProd(id,d)}
    else{const nid=Math.max(25,...S.products.map(x=>Number(x.id)||0))+1;const r=await api('products',{method:'POST',body:JSON.stringify({id:nid,...d})});S.products.push(Array.isArray(r)&&r[0]?r[0]:{id:nid,...d})}
    closeModal();if(route!=='produk')go('produk');else render();toast('Produk disimpan');
  });
}

/* ========== AKSI KATEGORI ========== */
function catForm(old){
  modal(`<h3>${old?'Ubah Nama':'Tambah'} Kategori</h3><div class="field"><label>Nama kategori</label><input class="inp" id="cN" value="${esc(old||'')}"></div>
  ${old?`<p class="sm" style="color:var(--mut);font-size:12px">Semua produk di kategori ini ikut dipindah ke nama baru.</p>`:''}
  <div class="mact"><button class="btn btn-o" onclick="closeModal()">Batal</button><button class="btn btn-g" onclick="saveCat('${old?jsq(old):''}',this)">Simpan</button></div>`)}
async function saveCat(old,btn){
  const v=$('#cN').value.replace(/\s+/g,' ').trim();if(!v)return toast('Nama wajib diisi');
  if(v!==old&&allCats().some(c=>c.toLowerCase()===v.toLowerCase()))return toast('Kategori itu sudah ada');
  await busy(btn,async()=>{
    let cats=customCats().filter(c=>c!==old);if(!BASE_CATS.includes(v))cats.push(v);
    let removed=removedCats().filter(c=>c!==v);if(old&&old!==v)removed.push(old);
    if(old&&old!==v){await api('products?category=eq.'+encodeURIComponent(old),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({category:v})});S.products.forEach(p=>{if(p.category===old)p.category=v})}
    await setSetting('categories',cats);await setSetting('removed_categories',removed);
    S.settings.categories=cats;S.settings.removed_categories=removed;closeModal();render();toast('Kategori disimpan');
  });
}
function catMenu(c){const n=S.products.filter(p=>p.category===c).length;
  modal(`<h3>${esc(c)}</h3><div class="mact" style="flex-direction:column"><button class="btn btn-light" onclick="catForm('${jsq(c)}')">${ico('edit')}Ubah nama</button>
  <button class="btn btn-red" onclick="delCat('${jsq(c)}',this)" ${n?'disabled style="opacity:.5"':''}>${ico('trash')}Hapus</button>
  ${n?`<p class="sm" style="color:var(--mut);font-size:12px">Kategori masih dipakai ${n} produk. Pindahkan produknya dulu untuk menghapus.</p>`:''}
  <button class="btn" onclick="closeModal()">Batal</button></div>`)}
async function delCat(c,btn){if(!confirm('Hapus kategori '+c+'?'))return;
  await busy(btn,async()=>{const cats=customCats().filter(x=>x!==c),removed=[...new Set([...removedCats(),c])];
    await setSetting('categories',cats);await setSetting('removed_categories',removed);S.settings.categories=cats;S.settings.removed_categories=removed;closeModal();render();toast('Kategori dihapus')})}

/* ========== AKSI PROMO (harga coret) ========== */
function promoForm(id){
  const p=id?getProd(id):null;const opts=S.products.filter(x=>x.status!=='Hidden').sort((a,b)=>a.name.localeCompare(b.name));
  modal(`<h3>${p?'Ubah':'Tambah'} Promo</h3>
  <div class="field"><label>Produk</label><select class="inp" id="prP" ${p?'disabled':''}>${opts.map(x=>`<option value="${Number(x.id)}" ${p&&Number(p.id)===Number(x.id)?'selected':''}>${esc(x.name)} — ${rp(x.price)}</option>`).join('')}</select></div>
  <div class="field"><label>Harga promo (Rp)</label><input class="inp" id="prS" type="number" min="0" value="${esc(p&&p.sale||'')}"></div>
  <div class="mact"><button class="btn btn-o" onclick="closeModal()">Batal</button><button class="btn btn-g" onclick="savePromo(this)">Simpan</button></div>`)}
async function savePromo(btn){const id=+$('#prP').value,p=getProd(id),s=Number($('#prS').value);
  if(!p)return;if(!(s>0)||s>=Number(p.price))return toast('Harga promo harus lebih kecil dari '+rp(p.price));
  await busy(btn,async()=>{await patchProd(id,{sale:s});closeModal();if(route!=='promosi')go('promosi');else render();toast('Promo disimpan')})}
function promoMenu(id){const p=getProd(id);modal(`<h3>${esc(p.name)}</h3><div class="mact" style="flex-direction:column"><button class="btn btn-light" onclick="promoForm(${Number(id)})">${ico('edit')}Ubah harga promo</button><button class="btn btn-red" onclick="endPromo(${Number(id)},this)">${ico('trash')}Akhiri promo</button><button class="btn" onclick="closeModal()">Batal</button></div>`)}
async function endPromo(id,btn){await busy(btn,async()=>{await patchProd(id,{sale:null});closeModal();render();toast('Promo diakhiri')})}

/* ========== TARIF OJEK & KIRIM PAKET (dipakai ojek.html) ========== */
const TARIF_DEF={faktor:1.3,bulat:500,ojek:{aktif:true,dasar:5000,perKm:2000,minimal:5000,maxKm:20},paket:{aktif:true,dasar:5000,perKm:2500,minimal:6000,maxKm:20}};
function tarifNow(){const t=S.settings.transport_tariff&&typeof S.settings.transport_tariff==='object'?S.settings.transport_tariff:{};return{...TARIF_DEF,...t,ojek:{...TARIF_DEF.ojek,...(t.ojek||{})},paket:{...TARIF_DEF.paket,...(t.paket||{})}}}
function ongkosContoh(t,l,km){const x=t[l],raw=+x.dasar+ +x.perKm*km,b=Math.max(1,+t.bulat||1);return Math.ceil(Math.max(+x.minimal,raw)/b)*b}
function tarifCard(){
  const t=tarifNow();
  const col=(l,lbl)=>{const x=t[l];return `<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><b>${lbl}</b><label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)"><input type="checkbox" id="t_${l}_aktif" ${x.aktif!==false?'checked':''}> Aktif</label></div>
    ${[['dasar','Tarif dasar (Rp)'],['perKm','Per km (Rp)'],['minimal','Ongkos minimal (Rp)'],['maxKm','Jarak maksimal (km)']].map(([k,n])=>`<div class="field"><label>${n}</label><input class="inp" type="number" min="0" id="t_${l}_${k}" value="${esc(x[k])}"></div>`).join('')}
    <p class="sm" style="color:var(--mut);font-size:12px">Contoh 3 km: <b>${rp(ongkosContoh(t,l,3))}</b> · 7 km: <b>${rp(ongkosContoh(t,l,7))}</b></p></div>`};
  return `<div class="card" style="grid-column:1/-1"><div class="chead"><h3>🛵 Tarif Ojek & Kirim Paket</h3><a class="link" href="ojek.html" target="_blank" rel="noopener">Buka halaman pesan</a></div>
    <p class="sm" style="color:var(--mut);font-size:12px;margin-bottom:12px">Ongkos = tarif dasar + (per km × jarak), paling sedikit ongkos minimal, lalu dibulatkan ke atas. Pesanan diantar kurir toko yang aktif dan sedang tidak mengantar.</p>
    <div class="form-grid" style="gap:16px">${col('ojek','🛵 Ojek online')}${col('paket','📦 Kirim paket/barang')}</div>
    <div class="form-grid" style="gap:16px;margin-top:6px"><div class="field"><label>Faktor jarak jalan (jarak peta × faktor)</label><input class="inp" type="number" step="0.05" min="1" max="3" id="t_faktor" value="${esc(t.faktor)}"></div>
    <div class="field"><label>Pembulatan ke atas (Rp)</label><input class="inp" type="number" min="1" id="t_bulat" value="${esc(t.bulat)}"></div></div>
    <button class="btn btn-g full" onclick="saveTarif(this)">Simpan Tarif</button></div>`;
}
async function saveTarif(btn){
  const n=id=>Number($('#'+id).value),t={faktor:n('t_faktor'),bulat:n('t_bulat')};
  for(const l of ['ojek','paket']){t[l]={aktif:$(`#t_${l}_aktif`).checked};for(const k of ['dasar','perKm','minimal','maxKm']){const v=n(`t_${l}_${k}`);if(!(v>=0))return toast('Isi semua angka tarif dengan benar');t[l][k]=v}}
  if(!(t.faktor>=1&&t.faktor<=3))return toast('Faktor jarak jalan antara 1 dan 3');if(!(t.bulat>=1))return toast('Pembulatan minimal Rp1');
  await busy(btn,async()=>{await setSetting('transport_tariff',t);S.settings.transport_tariff=t;render();toast('Tarif ojek & kirim paket disimpan')});
}

/* ========== PENGATURAN ========== */
async function saveWa(btn){const n=phoneKey($('#sWa').value);if(n.length<9||n.length>15)return toast('Nomor WhatsApp tidak valid');
  await busy(btn,async()=>{await setSetting('whatsapp_number',n);S.settings.whatsapp_number=n;render();toast('Nomor WhatsApp disimpan')})}

/* ========== EXPORT ========== */
function exportCSV(){
  const os=S.orders.filter(o=>inDays(o,repDays));
  const rows=[['Kode Pesanan','Waktu','Pelanggan','No WA','Barang','Subtotal','Ongkir','Total','Status','Pembayaran'],
    ...os.map(o=>[orderCode(o),fmtDate(o.created_at),o.customer_name||'',o.customer_phone||'',(Array.isArray(o.items)?o.items:[]).map(i=>`${i.name} x${i.qty||1}`).join('; '),o.subtotal||0,o.shipping||0,o.total||0,stLabel(o.status),o.payment||''])];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='laporan-kalensari.csv';a.click();toast('Laporan diunduh');
}
