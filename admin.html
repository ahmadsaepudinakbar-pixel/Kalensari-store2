<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a3d">
<script>
/* Mode tampilan admin: "terang" | "gelap" | "auto" (ikuti pengaturan HP). Disimpan di HP ini. */
(function(){var m="auto";try{m=localStorage.getItem("ks_admin_tema")||"auto"}catch(e){}
var g=m==="gelap"||(m==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",g?"dark":"light");})();
</script>
<title>Admin Kalensari Store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0f7a3d;--g2:#16a34a;--gl:#e8f6ee;--side:#172033;--side2:#1f2a40;
  --bg:#f3f6f9;--card:#fff;--tx:#1b2433;--mut:#6b7686;--line:#e9edf2;
  --blue:#3b82f6;--bl:#e8f0fe;--orange:#f97316;--ol:#fff1e6;--purple:#8b5cf6;--pl:#f1ebfe;--red:#ef4444;--rl:#fdecec;
  --r:16px;--sh:0 2px 10px rgba(20,30,50,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hide{display:none!important}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#e9f8ef 0%,#fff 45%,#e3f5ea 100%);padding:24px}
.lbox{width:100%;max-width:380px;text-align:center}
.logo-big{width:110px;height:110px;margin:0 auto 10px}
.lbox h1{font-size:40px;font-weight:800;line-height:1;color:var(--g)}
.lbox h1 span{display:block;color:var(--g2)}
.lbox .sub{color:var(--g);margin:10px 0 36px;font-weight:600}
.lbox h2{font-size:18px;margin-bottom:6px}
.lbox p.m{color:var(--mut);margin-bottom:24px}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.btn:disabled{cursor:wait}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700}
.btn-g{background:var(--g);color:#fff}.btn-g:active{transform:scale(.98)}
.btn-o{border:1.5px solid var(--g);color:var(--g);background:#fff}
.btn-light{background:var(--gl);color:var(--g)}
.btn-red{background:var(--rl);color:var(--red)}
.full{width:100%}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--side);color:#c9d1de;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:40;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand b{color:#fff;font-size:20px;line-height:1.05;font-weight:800}
.brand b span{display:block;color:#4ade80}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;margin-bottom:4px;cursor:pointer;font-weight:500;color:#c9d1de;text-decoration:none}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--g2);color:#fff;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--g2);color:#fff;font-size:11px;border-radius:99px;padding:2px 8px;font-weight:700}
.nav a.on .cnt{background:#fff;color:var(--g)}
.sidebar .bottom{margin-top:auto;border-top:1px solid #2a3550;padding-top:12px}
.main{flex:1;margin-left:250px;min-width:0}
.top{background:#fff;display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top h1{font-size:24px;font-weight:800}
.top .welcome{color:var(--mut);font-size:13px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:20px}
.bell{position:relative;color:var(--mut)}
.bell .dot{position:absolute;top:-6px;right:-7px;background:var(--red);color:#fff;font-size:10px;border-radius:99px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:700}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center;font-weight:800}
.who b{display:block;font-size:14px}.who small{color:var(--mut);font-size:12px}
.burger{display:none}
.content{padding:24px 28px 40px}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3{font-size:17px;font-weight:700}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.link{color:var(--blue);font-size:13px;font-weight:600;cursor:pointer}
.grid-dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.grid-dash>div,.row2>div{min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{display:flex;gap:14px;align-items:flex-start}
.ic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ic svg.i{width:26px;height:26px}
.stat .lbl{font-size:13px;color:var(--tx);font-weight:500}
.stat .val{font-size:clamp(17px,1.6vw,24px);font-weight:800;margin:4px 0;white-space:nowrap}
.up{color:var(--g2);font-size:12px;font-weight:700}
.stat small{display:block;color:var(--mut);font-size:11px}
.row2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:12px}
.donutwrap{display:flex;align-items:center;gap:24px}
.donut{width:160px;height:160px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:11px;color:var(--mut)}
.donut .c b{font-size:22px;color:var(--tx)}
.legend{flex:1}
.legend div{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.legend i{width:12px;height:12px;border-radius:50%}
.legend span:last-child{margin-left:auto;font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:#f6f8fa;text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px}
td{white-space:nowrap;padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.pimg{width:42px;height:42px;border-radius:10px;background:#fff7ed;display:inline-flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pcell{display:flex;align-items:center;gap:10px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.b-Baru{background:var(--bl);color:var(--blue)}
.b-Diproses{background:var(--ol);color:var(--orange)}
.b-Dikirim{background:var(--pl);color:var(--purple)}
.b-Selesai{background:var(--gl);color:var(--g2)}
.b-Batal{background:var(--rl);color:var(--red)}
.b-Gagal{background:#fde2dc;color:#9b2c1c}
.banner{background:linear-gradient(120deg,var(--g),#1aa556);color:#fff;border-radius:var(--r);padding:22px;display:flex;align-items:center;gap:14px;margin-bottom:20px;position:relative;overflow:hidden}
.banner b{font-size:19px;display:block}.banner small{opacity:.9}
.banner::after{content:"🛒";position:absolute;right:10px;bottom:-6px;font-size:52px;opacity:.25}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtn{border-radius:12px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:600}
.qbtn .qi{width:36px;height:36px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center}
.olist .it{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.olist .it:last-child{border:0}
.olist .meta{flex:1;min-width:0}
.olist b{font-size:13px;display:block}
.olist .sm{font-size:12px;color:var(--mut)}
.olist .pr{font-weight:700;font-size:13px;margin:3px 0}

/* LIST PAGES */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--mut)}
.search input{border:0;outline:0;padding:11px 0;width:100%;background:none;color:var(--tx)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab .n{font-size:11px;border-radius:99px;padding:1px 7px;background:#eef1f5}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.tab.on .n{background:rgba(255,255,255,.25)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:14px;display:flex;gap:12px;align-items:center}
.lc .meta{flex:1;min-width:0}
.lc b{display:block;font-size:14px}
.lc .sm{font-size:12px;color:var(--mut)}
.lc .pr{font-weight:700;margin:2px 0}
.right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.more{color:var(--mut);padding:4px;border-radius:8px}.more:hover{background:#f1f3f6}
.sw{width:40px;height:22px;border-radius:99px;background:#cfd5dd;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g2)}.sw.on::after{left:21px}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.ms{border-radius:14px;padding:16px}
.ms .lbl{font-size:12px;font-weight:600;margin:8px 0 4px}
.ms .val{font-size:22px;font-weight:800}
.ms .ic{width:34px;height:34px;border-radius:9px}.ms .ic svg.i{width:18px;height:18px}
.promo-tag{width:80px;height:72px;border-radius:12px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1;transform:rotate(-4deg);flex-shrink:0;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.cat-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ppl{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:linear-gradient(180deg,#22c55e,var(--g));border-radius:6px 6px 0 0;position:relative;min-height:4px;transition:height .4s}
.bars div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.blabels{display:flex;gap:12px;padding:6px 4px 0}.blabels span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bank{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.bank .bl{font-weight:900;color:#0b3d91;width:46px;font-size:13px}
.menu-list a{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500;color:var(--tx);text-decoration:none}
.menu-list a .ch{margin-left:auto;color:#b6bec9}
.profile-head{background:linear-gradient(120deg,var(--g),#1aa556);color:#fff;border-radius:var(--r);padding:22px;display:flex;align-items:center;gap:14px;margin-bottom:16px}

/* MOBILE NAV */
.bnav{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:35}

/* MODAL / TOAST */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:22px}
.mbox h3{font-size:18px;margin-bottom:16px}
.mact{display:flex;gap:10px;margin-top:18px}.mact .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.st-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st-pick button{padding:10px;border-radius:10px;border:1.5px solid var(--line);font-weight:600}
.st-pick button.on{border-color:var(--g2);background:var(--gl);color:var(--g)}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}

/* RESPONSIVE */
.tbl-wrap{overflow-x:auto}
@media(max-width:1440px){.stats{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1200px){.grid-dash{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}
  .main{margin-left:0}
  .burger{display:flex}
  .top{padding:12px 16px;background:var(--g);color:#fff;border:0}
  .top h1{font-size:18px}.top .welcome,.who,.top .chev{display:none}
  .bell{color:#fff}.avatar{width:34px;height:34px}
  .content{padding:16px 14px 96px}
  .row2,.form-grid{grid-template-columns:1fr}
  .stats{gap:12px}
  .stat{flex-direction:column;gap:8px}
  .ic{width:40px;height:40px;border-radius:11px}.ic svg.i{width:20px;height:20px}
  .stat .val{font-size:19px}
  .card{padding:16px}
  .donut{width:130px;height:130px}.donut::after{inset:22px}
  .hide-m{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);padding:4px 0;font-weight:600}
  .bnav button.on{color:var(--g)}
  .cards{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
}
@media(max-width:420px){.donutwrap{flex-direction:column;align-items:stretch}.donut{margin:0 auto}}
/* ===== MODE GELAP ===== */
:root{color-scheme:light}
.tema-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--gl);transition:transform .2s}
.tema-btn:active{transform:rotate(30deg) scale(.92)}
.tema-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tema-pick button{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card)}
.tema-pick button span{font-size:20px}
.tema-pick button.on{border-color:var(--g2);background:var(--gl);color:var(--g)}
[data-theme="dark"]{color-scheme:dark;
  --g:#1f9d55;--g2:#22a75b;--gl:#15301f;--side:#0b111b;--side2:#16202f;
  --bg:#0e141d;--card:#18212e;--tx:#e5eaf1;--mut:#97a3b4;--line:#2a3545;
  --blue:#60a5fa;--bl:#172a46;--orange:#fb923c;--ol:#3a2413;--purple:#a78bfa;--pl:#2a2145;--red:#f87171;--rl:#3b1b1d;
  --sh:0 2px 12px rgba(0,0,0,.35)}
[data-theme="dark"] #login{background:linear-gradient(160deg,#0f1f17 0%,#0e141d 45%,#10241a 100%)}
[data-theme="dark"] .lbox h1,[data-theme="dark"] .lbox .sub{color:#4ade80}[data-theme="dark"] .lbox h1 span{color:#86efac}
[data-theme="dark"] .inp,[data-theme="dark"] .sel,[data-theme="dark"] .search,[data-theme="dark"] .tab,[data-theme="dark"] .lc,
[data-theme="dark"] .top,[data-theme="dark"] .bnav,[data-theme="dark"] .mbox,[data-theme="dark"] .btn-o{background:var(--card)}
[data-theme="dark"] .btn-o{color:#4ade80;border-color:#2f7d4f}
[data-theme="dark"] .btn-light,[data-theme="dark"] .st-pick button.on,[data-theme="dark"] .bnav button.on,[data-theme="dark"] .avatar{color:#4ade80}
[data-theme="dark"] .nav a.on .cnt{color:var(--g)}
[data-theme="dark"] .tab.on{color:#fff;background:var(--g);border-color:var(--g)}
[data-theme="dark"] .donut::after{background:var(--card)}
[data-theme="dark"] th{background:#1f2a39}
[data-theme="dark"] .tab .n{background:#263244}
[data-theme="dark"] .more:hover{background:#243042}
[data-theme="dark"] .pimg{background:#2a2218}
[data-theme="dark"] .bank .bl{color:#93c5fd}
[data-theme="dark"] .menu-list a .ch{color:#5b6779}
[data-theme="dark"] .sw{background:#3a4658}
[data-theme="dark"] .toast{background:#e5eaf1;color:#0e141d}
[data-theme="dark"] .modal,[data-theme="dark"] .overlay{background:rgba(0,0,0,.65)}
[data-theme="dark"] .b-Gagal{background:#3d1f19;color:#fca5a5}
[data-theme="dark"] .up{color:#4ade80}
[data-theme="dark"] input::placeholder,[data-theme="dark"] textarea::placeholder{color:#6b778a}
[data-theme="dark"] .content img{opacity:.92}
[data-theme="dark"] .content svg line[stroke="#eef1f4"]{stroke:#2a3545}
[data-theme="dark"] .content svg circle[fill="#fff"]{fill:var(--card)}
@media(max-width:900px){[data-theme="dark"] .top{background:#13301f}}
/* warna langsung di dalam halaman (style="...") ikut menyesuaikan */
[data-theme="dark"] [style*="background:#fff"],[data-theme="dark"] [style*="background: #fff"],[data-theme="dark"] [style*="background:white"]{background:var(--card)!important}
[data-theme="dark"] [style*="background:#faf6f2"],[data-theme="dark"] [style*="background:#f4efe9"],[data-theme="dark"] [style*="background:#f3e3d6"]{background:#1f2836!important}
[data-theme="dark"] [style*="background:#fff8ec"],[data-theme="dark"] [style*="background:#fff3cd"],[data-theme="dark"] [style*="background:#fff1d6"],[data-theme="dark"] [style*="background:#fff6e0"]{background:#33280f!important}
[data-theme="dark"] [style*="background:#fdecea"],[data-theme="dark"] [style*="background:#fde2dc"]{background:#3b1b1d!important}
[data-theme="dark"] [style*="background:#dcf2e3"],[data-theme="dark"] [style*="background:#e8f6ee"]{background:#15301f!important}
[data-theme="dark"] [style*="border:1px solid #f3dfb8"]{border-color:#5a4520!important}
[data-theme="dark"] [style*="border:1px solid #f5c6c2"]{border-color:#6b2c2a!important}
[data-theme="dark"] [style*="border-bottom:1px solid #eee"]{border-color:var(--line)!important}
[data-theme="dark"] [style*="color:#14502c"]{color:#86efac!important}
[data-theme="dark"] [style*="color:#9a5a00"],[data-theme="dark"] [style*="color:#a35a00"],[data-theme="dark"] [style*="color:#7a4a00"]{color:#fcd34d!important}
[data-theme="dark"] [style*="color:#9b2c1c"],[data-theme="dark"] [style*="color:#c0392b"],[data-theme="dark"] [style*="color:#b91c1c"]{color:#fca5a5!important}
[data-theme="dark"] [style*="color:#5b2e1a"],[data-theme="dark"] [style*="color:#0b3d91"]{color:var(--tx)!important}
[data-theme="dark"] [style*="color:#fff"]{color:#fff!important}
.kb{margin-bottom:20px;cursor:pointer;border:1.5px solid var(--gl);transition:box-shadow .2s}.kb:hover{box-shadow:0 6px 22px rgba(20,30,50,.12)}
.kb-top{display:flex;gap:14px;align-items:center}.kb-main{flex:1;min-width:0}
.kb .lbl{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kb-per{font-size:11px;font-weight:700;background:var(--gl);color:var(--g);border-radius:99px;padding:2px 9px}
.kb-val{font-size:clamp(22px,2.4vw,30px);font-weight:800;margin:2px 0}
.kb small{color:var(--mut);font-size:12px}
.kb-go{display:flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;font-size:13px;white-space:nowrap}.kb-go svg.i{width:16px;height:16px}
.kb-rinci{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.kb-c{background:var(--bg);border-radius:12px;padding:10px 12px}.kb-c small{display:block;font-size:11.5px}.kb-c b{font-size:15px}
.kb-c b.p{color:var(--g2)}.kb-c b.m{color:var(--red)}

[data-theme="dark"] .kb{border-color:#1f3a2a}[data-theme="dark"] .kb-per{color:#4ade80}[data-theme="dark"] .kb-c b.p{color:#4ade80}
.dash-alert:empty{display:none}.dash-alert{display:grid;gap:10px;margin-bottom:16px}.dash-alert>.card{margin:0!important}
</style>

<script>
/* =====================================================================
   ADMIN KALENSARI STORE — tersambung ke data asli Supabase
   Login memakai akun admin Supabase yang sama dengan menu ⚙️ Admin di toko.
   ===================================================================== */
const CFG=window.CLOUD_CONFIG||{};
const BASE=String(CFG.supabaseUrl||'').replace(/\/$/,'');
const AUTH_KEY='kalensari_admin_auth';
let auth=(()=>{try{return JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}})();
const saveAuth=a=>{auth=a;try{a?sessionStorage.setItem(AUTH_KEY,JSON.stringify(a)):sessionStorage.removeItem(AUTH_KEY)}catch(e){}};
async function authReq(grant,body){
  const r=await fetch(`${BASE}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return {access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),email:(d.user&&d.user.email)||''};
}
async function fresh(){
  if(!auth||!auth.refresh_token)throw new Error('login');
  if(auth.expires_at*1000-Date.now()>60000)return;
  try{saveAuth({...await authReq('refresh_token',{refresh_token:auth.refresh_token}),email:auth.email})}
  catch(e){saveAuth(null);throw new Error('login')}
}
async function api(path,opt={}){
  try{await fresh()}catch(e){sessionExpired();throw e}
  const r=await fetch(`${BASE}/rest/v1/${path}`,{...opt,headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+auth.access_token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  const t=await r.text();
  if(!r.ok)throw new Error(t||('HTTP '+r.status));
  return t?JSON.parse(t):[];
}
const setSetting=(key,value)=>api('store_settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{key,value}])});

/* ========== DATA ASLI ========== */
const S={products:[],orders:[],settings:{},loaded:false};
const BASE_CATS=['Makanan','Minuman'];
const STATUS_LABEL={menunggu:'Baru',baru:'Baru',diproses:'Diproses',dikirim:'Dikirim',selesai:'Selesai',dibatalkan:'Batal',gagal:'Gagal'};
const STATUS_DB={Baru:'menunggu',Diproses:'diproses',Dikirim:'dikirim',Selesai:'selesai',Batal:'dibatalkan',Gagal:'gagal'};
const stLabel=s=>STATUS_LABEL[String(s||'').toLowerCase()]||'Baru';
const phoneKey=v=>String(v||'').replace(/\D/g,'').replace(/^0/,'62');
const itemPrice=it=>Number(it.sale)>0&&Number(it.sale)<Number(it.price)?Number(it.sale):Number(it.price)||0;
const isCancelled=o=>['Batal','Gagal'].includes(stLabel(o.status));

async function loadAll(silent){
  try{
    const [p,o,s,mu]=await Promise.all([
      api('products?select=*&order=id.asc'),
      api('orders?select=*&order=created_at.desc&limit=1000'),
      api('store_settings?select=key,value&key=not.like.foto_*'),
      api('map_usage?select=day,loads&order=day.desc&limit=62').catch(()=>null)
    ]);
    S.mapUsage=Array.isArray(mu)?mu:null;
    // saldo kurir (tabel dari supabase-saldo-kurir.sql; kosong bila belum dipasang)
    const sejak=new Date(Date.now()-400*864e5).toISOString();
    const [ks,kt,km,kc,ku]=await Promise.all([
      api('kurir_saldo?select=kurir_id,saldo').catch(()=>null),
      api('kurir_topup?select=id,kurir_id,nama,wa,jumlah,status,catatan,t,diproses_t&order=t.desc&limit=100').catch(()=>null),
      api('kurir_mutasi?select=jumlah,t&jenis=eq.potong&t=gt.'+encodeURIComponent(sejak)+'&limit=10000').catch(()=>null),
      api('kurir_cair?select=*&order=t.desc&limit=100').catch(()=>null),
      api('kurir_mutasi?select=order_code&jenis=eq.upah&t=gt.'+encodeURIComponent(sejak)+'&limit=10000').catch(()=>null)]);
    S.kcair=Array.isArray(kc)?kc:null;S.upah=new Set((Array.isArray(ku)?ku:[]).map(x=>x.order_code));
    S.saldo=Array.isArray(ks)?Object.fromEntries(ks.map(x=>[x.kurir_id,Number(x.saldo)||0])):null;
    S.topup=Array.isArray(kt)?kt:[];S.potong=Array.isArray(km)?km:[];
    S.products=Array.isArray(p)?p:[];S.orders=Array.isArray(o)?o:[];
    S.settings={};(Array.isArray(s)?s:[]).forEach(r=>S.settings[r.key]=r.value);
    S.loaded=true;render();if(!silent)toast('Data terbaru dimuat');
  }catch(e){if(e.message!=='login'){console.error(e);toast('Gagal memuat data: '+String(e.message).slice(0,70))}}
}
const customCats=()=>Array.isArray(S.settings.categories)?S.settings.categories:[];
const removedCats=()=>Array.isArray(S.settings.removed_categories)?S.settings.removed_categories:[];
function allCats(){
  const used=new Set(S.products.map(p=>p.category).filter(Boolean));
  return [...new Set([...BASE_CATS,...customCats(),...used])].filter(c=>!removedCats().includes(c)||used.has(c));
}
const catEmoji=c=>/minum|jus|es |kopi|teh/i.test(c)?'🥤':/makan|nasi|mie|kue|jajan/i.test(c)?'🍛':'🏷️';
const fotoUtama=v=>String(v||'').split(/\s*(?:\r?\n|\s\|\s)\s*/)[0].trim();
const prodThumb=(p,size)=>p&&p.image?`<img src="${esc(fotoUtama(p.image))}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" loading="lazy" onerror="this.replaceWith(document.createTextNode('${catEmoji(p.category||'')}'))">`:catEmoji((p&&p.category)||'');

// Penjualan per produk dihitung dari pesanan yang tidak dibatalkan.
function soldMap(orders=S.orders){
  const m=new Map();
  orders.filter(o=>!isCancelled(o)).forEach(o=>(Array.isArray(o.items)?o.items:[]).forEach(it=>{
    const k=it.id!=null?'id:'+it.id:'n:'+it.name;const cur=m.get(k)||{name:it.name,qty:0,rev:0,id:it.id};
    const q=Number(it.qty)||1;cur.qty+=q;cur.rev+=itemPrice(it)*q;m.set(k,cur);}));
  return m;
}
const soldOf=p=>{const m=soldMap();return (m.get('id:'+p.id)||{qty:0}).qty};
function customers(orders=S.orders){
  const m=new Map();
  orders.forEach(o=>{const k=phoneKey(o.customer_phone)||('nama:'+(o.customer_name||'-'));
    const c=m.get(k)||{name:o.customer_name||'Tanpa nama',wa:o.customer_phone||'',orders:0,spent:0,first:o.created_at,last:o.created_at};
    c.orders++;if(!isCancelled(o))c.spent+=Number(o.total)||0;
    if(o.created_at<c.first)c.first=o.created_at;if(o.created_at>c.last){c.last=o.created_at;c.name=o.customer_name||c.name}
    m.set(k,c);});
  return [...m.values()].sort((a,b)=>b.orders-a.orders||b.spent-a.spent);
}
const revenue=(orders=S.orders)=>orders.filter(o=>!isCancelled(o)).reduce((a,o)=>a+(Number(o.total)||0),0);
const inDays=(o,d)=>Date.now()-new Date(o.created_at).getTime()<=d*864e5;
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);out.push(d)}return out}
const fmtDay=d=>d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
const fmtTime=d=>new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const fmtDate=d=>new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
// Tanda pembayaran QRIS otomatis (Duitku)
function payTag(o){if(o.pay_status==="verifikasi")return ' <span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e3eefc;color:#1d4f91;vertical-align:middle">🔎 Cek pembayaran</span>';if(o.pay_status==="tunggu_wa")return ' <span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff1d6;color:#9a5a00;vertical-align:middle">📞 Tunggu konfirmasi WA</span>';if(o.pay_status==="ok_wa")return ' <span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#dcf2e3;color:#14502c;vertical-align:middle">✔ COD dikonfirmasi</span>';if(!/^qris/i.test(String(o.payment||"")))return "";return o.pay_status==="lunas"?' <span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#dcf2e3;color:#14502c;vertical-align:middle">💳 Lunas</span>':' <span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff1d6;color:#9a5a00;vertical-align:middle">⏳ Belum dibayar</span>'}
function ago(d){const s=(Date.now()-new Date(d).getTime())/1000;if(s<60)return 'baru saja';if(s<3600)return Math.floor(s/60)+' menit yang lalu';if(s<86400)return Math.floor(s/3600)+' jam yang lalu';if(s<86400*30)return Math.floor(s/86400)+' hari yang lalu';return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
const orderCode=o=>o.order_code||('#'+o.id);
const transOf=o=>{const it=Array.isArray(o.items)?o.items[0]:null;return it&&it.layanan?it:null};
const kurirOf=o=>{const st=S.settings['kurir_ord_'+o.order_code];if(st&&st.acc)return st.acc;if(o.kurir_id)return{id:o.kurir_id,nama:o.kurir_nama||'',wa:o.kurir_wa||''};const a=S.settings['antar_'+o.order_code];return a&&a.id?a:null};
const antarOf=o=>{const a=S.settings['antar_'+o.order_code];return a&&typeof a==='object'?a:null};
const laporOf=o=>{const l=S.settings['laporan_'+o.order_code];return l&&typeof l==='object'?l:null};
const laporBuka=()=>S.orders.filter(o=>{const l=laporOf(o);return l&&!l.beres});

const minSaldoB=()=>{const b=biaya();return b.mode==='persen'?(Number(b.minSaldo)||1000):Math.max(Number(b.minSaldo)||0,Number(b.potong)||0)};

async function doLogin(){
  const em=$('#lUser').value.trim(),pw=$('#lPass').value,btn=$('#lBtn');
  if(!em||!pw){toast('Isi email dan kata sandi');return}
  if(!BASE||!CFG.supabaseAnonKey){toast('config.js belum berisi data Supabase');return}
  btn.disabled=true;const t=btn.textContent;btn.textContent='Memeriksa...';
  try{
    const sess=await authReq('password',{email:em,password:pw});
    const r=await fetch(`${BASE}/rest/v1/rpc/is_admin`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok)throw new Error('cek-admin-gagal');
    if((await r.json())!==true){fetch(`${BASE}/auth/v1/logout`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+sess.access_token}}).catch(()=>{});throw new Error('bukan-admin')}
    saveAuth(sess);$('#lPass').value='';enterApp();
    api('rpc/admin_catat',{method:'POST',body:JSON.stringify({p_aksi:'masuk',p_info:(navigator.userAgent.match(/\(([^)]+)\)/)||['',''])[1].slice(0,100)})}).catch(()=>{});
  }catch(e){
    const m=String(e.message||e);
    toast(m==='bukan-admin'?'Akun ini bukan admin':m==='cek-admin-gagal'?'Jalankan supabase-admin-auth.sql di Supabase dulu':/invalid|credentials/i.test(m)?'Email atau kata sandi salah':/confirm/i.test(m)?'Email admin belum dikonfirmasi':'Gagal masuk: '+m.slice(0,70));
  }finally{btn.disabled=false;btn.textContent=t}
}

function logout(){
  if(auth&&auth.access_token)fetch(`${BASE}/auth/v1/logout`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+auth.access_token}}).catch(()=>{});

function lineChart(data,labels){
  const W=520,H=210,pl=30,pb=26,pt=10,rawMax=Math.max(...data,0),step=Math.max(1,Math.ceil(rawMax/4)),max=step*4||4;
  const n=Math.max(data.length-1,1),x=i=>pl+i*(W-pl-10)/n,y=v=>pt+(H-pt-pb)*(1-v/max);
  let grid='';for(let v=0;v<=max;v+=step)grid+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f4"/><text x="${pl-8}" y="${y(v)+4}" font-size="10" fill="#8a94a3" text-anchor="end">${v}</text>`;
  const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');const every=Math.ceil(data.length/8);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a34a" stop-opacity=".22"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></linearGradient></defs>
    ${grid}<polygon points="${x(0)},${y(0)} ${pts} ${x(data.length-1)},${y(0)}" fill="url(#gf)"/>
    <polyline points="${pts}" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    ${data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${data.length>10?3:4}" fill="#16a34a" stroke="#fff" stroke-width="2"><title>${labels[i]}: ${v} pesanan</title></circle>${i%every===0||i===data.length-1?`<text x="${x(i)}" y="${H-6}" font-size="10" fill="#8a94a3" text-anchor="${i===0?'start':i===data.length-1?'end':'middle'}">${labels[i]}</text>`:''}`).join('')}
  </svg>`;
}
function ordersPerDay(n){const days=lastDays(n),m=new Map(days.map(d=>[dayKey(d),0]));S.orders.forEach(o=>{const k=dayKey(o.created_at);if(m.has(k))m.set(k,m.get(k)+1)});return{labels:days.map(fmtDay),data:days.map(d=>m.get(dayKey(d)))}}
function catShare(){
  const counts=new Map();S.products.forEach(p=>{const c=p.category||'Lainnya';counts.set(c,(counts.get(c)||0)+1)});
  const rows=[...counts.entries()].sort((a,b)=>b[1]-a[1]);const total=S.products.length;
  if(!total)return '<div class="empty">Belum ada produk</div>';
  let acc=0;const grad=rows.map(([c,n],i)=>{const s=acc;acc+=n/total*100;return `${colors[i%colors.length]} ${s}% ${acc}%`}).join(',');
  return `<div class="donutwrap"><div class="donut" style="background:conic-gradient(${grad})"><div class="c">Total Produk<b>${total}</b></div></div>
  <div class="legend">${rows.map(([c,n],i)=>`<div><i style="background:${colors[i%colors.length]}"></i><span>${esc(c)}</span><span>${n} (${Math.round(n/total*100)}%)</span></div>`).join('')}</div></div>`;
}

const wibNow=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{d:`${p.year}-${p.month}-${p.day}`,m:+p.hour*60+ +p.minute}};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const prevDay=d=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-1);return t.toISOString().slice(0,10)};
const offOn=(s,d)=>(s.off||[]).includes(dow(d))||(s.h||[]).includes(d);
function sellerState(name){
  const k=sKey(name);if(closedMap()[k])return{open:false,why:'Ditutup admin'};const tp=S.settings.tutup_toko;if(tp&&typeof tp==='object'&&tp[k])return{open:false,why:'Ditutup penjual'};
  const s=schedMap()[k];if(!s)return{open:true,why:''};
  const {d,m}=wibNow(),o=tMin(s.o),c=tMin(s.c),hasT=o!==null&&c!==null&&o!==c;let open;
  if(!hasT)open=!offOn(s,d);else if(o<c)open=!offOn(s,d)&&m>=o&&m<c;else open=(m>=o&&!offOn(s,d))||(m<c&&!offOn(s,prevDay(d)));
  return open?{open:true,why:''}:{open:false,why:offOn(s,d)?'Libur hari ini':`Buka ${String(s.o).slice(0,5)}–${String(s.c).slice(0,5)} WIB`};
}

async function gantiNamaToko(lama,baru){
  const kL=sKey(lama),kB=sKey(baru);
  // produk
  const ganti=S.products.filter(p=>sellerNames(p).some(n=>sKey(n)===kL));
  for(const p of ganti){const seller=sellerNames(p).map(n=>sKey(n)===kL?baru:n).join(', ');await patchProd(p.id,{seller})}
  // status tutup, jadwal, ongkir per toko
  for(const key of ['closed_sellers','seller_schedule','shipping_fees','tutup_toko']){
    const cur=await readKey(key,null);if(!cur||typeof cur!=='object'||Array.isArray(cur)||!(kL in cur))continue;
    const v={...cur};v[kB]=v[kL];delete v[kL];await setSetting(key,v);S.settings[key]=v;
  }
  return ganti.length;
}

const getProd=id=>S.products.find(x=>Number(x.id)===Number(id));
/* ===== Ketersediaan topping: sakelar Tersedia / Habis per topping (disimpan sebagai "| habis" di baris topping) ===== */
const tpBaris=l=>{const t=l.trim();if(!t||/^#/.test(t))return null;const ps=t.split('|').map(x=>x.trim());if(ps.length<2||ps[1]===''||isNaN(Number(ps[1].replace(/[.,]/g,''))))return null;return{nama:ps[0],harga:Number(ps[1].replace(/[.,]/g,'')),habis:ps.slice(2).some(x=>/^habis$/i.test(x))}};
const tpSet=(l,habis)=>{const ps=l.trim().split('|').map(x=>x.trim()).filter((x,i)=>i<2||!/^habis$/i.test(x));if(habis)ps.push('habis');return ps.join(' | ')};
/* Foto topping: store_settings "foto_topping_<id produk>" = {foto:{"Nama":"data:image/jpeg..."},t} */
const FOTO_TP={};
const tpImgAsli=l=>{const ps=String(l||'').split('|').map(x=>x.trim());return ps.slice(2).find(x=>/^(https?:\/\/|img\/|\.\/|data:image\/)/i.test(x))||''};
const tpSrc=s0=>/^(https?:|data:)/i.test(s0)?s0:(s0?'./'+s0.replace(/^\.\//,''):'');
function potongPersegi(file,ukuran){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const z=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=ukuran;c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,ukuran,ukuran);ok(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(file)})}
async function fotoToppingAdm(id,i,inp){
  const f=inp.files&&inp.files[0];if(!f)return;const b=tpBaris(String((getProd(id)||{}).toppings||'').split(/\r?\n/)[i]||'');if(!b)return;const nama=b.nama;
  try{const foto=await potongPersegi(f,220);const cur=await readKey('foto_topping_'+id,{})||{};const m=cur&&typeof cur.foto==='object'?cur.foto:{};m[nama]=foto;

function aturTopping(id){
  const p=getProd(id);if(!p)return;const L=String(p.toppings||'').split(/\r?\n/);
  if(FOTO_TP[id]===undefined){FOTO_TP[id]=null;readKey('foto_topping_'+id,{}).then(v=>{FOTO_TP[id]=(v&&v.foto)||{};if(document.getElementById('tpAdmBox'))aturTopping(id)}).catch(()=>{FOTO_TP[id]={}})}
  const FM=FOTO_TP[id]||{};

async function gabungGrup(id,btn){
  const p=getProd(id),g=String(p&&p.product_group||'').trim().toLowerCase();if(!g)return;
  const anggota=S.products.filter(x=>String(x.product_group||'').trim().toLowerCase()===g).sort((a,b)=>(a.status==='Hidden')-(b.status==='Hidden')||Number(a.id)-Number(b.id));
  if(anggota.length<2)return toast('Grup ini hanya berisi 1 produk');
  const harga=x=>Number(x.sale)>0&&Number(x.sale)<Number(x.price)?Number(x.sale):Number(x.price)||0;
  const utama=anggota[0],nama=String(utama.product_group).trim();
  const baris=anggota.map(x=>[String(x.variant||'').trim()||x.name,harga(x),x.status==='Sold Out'?'habis':''].filter(v=>v!=='').join(' | '));
  if(!confirm(`Gabungkan ${anggota.length} produk grup "${nama}" jadi 1 produk?\n\n${baris.map(b=>'• '+b).join('\n')}\n\nProduk lain di grup ini akan disembunyikan (tidak dihapus).`))return;
  await busy(btn,async()=>{
    const vs=baris.join('\n'),ok=anggota.filter(x=>x.status!=='Sold Out');
    await patchProd(utama.id,{name:nama,variants:vs,price:Math.min(...(ok.length?ok:anggota).map(harga)),sale:null,product_group:null,variant:null,status:utama.status==='Hidden'?'Show':utama.status==='Sold Out'?'Show':utama.status});
    for(const x of anggota.slice(1))await patchProd(x.id,{status:'Hidden',product_group:null});

  });
}
/* Simpan produk; bila ada kolom yang belum dibuat di Supabase, kolom itu dilewati (dan diberi tahu) supaya simpan tetap berhasil */
async function apiProd(path,opt,data){let d=Array.isArray(data)?data.map(x=>({...x})):{...data};const hilang=[];
  for(let i=0;i<25;i++){try{const r=await api(path,{...opt,body:JSON.stringify(d)});if(hilang.length)toast('⚠️ Kolom '+hilang.join(', ')+' belum ada di Supabase. Jalankan supabase-kolom-produk.sql');return r}
    catch(e){const m=/Could not find the '([^']+)' column/.exec(String(e.message||e));if(!m)throw e;hilang.push(m[1]);if(Array.isArray(d))d.forEach(x=>delete x[m[1]]);else delete d[m[1]]}}
  throw new Error('Gagal menyimpan produk')}

  ${p.product_group&&S.products.filter(x=>String(x.product_group||'').trim().toLowerCase()===String(p.product_group).trim().toLowerCase()).length>1?`<button class="btn btn-light" onclick="gabungGrup(${Number(id)},this)">🔀 Gabungkan grup "${esc(p.product_group)}" jadi 1 produk</button>`:''}
  <button class="btn btn-light" onclick="setProdStatus(${Number(id)},'${p.status==='Sold Out'?'Show':'Sold Out'}',this)">${p.status==='Sold Out'?'Tandai stok tersedia':'Tandai stok habis'}</button>

async function saveProd(id,btn){

const KOLOM_PROD=['id','name','price','sale','category','unit','seller','stock','status','image','open_time','close_time','product_group','variant','toppings','topping_limit','min_order','variants'];
async function upsertProduk(list){
  const rows=list.map(p=>{const o={};KOLOM_PROD.forEach(k=>{if(p[k]!==undefined)o[k]=p[k]});return o}).filter(p=>p.name&&Number(p.id)>0);
  for(let i=0;i<rows.length;i+=50)await apiProd('products?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'}},rows.slice(i,i+50));
  return rows.length;
}

let QRS=null,QRS_LIB=null;
async function muatQrs(){try{const v=await readKey('qris_statis',null);QRS=v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){QRS={}}if(route==='pengaturan')render()}
function qrisStatisCard(){

  const q=QRS,c=q.raw?QRISStatis.cek(q.raw):null;
  return `<div class="card"><div class="chead"><h3>📱 QRIS Pembayaran Pesanan</h3></div>
    <p class="sm" style="color:var(--mut);font-size:12px;margin-bottom:10px">Tempel teks <b>QRIS statis</b> toko (dari aplikasi merchant bank/e-wallet). Saat checkout, situs membuat QR dengan <b>nominal terisi otomatis</b> sehingga pembeli tidak mengetik. Pembayaran tetap <b>dicek manual</b>: setelah uang masuk, buka pesanan lalu tekan <b>“Tandai QRIS sudah dibayar”</b>.</p>
    <div class="field"><label>Teks QRIS (diawali 000201)</label><textarea class="inp" id="qsRaw" rows="4" placeholder="000201010211..." oninput="qsCekLive()" style="font-family:monospace;font-size:12px">${esc(q.raw||'')}</textarea></div>

    <input type="file" id="qsFile" accept="image/*" hidden onchange="qsBacaGambar(this)">
    <button class="btn btn-light" type="button" onclick="$('#qsFile').click()">📷 Baca teks dari gambar QRIS</button>
    <label class="sm" style="display:flex;gap:10px;align-items:center;padding:12px 0 4px;cursor:pointer"><input type="checkbox" id="qsAktif" ${q.aktif!==false?'checked':''} style="width:18px;height:18px">Aktifkan pembayaran QRIS ini di toko</label>
    <div class="field" style="margin-top:8px"><label>Uji coba nominal (Rp)</label><div style="display:flex;gap:8px"><input class="inp" id="qsUjiN" inputmode="numeric" value="10000" style="flex:1"><button class="btn btn-light" type="button" onclick="qsUji()">Buat QR uji</button></div>
      <small style="color:var(--mut);font-size:12px">Scan QR uji dengan aplikasi bank/e-wallet untuk memastikan nama merchant &amp; nominal benar (tidak perlu dibayar). Coba juga dengan beberapa aplikasi.</small></div>
    <div id="qsPrev" style="text-align:center"></div>
    <button class="btn btn-g full" type="button" onclick="qsSimpan(this)" style="margin-top:8px">Simpan QRIS</button>
    ${q.raw?'<button class="btn btn-light full" type="button" style="color:var(--red);margin-top:8px" onclick="qsHapus(this)">Hapus QRIS</button>':''}
    <p class="sm" style="color:var(--mut);font-size:12px;margin-top:10px">Catatan: pastikan QRIS statis milik merchant yang sah agar uang masuk &amp; ada riwayat mutasi. Pesanan yang belum dibayar dibatalkan otomatis setelah 15 menit.</p></div>`;

function qsCekLive(){const c=QRISStatis.cek($('#qsRaw').value),i=$('#qsInfo');if(!i)return;i.style.color=c.ok?'#14502c':'#b83c2b';i.textContent=($('#qsRaw').value.trim()?(c.ok?'✅ ':'⚠️ '):'')+(c.pesan||'')}
function qsMuatScript(urls){return new Promise((ok,no)=>{let i=0;const coba=()=>{if(i>=urls.length)return no(new Error('Gagal memuat pustaka dari internet'));const s=document.createElement('script');s.src=urls[i++];s.onload=ok;s.onerror=()=>{s.remove();coba()};document.head.appendChild(s)};coba()})}
async function qsBacaGambar(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{
    toast('Membaca gambar…');
    const im=await new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('Gambar tidak bisa dibuka'));i.src=u});
    let hasil='';
    for(const maks of [1400,900,2000]){   // coba beberapa ukuran: logo besar kadang mengganggu pembacaan
      const k=Math.min(1,maks/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      if('BarcodeDetector' in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(c);if(r&&r[0]&&r[0].rawValue){hasil=r[0].rawValue;break}}catch(e){}}
      if(!window.jsQR){try{await qsMuatScript(['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'])}catch(e){}}
      if(window.jsQR){const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});if(r&&r.data){hasil=r.data;break}}
    }
    if(!hasil)return toast('QR tidak terbaca. Coba gambar yang lebih jelas, atau tempel teksnya manual.');
    $('#qsRaw').value=hasil;qsCekLive();toast('✅ Teks QRIS terbaca. Periksa lalu tekan Simpan.');
  }catch(e){toast('Gagal membaca: '+String(e.message||e).slice(0,70))}
}
async function qsUji(){
  const c=QRISStatis.cek($('#qsRaw').value);if(!c.ok)return toast(c.pesan);
  const n=Number(String($('#qsUjiN').value).replace(/\D/g,''))||0;if(n<1)return toast('Isi nominal uji');
  try{
    if(!window.qrcode)await qsMuatScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js']);
    const q=qrcode(0,'M');q.addData(QRISStatis.buat($('#qsRaw').value,n));q.make();
    $('#qsPrev').innerHTML=`<div style="display:inline-block;background:#fff;padding:12px;border:3px solid #7a3e20;border-radius:16px;margin:6px 0"><img src="${q.createDataURL(6,2)}" alt="QR uji" style="width:min(260px,70vw);display:block;image-rendering:pixelated"><b style="display:block;color:#7a3e20;margin-top:4px">${rp(n)}</b></div><div class="sm" style="color:var(--mut);font-size:12px">Merchant: <b>${esc(c.nama||'-')}</b>${c.kota?' • '+esc(c.kota):''}</div>`;
  }catch(e){toast('Gagal membuat QR uji: '+String(e.message||e).slice(0,60))}
}

/* QRIS isi saldo kurir: store_settings "foto_qris_topup" = {foto, t} (diawali foto_ agar tidak ikut dimuat massal) */
let QR_TOPUP=null;
async function muatQrTopup(){try{const v=await readKey('foto_qris_topup',null);QR_TOPUP=v&&v.foto||''}catch(e){QR_TOPUP=''}if(route==='pengaturan')render()}
async function unggahQrTopup(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  try{const foto=await new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.92))};im.src=r.result};r.readAsDataURL(f)});
    await setSetting('foto_qris_topup',{foto,t:Date.now()});QR_TOPUP=foto;render();toast('✅ QRIS isi saldo disimpan')}catch(e){toast('Gagal menyimpan QRIS: '+String(e.message||e).slice(0,60))}}
async function hapusQrTopup(btn){if(!confirm('Hapus gambar QRIS isi saldo?'))return;await busy(btn,async()=>{await api('store_settings?key=eq.foto_qris_topup',{method:'DELETE',headers:{Prefer:'return=minimal'}});QR_TOPUP='';render();toast('QRIS dihapus')})}

/* ===== PANTAU PERMINTAAN UANG: kurir isi saldo & toko cairkan saldo (selama Admin terbuka) ===== */
const UANG_SEEN='kalensari_admin_uang_seen';
let uangAwal=true;
function uangSeen(){try{return new Set(JSON.parse(localStorage.getItem(UANG_SEEN)||'[]'))}catch(e){return new Set()}}
function bunyiAdmin(){if(document.hidden)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();[[0,988],[.18,1319],[.36,1568]].forEach(([t,f])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.22,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.3);o.start(c.currentTime+t);o.stop(c.currentTime+t+.31)})}catch(e){}}
async function kabarAdmin(judul,isi,tag,ke){
  bunyiAdmin();toast(judul);
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const opt={body:isi,tag,icon:'icons/logo-kalensari.png',badge:'icons/logo-kalensari.png',renotify:true,data:{url:'admin.html'}};
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration().catch(()=>null);
    if(reg&&reg.showNotification)await reg.showNotification(judul,opt);else{const n=new Notification(judul,opt);n.onclick=()=>{window.focus();go(ke);n.close()}}}catch(e){}
}
async function cekPermintaanUang(){
  if(!auth||$('#app').classList.contains('hide'))return;
  const pref=admPref();if(!pref.topup&&!pref.cair){uangAwal=false;return}
  let tp=[],cr=[];
  try{const [a,b]=await Promise.all([pref.topup?api('kurir_topup?select=id,nama,jumlah,t&status=eq.menunggu&order=t.desc&limit=50').catch(()=>[]):[],pref.cair?readKey('cair_toko',[]).catch(()=>[]):[]]);
    tp=Array.isArray(a)?a:[];cr=(Array.isArray(b)?b:[]).filter(x=>x&&x.status==='menunggu');}catch(e){return}
  const seen=uangSeen(),idT=x=>'t'+x.id,idC=x=>'c'+(x.id||x.t||((x.toko||x.nama||'')+x.jumlah));
  const baruT=tp.filter(x=>!seen.has(idT(x))),baruC=cr.filter(x=>!seen.has(idC(x)));
  const semua=[...tp.map(idT),...cr.map(idC)];try{localStorage.setItem(UANG_SEEN,JSON.stringify([...new Set([...seen,...semua])].slice(-300)))}catch(e){}
  if(uangAwal){uangAwal=false;return}  // saat Admin baru dibuka: cukup tampil di beranda, tanpa bunyi
  if(baruT.length){const x=baruT[0];await kabarAdmin(`💰 ${baruT.length>1?baruT.length+' permintaan':'Permintaan'} isi saldo kurir`,`${x.nama||'Kurir'} minta isi saldo ${rp(x.jumlah)}${baruT.length>1?` dan ${baruT.length-1} lainnya`:''}. Ketuk untuk memproses.`,'ks-topup','kurir');}
  if(baruC.length){const x=baruC[0];await kabarAdmin(`💸 ${baruC.length>1?baruC.length+' permintaan':'Permintaan'} pencairan saldo toko`,`${x.nama||x.toko||'Toko'} minta cair ${rp(x.jumlah)}${baruC.length>1?` dan ${baruC.length-1} lainnya`:''}. Ketuk untuk memproses.`,'ks-cair','cair');}
  if(baruT.length||baruC.length)loadAll(true);
}

/* ========== SETORAN QRIS ==========
   Uang pembayaran QRIS (Duitku) masuk ke akun Kalensari Store. Halaman ini menghitung berapa yang harus
   diteruskan ke tiap toko (harga barang) dan tiap kurir (ongkir), lalu admin menandai "sudah disetor".
   Catatan setoran disimpan di store_settings key "setoran_qris": {"KODE|t:nama toko"|"KODE|k:id kurir": waktu} */
let setTab='toko',setLihat='';
const isQrisLunas=o=>/^(qris|saldo)/i.test(String(o.payment||''))&&o.pay_status==='lunas';   // QRIS atau saldo voucher (uang dipegang Kalensari Store)
const setMap=()=>{const v=S.settings.setoran_qris;return v&&typeof v==='object'&&!Array.isArray(v)?v:{}};
function setoranData(){
  const toko=new Map(),kurir=new Map(),refund=[],tunggu=[],done=setMap();
  const add=(m,key,name,wa,o,amt,mark)=>{if(!m.has(key))m.set(key,{key,name,wa,belum:[],sudah:[]});const g=m.get(key);(done[mark]?g.sudah:g.belum).push({o,amt,mark,t:done[mark]})};
  S.orders.filter(isQrisLunas).forEach(o=>{
    const st=stLabel(o.status);
    if(st==='Batal'){if(!refundSelesai(o))refund.push(o);const r=refundOf(o),ot=Number(o.ongkir_tetap)||0,kr=r&&r.kurir||kurirOf(o);if(ot>0)add(kurir,kr?String(kr.id||kr.wa||kr.nama):'?',kr?(kr.nama||'Kurir'):'Belum ada kurir',kr&&kr.wa,o,ot,o.order_code+'|k:'+(kr?String(kr.id||kr.wa||kr.nama):'?'));return}
    if(st==='Baru'){tunggu.push(o);return}               // belum diterima penjual: belum dihitung
    const items=Array.isArray(o.items)?o.items:[],by=new Map();
    items.forEach(it=>{const n=String(it.seller||'Tanpa toko').split(',')[0].trim(),k=sKey(n);by.set(k,{n,amt:((by.get(k)||{}).amt||0)+itemPrice(it)*(Number(it.qty)||1)})});
    by.forEach((v,k)=>{const m=memberToko(v.n);add(toko,k,v.n,m&&m.wa,o,v.amt,o.order_code+'|t:'+k)});
    const ship=Number(o.shipping)||0,kr=kurirOf(o);
    if(ship>0&&!(S.upah&&S.upah.has(o.order_code)))add(kurir,kr?String(kr.id||kr.wa||kr.nama):'?',kr?(kr.nama||'Kurir'):'Belum ada kurir',kr&&kr.wa,o,ship,o.order_code+'|k:'+(kr?String(kr.id||kr.wa||kr.nama):'?'));
  });
  return {toko:[...toko.values()],kurir:[...kurir.values()],refund,tunggu};
}
function memberToko(name){const l=Array.isArray(S.settings.penjual_members)?S.settings.penjual_members:[];return l.find(m=>m&&sKey(m.toko||m.usaha)===sKey(name))||null}
const sumAmt=a=>a.reduce((t,x)=>t+x.amt,0);
function setoranPage(){
  const d=setoranData();if(setTab==='toko')d.toko.forEach(g=>{g.belum=[]});const list=setTab==='toko'?[]:d.kurir;
  list.sort((a,b)=>sumAmt(b.belum)-sumAmt(a.belum)||a.name.localeCompare(b.name,'id'));
  const totBelum=sumAmt(d.toko.flatMap(g=>g.belum))+sumAmt(d.kurir.flatMap(g=>g.belum));
  const totLunas=S.orders.filter(isQrisLunas).reduce((t,o)=>t+(Number(o.total)||0),0);
  return `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    ${stat('Total masuk lewat QRIS',rp(totLunas),S.orders.filter(isQrisLunas).length+' pesanan lunas','rp','var(--g2)')}
    ${stat('Belum disetor',rp(totBelum),'ke toko & kurir','bag','var(--orange)')}
    ${stat('Perlu dikembalikan',rp(d.refund.reduce((t,o)=>t+refundJml(o),0)),d.refund.length+' pesanan dibatalkan setelah dibayar','doc','#ef4444')}</div>
  <div class="checkout-note" style="background:#fff8ec;border:1px solid #f3dfb8;border-radius:12px;padding:12px;font-size:13px;margin:4px 0 14px">Uang QRIS masuk ke saldo Duitku Kalensari Store. Yang dihitung di sini hanya pesanan QRIS <b>lunas</b> yang sudah diterima penjual (Diproses/Dikirim/Selesai). Biaya QRIS Duitku tidak dipotongkan dari setoran.</div>
  <div class="tabs">${[['toko','🏪 Per toko'],['kurir','🛵 Ongkir per kurir']].map(([k,l])=>`<button class="tab ${setTab===k?'on':''}" onclick="setTab='${k}';setLihat='';render()">${l}</button>`).join('')}</div>
  ${setTab==='toko'?`<div class="card" style="padding:16px;background:#fff8ec;border:1px solid #f3dfb8"><b>🏪 Uang barang toko sekarang lewat Saldo Penjualan</b><p class="sm" style="margin:6px 0 10px">Setiap pesanan non-COD yang selesai diantar otomatis masuk saldo toko. Toko mengajukan pencairan (1x sehari, minimal Rp20.000) dan Anda memprosesnya di menu Pencairan Saldo Toko.</p><button class="btn btn-g" onclick="go('cair')">Buka Pencairan Saldo Toko</button></div>`:''}
  <div class="cards">${list.length?list.map(g=>{const b=sumAmt(g.belum),open=setLihat===g.key;return `<div class="card" style="padding:14px">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><b style="font-size:16px">${esc(g.name)}</b><div class="sm" style="color:var(--mut)">${g.belum.length} pesanan belum disetor • ${g.sudah.length} sudah</div></div>
      <div style="text-align:right"><div style="font-size:20px;font-weight:800;color:${b?'var(--orange)':'var(--g2)'}">${rp(b)}</div><small style="color:var(--mut)">sudah disetor ${rp(sumAmt(g.sudah))}</small></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      ${b?`<button class="btn btn-g" onclick="tandaiSetor('${setTab}','${esc(g.key)}',this)">✅ Tandai sudah disetor ${rp(b)}</button>`:''}
      ${b&&g.wa?`<a class="btn" style="border:1px solid var(--line);text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${waSetor(g)}">💬 Kirim rincian ke WA</a>`:''}
      <button class="btn" style="border:1px solid var(--line)" onclick="setLihat=setLihat==='${esc(g.key)}'?'':'${esc(g.key)}';render()">${open?'Sembunyikan':'Lihat'} rincian</button></div>
    ${open?`<div class="tbl-wrap" style="margin-top:10px"><table><tr><th>Pesanan</th><th>Tanggal</th><th>Jumlah</th><th>Status</th></tr>${[...g.belum,...g.sudah].map(x=>`<tr><td>${esc(x.o.order_code)}</td><td>${fmtDate(x.o.paid_at||x.o.created_at)}</td><td>${rp(x.amt)}</td><td>${x.t?`✅ ${fmtDate(x.t)} <button class="more" title="Batalkan tanda" onclick="batalSetor('${esc(x.mark)}',this)">↺</button>`:'⏳ Belum'}</td></tr>`).join('')}</table></div>`:''}
  </div>`}).join(''):'<div class="empty">Belum ada pembayaran QRIS yang perlu disetor.</div>'}</div>
  ${d.refund.length?`<div class="card" style="margin-top:16px;border:1px solid #f5c6c2"><div class="chead"><h3>↩️ Dibatalkan setelah dibayar (kembalikan uang ke pembeli)</h3></div>${d.refund.map(o=>`<div class="detail-row"><span>${esc(o.order_code)} • ${esc(o.customer_name||'')}<br><small style="color:var(--mut)">${esc(o.customer_phone||'')}</small></span><b>${rp(refundJml(o))}</b></div>`).join('')}<button class="btn btn-light" style="margin-top:10px" onclick="go('refund')">Proses di menu Refund &amp; Toko Tutup</button></div>`:''}
  ${d.tunggu.length?`<p class="sm" style="color:var(--mut);margin-top:12px">⏳ ${d.tunggu.length} pesanan QRIS lunas masih menunggu diterima penjual (belum dihitung).</p>`:''}`;
}
function waSetor(g){
  const wa=String(g.wa||'').replace(/\D/g,'').replace(/^0/,'62');
  const txt=`Assalamualaikum ${g.name}, berikut rincian setoran QRIS Kalensari Store:\n\n${g.belum.map(x=>`• ${x.o.order_code}: ${rp(x.amt)}`).join('\n')}\n\nTotal: ${rp(sumAmt(g.belum))}\nTerima kasih 🙏`;
  return `https://wa.me/${wa}?text=${encodeURIComponent(txt)}`;
}
async function tandaiSetor(tab,key,btn){
  const g=(setoranData()[tab]||[]).find(x=>x.key===key);if(!g||!g.belum.length)return;
  if(!confirm(`Tandai ${g.belum.length} pesanan (${rp(sumAmt(g.belum))}) untuk ${g.name} sebagai SUDAH DISETOR?`))return;
  await busy(btn,async()=>{const cur=await readKey('setoran_qris',{}),m=cur&&typeof cur==='object'&&!Array.isArray(cur)?cur:{},t=new Date().toISOString();
    g.belum.forEach(x=>{m[x.mark]=t});await setSetting('setoran_qris',m);S.settings.setoran_qris=m;render();toast('Setoran '+g.name+' dicatat')});
}
async function batalSetor(mark,btn){
  if(!confirm('Batalkan tanda "sudah disetor" untuk baris ini?'))return;
  await busy(btn,async()=>{const cur=await readKey('setoran_qris',{}),m=cur&&typeof cur==='object'&&!Array.isArray(cur)?cur:{};delete m[mark];await setSetting('setoran_qris',m);S.settings.setoran_qris=m;render();toast('Tanda setoran dibatalkan')});
}
/* ========== COD & GAGAL ANTAR ==========
   cod_aturan (store_settings): {maks, wa_baru, maks_gagal, buka:{"62812..":"ISO waktu buka blokir"}}
   - Checkout menolak COD bila total > maks atau nomor sudah gagal >= maks_gagal (dihitung setelah waktu buka blokir).
   - Pembeli yang belum pernah punya pesanan selesai -> pay_status "tunggu_wa" (disembunyikan dari penjual) sampai admin konfirmasi.
   - Kurir menekan "Gagal antar" -> status "gagal" + gagal_alasan + gagal_at. */
function utAdminHtml(o){
  if(!isCodO(o)||!['diproses','dikirim','selesai','gagal'].includes(o.status))return '';
  const ut=o.uang_toko&&typeof o.uang_toko==='object'?o.uang_toko:{},m=new Map();
  (Array.isArray(o.items)?o.items:[]).forEach(it=>{const n=String(it.seller||'Toko').trim(),k=n.toLowerCase();if(!m.has(k))m.set(k,{n,v:0});m.get(k).v+=itemPrice(it)*(Number(it.qty)||1)});
  return [...m.entries()].map(([k,x])=>`<div class="detail-row"><span>💵 Uang barang ke ${esc(x.n)}<br><small style="color:var(--mut)">${rp(x.v)}</small></span><b style="color:${ut[k]?'var(--g2)':'var(--orange)'}">${ut[k]?'✅ Diterima '+fmtDate(ut[k]):'⏳ Belum dikonfirmasi toko'}</b></div>`).join('');
}
const COD_DEF={maks:100000,wa_baru:true,maks_gagal:2,buka:{}};
const codAt=()=>({...COD_DEF,...(S.settings.cod_aturan&&typeof S.settings.cod_aturan==='object'?S.settings.cod_aturan:{})});
const isCodO=o=>/^cod/i.test(String(o.payment||'').trim());
const codTunggu=()=>S.orders.filter(o=>o.pay_status==='tunggu_wa'&&stLabel(o.status)==='Baru');
function codWaLink(o){const wa=phoneKey(o.customer_phone);const txt=`Assalamualaikum ${o.customer_name||''}, ini admin Kalensari Store 🙏\n\nKami ingin konfirmasi pesanan COD Anda:\nKode: ${orderCode(o)}\nTotal: ${rp(o.total)}\nAlamat: ${cleanMap(o.address)||'-'}\n\nApakah pesanan ini benar dan siap dibayar tunai saat barang tiba? Balas "YA" untuk lanjut 🙏`;return `https://wa.me/${wa}?text=${encodeURIComponent(txt)}`}
function codBermasalah(){
  const A=codAt(),m=new Map();
  S.orders.filter(o=>o.status==='gagal'&&isCodO(o)).forEach(o=>{
    const hp=phoneKey(o.customer_phone_normalized||o.customer_phone);if(!hp)return;
    const t=Date.parse(o.gagal_at||o.updated_at||o.created_at)||0,buka=Date.parse((A.buka||{})[hp]||'')||0;
    if(!m.has(hp))m.set(hp,{hp,nama:o.customer_name||'',hitung:0,semua:0,last:null});
    const g=m.get(hp);g.semua++;if(t>buka)g.hitung++;if(!g.last||t>(Date.parse(g.last.gagal_at||g.last.updated_at)||0))g.last=o;
  });
  return [...m.values()].filter(g=>g.hitung>0).sort((a,b)=>b.hitung-a.hitung);
}

/* ========== REFUND & TOKO TUTUP ==========
   orders.refund (jsonb) = {jumlah, barang, ongkir, ongkir_kurir, kurir, status:'menunggu'|'selesai', t, selesai_t, ket}
   orders.batal_alasan / batal_at / ongkir_tetap : diisi kurir saat toko tutup (dashboard-kurir.html) atau pembatalan otomatis.

function refundOf(o){return o&&o.refund&&typeof o.refund==='object'?o.refund:null}

function refundSelesai(o){const r=refundOf(o);return !!(r&&(r.status==='selesai'||r.status==='saldo'))}
function refundTunggu(){return S.orders.filter(o=>isQrisLunas(o)&&o.status==='dibatalkan'&&!refundSelesai(o))}

function ttAt(){return ({...TT_DEF,...(S.settings.aturan_toko_tutup&&typeof S.settings.aturan_toko_tutup==='object'?S.settings.aturan_toko_tutup:{})})}
function pelMap(){return S.settings.pelanggaran_toko&&typeof S.settings.pelanggaran_toko==='object'&&!Array.isArray(S.settings.pelanggaran_toko)?S.settings.pelanggaran_toko:{}}

async function refundSudah(id,btn){
  const o=S.orders.find(x=>Number(x.id)===Number(id));if(!o)return;
  const ket=prompt(`Refund ${rp(refundJml(o))} untuk ${orderCode(o)} sudah dikirim?\n\nKeterangan (mis. "DANA 0812xxx a.n. Budi"):`,'');if(ket===null)return;
  await busy(btn,async()=>{const t=new Date().toISOString(),r={...(refundOf(o)||{jumlah:Number(o.total)||0,t:o.updated_at}),status:'selesai',selesai_t:t,ket:ket.trim()};
    try{await api('orders?id=eq.'+Number(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({refund:r,updated_at:t})})}
    catch(e){if(/refund|column/i.test(String(e.message)))throw new Error('Jalankan supabase-toko-tutup.sql di Supabase dulu');throw e}
    o.refund=r;render();toast('Refund ditandai selesai')});
}

async function vcKoreksi(btn){

function saldoToko(){
  const sq=setMap(),m=new Map(),ensure=(k,n)=>{if(!m.has(k))m.set(k,{k,n,masuk:0,keluar:0,ps:0});return m.get(k)};
  S.orders.filter(o=>o.status==='selesai'&&!isCodO(o)&&!(/^qris/i.test(String(o.payment||''))&&o.pay_status!=='lunas')).forEach(o=>{
    const by=new Map();(Array.isArray(o.items)?o.items:[]).forEach(it=>{const n=String(it.seller||'Tanpa toko').split(',')[0].trim(),k=n.toLowerCase();by.set(k,{n,v:((by.get(k)||{}).v||0)+itemPrice(it)*(Number(it.qty)||1)})});
    by.forEach((x,k)=>{if(sq[o.order_code+'|t:'+k])return;const g=ensure(k,x.n);g.masuk+=x.v;g.ps++});
  });
  cairList().forEach(x=>{const g=ensure(x.toko,x.nama||x.toko);if(x.status!=='ditolak')g.keluar+=Number(x.jumlah)||0});
  Object.keys(pelMap()).forEach(k=>{const v=potonganToko(k);if(v>0){const l=pelMap()[k];const g=ensure(k,(l[l.length-1]||{}).nama||k);g.keluar+=v;g.potong=v}});
  return [...m.values()].map(g=>({...g,saldo:g.masuk-g.keluar})).sort((a,b)=>b.saldo-a.saldo);
}

async function ambilSemua(tabel,urut){
  const hasil=[];
  for(let dari=0;dari<200000;dari+=1000){
    const r=await api(`${tabel}?select=*${urut?'&order='+urut:''}&limit=1000&offset=${dari}`);
    if(!Array.isArray(r))break;hasil.push(...r);if(r.length<1000)break;
  }
  return hasil;
}
async function unduhBackup(btn){
  const TABEL=[['products','id.asc'],['orders','id.asc'],['store_settings','key.asc'],['ulasan',''],['pembeli_saldo',''],['pembeli_mutasi',''],['pembeli_ajak',''],
    ['kurir_saldo',''],['kurir_mutasi',''],['kurir_topup',''],['kurir_cair',''],['lapak_iklan',''],['lapak_komentar',''],['admin_log','t.desc']];
  const info=$('#bkInfo'),data={},gagal=[];
  await busy(btn,async()=>{
    for(const [t,u] of TABEL){
      if(info)info.textContent=`Mengambil ${t}...`;
      try{let r=await ambilSemua(t,u);if(t==='store_settings')r=r.filter(x=>!/^(foto|lacak)_/.test(x.key));data[t]=r}
      catch(e){gagal.push(t)}
    }
    const jumlah=Object.fromEntries(Object.entries(data).map(([k,v])=>[k,v.length]));
    const isi={aplikasi:'Kalensari Store',dibuat:new Date().toISOString(),oleh:(auth&&auth.email)||'',jumlah,data};
    const tgl=new Date(Date.now()+7*36e5).toISOString().slice(0,16).replace('T','_').replace(':','');
    const blob=new Blob([JSON.stringify(isi)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`kalensari-backup-${tgl}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    try{localStorage.setItem('ks_backup_t',String(Date.now()))}catch(e){}
    api('rpc/admin_catat',{method:'POST',body:JSON.stringify({p_aksi:'backup',p_info:`${jumlah.orders||0} pesanan, ${jumlah.products||0} produk`})}).catch(()=>{});
    const mb=(blob.size/1048576).toFixed(1);
    if(info)info.textContent=`✅ Backup diunduh (${mb} MB): ${jumlah.orders||0} pesanan, ${jumlah.products||0} produk${gagal.length?` · dilewati: ${gagal.join(', ')}`:''}`;
    toast('Backup diunduh');LOG.data=null;
  });
}

        <button class="btn btn-light" style="padding:6px 10px" onclick="lapakLihat=lapakLihat===${x.id}?0:${x.id};render()">💬 ${ks.length} komentar</button>
        <button class="btn btn-red" style="padding:6px 10px" onclick="lapakHapus(${x.id},this)">Hapus</button></div>
      ${open?`<div style="background:#faf6f2;border-radius:10px;padding:8px 10px;margin-top:8px">${ks.length?ks.map(k=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #eee"><span class="sm"><b>${esc(k.nama)}</b> ${ago(k.created_at)}<br>${esc(k.isi)}</span><button class="more" title="Hapus komentar" onclick="lapakHapusKom(${k.id},this)">${ico('trash')}</button></div>`).join(''):'<span class="sm">Belum ada komentar</span>'}</div>`:''}
    </div>`}).join(''):'<div class="empty" style="padding:14px">Belum ada iklan</div>'}</div>`;
}
async function lapakStatus(id,st,btn){await busy(btn,async()=>{await api('lapak_iklan?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:st})});const x=LAPAK.i.find(y=>y.id===id);if(x)x.status=st;render();toast(st==='aktif'?'Iklan ditampilkan':'Iklan disembunyikan')})}
async function lapakHapus(id,btn){if(!confirm('Hapus iklan ini beserta komentarnya?'))return;await busy(btn,async()=>{await api('lapak_iklan?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});LAPAK.i=LAPAK.i.filter(y=>y.id!==id);LAPAK.k=LAPAK.k.filter(y=>y.iklan_id!==id);render();toast('Iklan dihapus')})}
async function lapakHapusKom(id,btn){if(!confirm('Hapus komentar ini?'))return;await busy(btn,async()=>{await api('lapak_komentar?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=minimal'}});LAPAK.k=LAPAK.k.filter(y=>y.id!==id);render();toast('Komentar dihapus')})}
/* ========== KEUANGAN ==========
   Omset          = nilai semua pesanan yang tidak batal (harga barang + ongkir), semua cara bayar.
   Pendapatan bersih Kalensari Store = potongan saldo kurir per pesanan
                    + pemasukan lain (catatan manual) − biaya QRIS (persen, bisa diatur) − pengeluaran (catatan manual).
   Catatan manual disimpan di store_settings key "keuangan_catatan": [{id,t,jenis:'masuk'|'keluar',ket,jumlah}]
   Persen biaya QRIS di key "biaya_qris_persen" (bawaan 0,7%).                                                     */
let kuPeriode='bulan';
const KU_PER=[['hari','Hari ini'],['7','7 hari'],['bulan','Bulan ini'],['30','30 hari'],['tahun','Tahun ini'],['semua','Semua']];
const wibDate=d=>new Date(new Date(d).getTime()+7*36e5).toISOString().slice(0,10);   // YYYY-MM-DD (WIB)
function kuRange(){const now=wibDate(new Date());const back=n=>wibDate(Date.now()-(n-1)*864e5);
  return {hari:[now,now],'7':[back(7),now],bulan:[now.slice(0,8)+'01',now],'30':[back(30),now],tahun:[now.slice(0,5)+'01-01',now],semua:['0000-00-00','9999-12-31']}[kuPeriode]}
const inR=(d,[a,b])=>{const x=wibDate(d);return x>=a&&x<=b};
const kuCatatan=()=>Array.isArray(S.settings.keuangan_catatan)?S.settings.keuangan_catatan:[];
const qrisPersen=()=>{const v=Number(S.settings.biaya_qris_persen);return Number.isFinite(v)&&v>=0?v:0.7};
function kuHitung(r){
  const os=S.orders.filter(o=>inR(o.created_at,r)&&!isCancelled(o));
  const barang=os.reduce((t,o)=>t+(Number(o.subtotal)||Math.max(0,(Number(o.total)||0)-(Number(o.shipping)||0))),0);
  const ongkir=os.reduce((t,o)=>t+(Number(o.shipping)||0),0),omset=os.reduce((t,o)=>t+(Number(o.total)||0),0);
  const cara=new Map();os.forEach(o=>{const k=/^qris/i.test(o.payment||'')?(o.pay_status==='lunas'?'QRIS (lunas)':'QRIS (belum bayar)'):(o.payment||'Lainnya');cara.set(k,(cara.get(k)||0)+(Number(o.total)||0))});
  const qrisLunas=S.orders.filter(o=>isQrisLunas(o)&&inR(o.paid_at||o.created_at,r)).reduce((t,o)=>t+(Number(o.total)||0),0);
  const potKurir=(S.potong||[]).filter(x=>inR(x.t,r)).reduce((t,x)=>t+Math.abs(Number(x.jumlah)||0),0);
  const cat=kuCatatan().filter(x=>inR(x.t,r)),masukLain=cat.filter(x=>x.jenis==='masuk').reduce((t,x)=>t+(Number(x.jumlah)||0),0),keluar=cat.filter(x=>x.jenis!=='masuk').reduce((t,x)=>t+(Number(x.jumlah)||0),0);
  const biayaQris=Math.round(qrisLunas*qrisPersen()/100),bersih=potKurir+masukLain-biayaQris-keluar;
  return {os,barang,ongkir,omset,cara,qrisLunas,potKurir,masukLain,keluar,biayaQris,bersih,cat};
}
/* Kartu dashboard: pendapatan bersih admin (rumus sama dengan menu Keuangan) */
function kartuBersih(){
  const now=wibDate(new Date()),b=kuHitung([now.slice(0,8)+'01',now]),h=kuHitung([now,now]);
  const neg=v=>v<0,uang=v=>(neg(v)?'− ':'')+rp(Math.abs(v));
  const chip=(l,v,plus)=>`<div class="kb-c"><small>${l}</small><b class="${plus?'p':'m'}">${plus?'+':'−'} ${rp(Math.abs(v))}</b></div>`;
  const bln=new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric',timeZone:'Asia/Jakarta'});
  return `<div class="card kb" onclick="go('keuangan')" role="button" tabindex="0">
    <div class="kb-top"><div class="ic" style="background:${neg(b.bersih)?'#ef4444':'var(--g2)'}">${ico('rp')}</div>
      <div class="kb-main"><div class="lbl">Pendapatan Bersih Admin <span class="kb-per">${esc(bln)}</span></div>
        <div class="kb-val" style="color:${neg(b.bersih)?'var(--red)':'var(--g2)'}">${uang(b.bersih)}</div>
        <small>Hari ini <b style="color:${neg(h.bersih)?'var(--red)':'var(--tx)'}">${uang(h.bersih)}</b> • yang benar-benar jadi milik Kalensari Store</small></div>
      <span class="kb-go">Lihat Keuangan ${ico('right')}</span></div>
    <div class="kb-rinci">${chip('Potongan kurir',b.potKurir,1)}${chip('Pemasukan lain',b.masukLain,1)}${chip('Biaya QRIS',b.biayaQris,0)}${chip('Pengeluaran',b.keluar,0)}</div></div>`;
}
function keuanganPage(){
  const r=kuRange(),h=kuHitung(r),row=(l,v,c)=>`<div class="detail-row"><span>${l}</span><b style="${c?'color:'+c:''}">${v}</b></div>`;
  // grafik omset per hari (maks 31 hari terakhir dari periode)
  const end=new Date(r[1]==='9999-12-31'?wibDate(new Date()):r[1]),nDays=Math.min(31,Math.max(1,Math.round((end-new Date(r[0]==='0000-00-00'?Date.now()-29*864e5:r[0]))/864e5)+1));
  const days=[...Array(nDays)].map((_,i)=>new Date(end.getTime()-(nDays-1-i)*864e5).toISOString().slice(0,10));
  const per=new Map(days.map(d=>[d,0]));h.os.forEach(o=>{const d=wibDate(o.created_at);if(per.has(d))per.set(d,per.get(d)+(Number(o.total)||0))});
  const vals=days.map(d=>per.get(d)),max=Math.max(...vals,1),every=Math.ceil(nDays/8),short=v=>v>=1e6?(v/1e6).toFixed(1)+' jt':v>=1e3?Math.round(v/1e3)+' rb':v||'';
  return `<div class="tabs">${KU_PER.map(([k,l])=>`<button class="tab ${kuPeriode===k?'on':''}" onclick="kuPeriode='${k}';render()">${l}</button>`).join('')}</div>
  <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    ${stat('Omset',rp(h.omset),h.os.length+' pesanan (tanpa yang batal)','chart','var(--blue)')}
    ${stat('Pendapatan bersih',(h.bersih<0?'− ':'')+rp(Math.abs(h.bersih)),'yang benar-benar jadi milik Kalensari Store','rp',h.bersih>=0?'var(--g2)':'#ef4444')}</div>
  <div class="grid2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:16px 0">
    <div class="card"><div class="chead"><h3>📊 Rincian omset</h3></div>
      ${row('Penjualan barang (milik toko)',rp(h.barang))}${row('Ongkir (milik kurir)',rp(h.ongkir))}${row('<b>Total omset</b>',rp(h.omset))}
      <p class="sm" style="color:var(--mut);margin:12px 0 4px;font-weight:600">Per cara bayar</p>${[...h.cara.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>row(esc(k),rp(v))).join('')||'<div class="sm">-</div>'}</div>
    <div class="card"><div class="chead"><h3>💰 Pendapatan bersih</h3></div>
      ${row('Potongan saldo kurir per pesanan',rp(h.potKurir),'var(--g2)')}${row('Pemasukan lain (catatan)',rp(h.masukLain),'var(--g2)')}
      ${row(`Biaya QRIS ${String(qrisPersen()).replace('.',',')}% × ${rp(h.qrisLunas)} <button class="more" title="Ubah persen" onclick="ubahPersenQris()">✎</button>`,'− '+rp(h.biayaQris),'#c0392b')}
      ${row('Pengeluaran (catatan)','− '+rp(h.keluar),'#c0392b')}${row('<b>Pendapatan bersih</b>',(h.bersih<0?'− ':'')+rp(Math.abs(h.bersih)),h.bersih>=0?'var(--g2)':'#c0392b')}
      <p class="sm" style="color:var(--mut);margin-top:10px">Uang barang & ongkir bukan pendapatan Kalensari Store karena diteruskan ke toko dan kurir (lihat menu Setoran QRIS).</p></div></div>
  <div class="card" style="margin-bottom:16px"><div class="chead"><h3>Omset per hari</h3><span class="sm" style="color:var(--mut);font-size:12px">${nDays} hari</span></div>
    <div class="bars" style="margin-top:20px;gap:${nDays>10?3:12}px">${vals.map((v,i)=>`<div style="height:${v/max*100}%" title="${days[i]}: ${rp(v)}">${nDays<=10?`<span>${short(v)}</span>`:''}</div>`).join('')}</div>
    <div class="blabels" style="gap:${nDays>10?3:12}px">${days.map((d,i)=>`<span>${i%every===0?d.slice(8)+'/'+d.slice(5,7):''}</span>`).join('')}</div></div>
  <div class="card"><div class="chead"><h3>📝 Catatan pemasukan & pengeluaran lain</h3><button class="btn btn-g" onclick="kuForm()">${ico('plus')}Tambah</button></div>
    ${h.cat.length?h.cat.slice().sort((a,b)=>String(b.t).localeCompare(String(a.t))).map(x=>`<div class="detail-row"><span style="white-space:normal">${esc(x.ket||'-')}<br><small style="color:var(--mut)">${fmtDate(x.t)}</small></span><b style="color:${x.jenis==='masuk'?'var(--g2)':'#c0392b'}">${x.jenis==='masuk'?'+':'−'} ${rp(x.jumlah)} <button class="more" title="Hapus" onclick="kuHapus('${esc(x.id)}',this)">${ico('trash')}</button></b></div>`).join(''):'<div class="sm" style="color:var(--mut)">Belum ada catatan di periode ini. Contoh: biaya hosting/domain, beli kemasan, pulsa, atau pemasukan iklan.</div>'}</div>`;
}
function kuForm(){
  modal(`<div class="chead"><h3 style="margin:0">Tambah catatan</h3><button class="more" onclick="closeModal()">${ico('x')}</button></div>
  <div class="field"><label>Jenis</label><select class="inp" id="kuJ"><option value="keluar">Pengeluaran</option><option value="masuk">Pemasukan lain</option></select></div>
  <div class="field"><label>Keterangan</label><input class="inp" id="kuK" maxlength="80" placeholder="mis. Bayar domain kalensari.web.id"></div>
  <div class="field"><label>Jumlah (Rp)</label><input class="inp" id="kuN" inputmode="numeric" placeholder="mis. 150000"></div>
  <div class="field"><label>Tanggal</label><input class="inp" id="kuT" type="date" value="${wibDate(new Date())}"></div>
  <button class="btn btn-g full" onclick="kuSimpan(this)">Simpan</button>`);
}
async function kuSimpan(btn){
  const jumlah=parseInt(String($('#kuN').value).replace(/\D/g,''),10)||0,ket=$('#kuK').value.trim(),tgl=$('#kuT').value;
  if(!ket)return toast('Isi keterangannya');if(!jumlah)return toast('Isi jumlahnya');
  await busy(btn,async()=>{const cur=await readKey('keuangan_catatan',[]),l=Array.isArray(cur)?cur:[];
    l.push({id:Date.now().toString(36),t:(tgl?new Date(tgl+'T12:00:00+07:00'):new Date()).toISOString(),jenis:$('#kuJ').value,ket,jumlah});
    await setSetting('keuangan_catatan',l);S.settings.keuangan_catatan=l;closeModal();render();toast('Catatan disimpan')});
}
async function kuHapus(id,btn){
  if(!confirm('Hapus catatan ini?'))return;
  await busy(btn,async()=>{const cur=await readKey('keuangan_catatan',[]),l=(Array.isArray(cur)?cur:[]).filter(x=>x.id!==id);
    await setSetting('keuangan_catatan',l);S.settings.keuangan_catatan=l;render();toast('Catatan dihapus')});
}
async function ubahPersenQris(){
  const v=prompt('Biaya QRIS dari Duitku (persen dari nominal). Cek angka pastinya di dashboard Duitku.',String(qrisPersen()).replace('.',','));
  if(v==null)return;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0||n>10)return toast('Isi angka persen yang valid, mis. 0,7');
  await busy(null,async()=>{await setSetting('biaya_qris_persen',n);S.settings.biaya_qris_persen=n;render();toast('Biaya QRIS diubah ke '+String(n).replace('.',',')+'%')});
}
</script>
