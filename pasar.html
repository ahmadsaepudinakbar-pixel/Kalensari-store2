<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lapak Barter Kalensari</title>
<meta name="theme-color" content="#5b2e1a">
<link rel="icon" href="icons/logo-kalensari.png">
<style>
:root{--b:#5b2e1a;--b2:#7b3f1d;--ink:#3a1f10;--mu:#7a6454;--bg:#f6eee6;--ln:#e3d2c3;--card:#fff;--ok:#14502c;--okbg:#e1f5ee;--bar:#3c3489;--barbg:#eeedfe;--warn:#a35a00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--b);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top a.back{color:#fff;text-decoration:none;font-size:13px;opacity:.9;white-space:nowrap}
.top h1{font-size:18px;margin:0;flex:1;line-height:1.2}
.top h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.8}
.top .tb{background:rgba(255,255,255,.15);border:0;color:#fff;font:inherit;font-size:13px;font-weight:700;padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:0 12px}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:16px;padding:12px 0;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;padding-bottom:2px}
.chips button{white-space:nowrap;border:1px solid var(--ln);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--b);border-color:var(--b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.it{background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(91,46,26,.06)}
.it .ph{aspect-ratio:1/1;background:#efe4d8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.it .ph .sold{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.it .bd{padding:9px 10px 11px}
.it h3{font-size:14px;margin:0 0 5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;margin:0 4px 4px 0}
.tag.j{background:var(--okbg);color:var(--ok)}.tag.b{background:var(--barbg);color:var(--bar)}.tag.n{background:#faeeda;color:#633806}
.it small{display:block;font-size:11.5px;color:var(--mu);margin-top:2px}
.empty{text-align:center;color:var(--mu);padding:40px 10px;background:#fff;border:1px dashed var(--ln);border-radius:16px;margin-top:12px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--b);color:#fff;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:800;font-size:15px;box-shadow:0 10px 26px rgba(60,30,10,.35);cursor:pointer}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:12px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;background:#efe4d8;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center;cursor:zoom-in;display:block}
.gal .noimg{flex:0 0 100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:54px}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#d6c1ae}.dots i.on{background:var(--b2)}
.d-title{font-size:20px;margin:12px 0 6px;line-height:1.3}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0e4d8;font-size:14.5px}
.row:last-child{border-bottom:0}.row span{color:var(--mu)}.row b{text-align:right}
.own{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--b);background:#fff;color:var(--b);font:inherit;font-weight:700;font-size:14px;padding:11px 14px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.p{background:var(--b);color:#fff}.btn.r{border-color:#d9a39a;color:#b3261e}.btn.full{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.cmh{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px}
.cmh b{font-size:16px}
.cm{display:grid;grid-template-columns:34px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid #f3e9df}
.cm:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:50%;background:#faeeda;color:#633806;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.av.ow{background:var(--okbg);color:var(--ok)}
.cm .nm{font-size:13.5px;font-weight:700}.cm .nm em{font-style:normal;font-size:10.5px;background:var(--okbg);color:var(--ok);padding:2px 6px;border-radius:6px;margin-left:4px}
.cm .tm{font-size:11.5px;color:var(--mu);font-weight:400;margin-left:4px}
.cm p{margin:3px 0 0;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.cm .del{border:0;background:none;color:#b3261e;font-size:12px;cursor:pointer;padding:2px 0;margin-top:2px}
.cbox{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.cbox textarea{flex:1;min-height:44px;max-height:140px;resize:vertical;border:1px solid var(--ln);border-radius:12px;padding:11px;font:inherit;font-size:15px;outline:0}
.cbox textarea:focus,.f input:focus,.f textarea:focus{border-color:var(--b2);box-shadow:0 0 0 3px #7b3f1d14}
.f label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.f label small{font-weight:400;color:var(--mu)}
.f input,.f textarea{width:100%;border:1px solid var(--ln);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;outline:0;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.rp{display:flex;align-items:center;border:1px solid var(--ln);border-radius:12px;background:#fff;overflow:hidden}
.rp span{padding:0 4px 0 12px;font-weight:700;color:var(--mu)}.rp input{border:0;border-radius:0}
.ro{background:#f8f1ea;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:15px}
.ro small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fs{aspect-ratio:1/1;border:1.5px dashed #cfb8a4;border-radius:14px;background:#fff center/cover no-repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--mu);cursor:pointer;position:relative}
.fs b{font-size:24px}.fs.has{border-style:solid;border-color:var(--ln)}
.fs .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:#b3261e;color:#fff;font-weight:700;cursor:pointer}
.fs .utama{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
.hint{font-size:12.5px;color:var(--mu);margin:6px 0 0;line-height:1.45}
.err{color:#b3261e;font-size:13px;min-height:18px;margin-top:8px}
.mine{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0e4d8}
.mine:last-child{border-bottom:0}
.mine .ph{width:64px;height:64px;border-radius:12px;background:#efe4d8 center/cover;display:flex;align-items:center;justify-content:center;font-size:24px}
.mine h4{margin:0;font-size:14.5px}.mine small{color:var(--mu);font-size:12px}
.mine .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.mine .acts .btn{padding:6px 10px;font-size:12.5px;border-radius:10px}
.st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:4px}
.st.aktif{background:var(--okbg);color:var(--ok)}.st.selesai{background:#eee;color:#555}.st.disembunyikan{background:#fdecea;color:#b3261e}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.2);color:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2d211c;color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.load{text-align:center;color:var(--mu);padding:30px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="back" href="index.html">← Toko</a>
  <h1>🔁 Lapak Barter Kalensari<small>Jual beli & barter barang warga</small></h1>
  <button class="tb" id="btnSaya" type="button">📋 Iklan saya</button>
</div></header>
<main class="wrap" id="v"><div class="load">Memuat…</div></main>
<button class="fab" id="fab" type="button">+ Pasang iklan</button>
<div class="toast" id="toast"></div>
<script src="config.js" onerror="void 0"></script>
<script>
/* =====================================================================
   LAPAK BARTER KALENSARI
   Data: Supabase tabel lapak_iklan & lapak_komentar (lihat supabase-lapak.sql)
   Akun: memakai akun pembeli Kalensari Store (pembeli_accounts / pembeli_members)
   Halaman: #/ beranda • #/i/<id> detail + komentar • #/pasang • #/ubah/<id> • #/saya
   ===================================================================== */
const CFG = window.CLOUD_CONFIG || {}, BASE = String(CFG.supabaseUrl || "").replace(/\/$/, "");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => "Rp" + Number(n || 0).toLocaleString("id-ID");
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2600); }
function lalu(t){ const d = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
  if(d < 60) return "baru saja"; if(d < 3600) return Math.floor(d / 60) + " mnt"; if(d < 86400) return Math.floor(d / 3600) + " jam";
  if(d < 86400 * 30) return Math.floor(d / 86400) + " hari"; return new Date(t).toLocaleDateString("id-ID", {day:"numeric", month:"short", year:"numeric"}); }
const inisial = n => String(n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";

async function api(path, opt = {}){
  if(!CFG.enabled || !BASE) throw new Error("Database online belum aktif");
  const r = await fetch(`${BASE}/rest/v1/${path}`, {...opt, headers:{apikey:CFG.supabaseAnonKey, Authorization:"Bearer " + CFG.supabaseAnonKey, "Content-Type":"application/json", Prefer:"return=representation", ...(opt.headers || {})}});
  const t = await r.text(); if(!r.ok) throw new Error(t || ("HTTP " + r.status));
  return t ? JSON.parse(t) : [];
}

/* ---------- akun pembeli ---------- */
let ME = undefined;
function waLogin(){ try{ const v = JSON.parse(localStorage.getItem("kalensari_pembeli_login") || "null"); if(v && v.wa && v.exp > Date.now()) return v.wa; }catch(e){} return sessionStorage.getItem("kalensari_pembeli_sess") || null; }
async function akun(){
  if(ME !== undefined) return ME;
  const wa = waLogin(); if(!wa){ ME = null; return ME; }
  try{
    const r = await api("store_settings?select=key,value&key=in.(pembeli_accounts,pembeli_members)"), S = {};
    (r || []).forEach(x => S[x.key] = x.value);
    const a = (S.pembeli_accounts || {})[wa]; if(!a){ ME = null; return ME; }
    const m = (Array.isArray(S.pembeli_members) ? S.pembeli_members : []).find(x => x && x.id === a.id) || {};
    ME = {wa, nama:String(m.nama || "").trim() || "Warga", alamat:String(m.dusun || m.alamat || "").trim().slice(0, 60)};
  }catch(e){ ME = null; }
  return ME;
}
function keLogin(kembali){ sessionStorage.setItem("kalensari_next", "url:pasar.html" + (kembali || "")); location.href = "akun-pembeli.html"; }

/* ---------- foto: diperkecil di HP sebelum disimpan ---------- */
function kecilkan(file, max, q){
  return new Promise((ok, no) => { const r = new FileReader(); r.onerror = no;
    r.onload = () => { const im = new Image(); im.onerror = () => no(new Error("Foto tidak bisa dibaca"));
      im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", q)); };
      im.src = r.result; };
    r.readAsDataURL(file); });
}
function kotak(dataUrl, ukuran){
  return new Promise(ok => { const im = new Image(); im.onload = () => { const z = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = ukuran;
    c.getContext("2d").drawImage(im, (im.width - z) / 2, (im.height - z) / 2, z, z, 0, 0, ukuran, ukuran); ok(c.toDataURL("image/jpeg", .72)); }; im.src = dataUrl; });
}

/* ---------- label harga / barter ---------- */
function tags(i){
  let h = "";
  if(i.harga) h += `<span class="tag j">${rp(i.harga)}</span>`;
  if(i.barter) h += `<span class="tag b">🔁 Barter</span>`;
  if(!i.harga && !i.barter) h += `<span class="tag n">Nego</span>`;
  return h;
}

/* ---------- router ---------- */
let pollKom = null;
function go(h){ if(location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);
async function render(){
  clearInterval(pollKom); pollKom = null;
  const h = location.hash || "#/", v = $("v"); let m;
  $("fab").hidden = !(h === "#/" || h === "#" || h === "");
  scrollTo(0, 0);
  try{
    if((m = h.match(/^#\/i\/(\d+)/))) return await detail(+m[1]);
    if(h === "#/pasang") return await formIklan(null);
    if((m = h.match(/^#\/ubah\/(\d+)/))) return await formIklan(+m[1]);
    if(h === "#/saya") return await iklanSaya();
    return await beranda();
  }catch(e){ v.innerHTML = `<div class="empty">⚠️ ${esc(e.message || e).slice(0, 160)}<br><br><button class="btn" onclick="render()">Coba lagi</button></div>`; }
}
$("fab").onclick = () => go("#/pasang");
$("btnSaya").onclick = () => go("#/saya");

/* ---------- 1. BERANDA ---------- */
let F = {q:"", jenis:"semua"}, CACHE = null;
async function beranda(){
  const v = $("v");
  if(!CACHE){ v.innerHTML = '<div class="load">Memuat lapak…</div>';
    const [rows, kom] = await Promise.all([
      api("lapak_iklan?select=id,created_at,nama,alamat,judul,kondisi,harga,barter,thumb,status&status=in.(aktif,selesai)&order=created_at.desc&limit=200"),
      api("lapak_komentar?select=iklan_id&limit=5000").catch(() => [])]);
    const jml = {}; (kom || []).forEach(k => jml[k.iklan_id] = (jml[k.iklan_id] || 0) + 1);
    CACHE = (rows || []).map(r => ({...r, kom:jml[r.id] || 0}));
  }
  v.innerHTML = `<div class="search">🔍<input id="q" type="search" placeholder="Cari barang… (sepeda, HP, bibit)" value="${esc(F.q)}" autocomplete="off"></div>
    <div class="chips">${[["semua","Semua"],["jual","💰 Dijual"],["barter","🔁 Barter"],["nego","🤝 Nego"]].map(([k, l]) => `<button data-j="${k}" class="${F.jenis === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div id="grid"></div>`;
  const isi = () => {
    const q = F.q.toLowerCase().trim();
    const l = CACHE.filter(i => (!q || [i.judul, i.barter, i.kondisi, i.nama, i.alamat].join(" ").toLowerCase().includes(q))
      && (F.jenis === "semua" || (F.jenis === "jual" && i.harga) || (F.jenis === "barter" && i.barter) || (F.jenis === "nego" && !i.harga && !i.barter)))
      .sort((a, b) => (a.status === "selesai") - (b.status === "selesai"));
    $("grid").innerHTML = l.length ? `<div class="grid">${l.map(i => `<div class="it" data-id="${i.id}">
      <div class="ph" style="${i.thumb ? `background-image:url('${i.thumb}')` : ""}">${i.thumb ? "" : "📦"}${i.status === "selesai" ? '<span class="sold">Sudah laku</span>' : ""}</div>
      <div class="bd"><h3>${esc(i.judul)}</h3>${tags(i)}<small>📍 ${esc(i.alamat || i.nama)} • ${lalu(i.created_at)}${i.kom ? ` • 💬 ${i.kom}` : ""}</small></div></div>`).join("")}</div>`
      : `<div class="empty">${CACHE.length ? "Barang tidak ditemukan." : "Belum ada iklan.<br>Jadilah yang pertama memasang barang!"}</div>`;
    document.querySelectorAll(".it").forEach(e => e.onclick = () => go("#/i/" + e.dataset.id));
  };
  $("q").oninput = e => { F.q = e.target.value; isi(); };
  document.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { F.jenis = b.dataset.j; document.querySelectorAll("[data-j]").forEach(x => x.classList.toggle("on", x === b)); isi(); });
  isi();
}

/* ---------- 2. DETAIL + KOMENTAR ---------- */
async function detail(id){
  const v = $("v"); v.innerHTML = '<div class="load">Memuat…</div>';
  const [r, me] = await Promise.all([api(`lapak_iklan?select=*&id=eq.${id}`), akun()]);
  const i = r && r[0]; if(!i || (i.status === "disembunyikan" && !(me && me.wa === i.wa))){ v.innerHTML = '<div class="empty">Iklan tidak ditemukan atau sudah dihapus.<br><br><a class="btn" href="#/">← Kembali ke lapak</a></div>'; return; }
  const pemilik = me && me.wa === i.wa, foto = Array.isArray(i.foto) ? i.foto.filter(Boolean) : [];
  v.innerHTML = `<a class="btn" href="#/" style="padding:7px 12px;font-size:13px">← Lapak</a>
    <div style="margin-top:10px"><div class="gal" id="gal">${foto.length ? foto.map((f, n) => `<img src="${f}" alt="Foto ${n + 1}" data-n="${n}">`).join("") : '<div class="noimg">📦</div>'}</div>
    ${foto.length > 1 ? `<div class="dots">${foto.map((_, n) => `<i class="${n ? "" : "on"}"></i>`).join("")}</div>` : ""}</div>
    <div class="card"><h2 class="d-title" style="margin-top:0">${esc(i.judul)}${i.status !== "aktif" ? ` <span class="st ${i.status}">${i.status === "selesai" ? "Sudah laku" : "Disembunyikan"}</span>` : ""}</h2>
      <div class="row"><span>Pemilik</span><b>${esc(i.nama)}${i.alamat ? " • " + esc(i.alamat) : ""}</b></div>
      <div class="row"><span>Kondisi</span><b>${esc(i.kondisi || "-")}</b></div>
      ${i.harga ? `<div class="row"><span>Harga</span><b><span class="tag j" style="margin:0">${rp(i.harga)}</span></b></div>` : ""}
      ${i.barter ? `<div class="row"><span>Barter dengan</span><b><span class="tag b" style="margin:0">🔁 ${esc(i.barter)}</span></b></div>` : ""}
      ${!i.harga && !i.barter ? `<div class="row"><span>Harga</span><b><span class="tag n" style="margin:0">Nego</span></b></div>` : ""}
      <div class="row"><span>Dipasang</span><b>${lalu(i.created_at)}</b></div>
      ${pemilik ? `<div class="own"><a class="btn" href="#/ubah/${i.id}">✏️ Ubah</a>${i.status === "aktif" ? `<button class="btn" id="bLaku">✅ Tandai sudah laku</button>` : `<button class="btn" id="bAktif">↩️ Aktifkan lagi</button>`}<button class="btn r" id="bHapus">🗑️ Hapus</button></div>` : ""}
      ${!pemilik ? `<p class="hint" style="margin-top:10px">💬 Tanya, tawar harga, atau tawarkan barang barter lewat komentar di bawah.</p>` : ""}
    </div>
    <div class="card" id="komBox"><div class="cmh"><b>💬 Komentar <span id="komJml"></span></b></div><div id="komList"><div class="load" style="padding:10px">Memuat komentar…</div></div>
      ${me ? `<div class="cbox"><textarea id="komIn" maxlength="500" placeholder="${pemilik ? "Balas pertanyaan pembeli…" : "Tulis komentar, tawaran harga, atau barang barter…"}"></textarea><button class="btn p" id="komKirim">Kirim</button></div>`
           : `<button class="btn full" id="komLogin" style="margin-top:10px">Masuk akun untuk berkomentar</button>`}</div>`;
  // galeri
  const gal = $("gal");
  if(gal && foto.length){
    gal.onscroll = () => { const n = Math.round(gal.scrollLeft / gal.clientWidth); document.querySelectorAll(".dots i").forEach((d, k) => d.classList.toggle("on", k === n)); };
    gal.querySelectorAll("img").forEach(im => im.onclick = () => { const lb = document.createElement("div"); lb.className = "lb"; lb.innerHTML = `<img src="${im.src}" alt=""><button aria-label="Tutup">✕</button>`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
  }
  // aksi pemilik
  const ubahStatus = async (st, pesan) => { try{ await api(`lapak_iklan?id=eq.${i.id}&wa=eq.${encodeURIComponent(me.wa)}`, {method:"PATCH", headers:{Prefer:"return=minimal"}, body:JSON.stringify({status:st, updated_at:new Date().toISOString()})}); CACHE = null; toast(pesan); render(); }catch(e){ toast("Gagal: " + String(e.message).slice(0, 80)); } };
  $("bLaku") && ($("bLaku").onclick = () => ubahStatus("selesai", "✅ Ditandai sudah laku"));
  $("bAktif") && ($("bAktif").onclick = () => ubahStatus("aktif", "Iklan aktif lagi"));
  $("bHapus") && ($("bHapus").onclick = async () => { if(!confirm("Hapus iklan ini beserta semua komentarnya?")) return;
    try{ await api(`lapak_iklan?id=eq.${i.id}&wa=eq.${encodeURIComponent(me.wa)}`, {method:"DELETE", headers:{Prefer:"return=minimal"}}); CACHE = null; toast("🗑️ Iklan dihapus"); go("#/saya"); }catch(e){ toast("Gagal menghapus"); } });
  $("komLogin") && ($("komLogin").onclick = () => keLogin("#/i/" + i.id));
  // komentar
  let jumlah = -1;
  const muatKom = async () => {
    let l; try{ l = await api(`lapak_komentar?select=*&iklan_id=eq.${i.id}&order=created_at.asc&limit=300`); }catch(e){ return; }
    if(!$("komList")) return;
    if(l.length === jumlah && jumlah >= 0){ document.querySelectorAll(".cm .tm").forEach((t, k) => { if(l[k]) t.textContent = lalu(l[k].created_at); }); return; }
    jumlah = l.length; $("komJml").textContent = l.length ? `(${l.length})` : "";
    $("komList").innerHTML = l.length ? l.map(k => { const ow = k.wa === i.wa, bisa = me && (me.wa === k.wa || pemilik);
      return `<div class="cm"><div class="av ${ow ? "ow" : ""}">${esc(inisial(k.nama))}</div><div><div class="nm">${esc(k.nama || "Warga")}${ow ? "<em>Pemilik</em>" : ""}<span class="tm">${lalu(k.created_at)}</span></div><p>${esc(k.isi)}</p>${bisa ? `<button class="del" data-del="${k.id}">Hapus</button>` : ""}</div></div>`; }).join("")
      : '<p class="hint" style="margin:4px 0 2px">Belum ada komentar. Jadilah yang pertama bertanya!</p>';
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if(!confirm("Hapus komentar ini?")) return;
      try{ await api(`lapak_komentar?id=eq.${b.dataset.del}`, {method:"DELETE", headers:{Prefer:"return=minimal"}}); jumlah = -1; muatKom(); }catch(e){ toast("Gagal menghapus komentar"); } });
  };
  await muatKom(); pollKom = setInterval(muatKom, 15000);
  const kirim = $("komKirim");
  if(kirim) kirim.onclick = async () => {
    const isi = $("komIn").value.trim(); if(!isi) return toast("Tulis komentar dulu");
    const t = Number(sessionStorage.getItem("lapak_kom_t") || 0); if(Date.now() - t < 8000) return toast("Tunggu sebentar sebelum berkomentar lagi");
    kirim.disabled = true;
    try{ await api("lapak_komentar", {method:"POST", headers:{Prefer:"return=minimal"}, body:JSON.stringify([{iklan_id:i.id, wa:me.wa, nama:me.nama, isi:isi.slice(0, 500)}])});
      sessionStorage.setItem("lapak_kom_t", Date.now()); $("komIn").value = ""; jumlah = -1; CACHE = null; await muatKom();
      const lst = $("komList").lastElementChild; lst && lst.scrollIntoView({behavior:"smooth", block:"center"}); }
    catch(e){ toast("Gagal mengirim: " + String(e.message).slice(0, 80)); }
    kirim.disabled = false;
  };
}

/* ---------- 3. PASANG / UBAH IKLAN (isian sama dengan detail) ---------- */
async function formIklan(id){
  const v = $("v"), me = await akun();
  if(!me){ v.innerHTML = `<div class="empty">🔒 Masuk dengan akun pembeli Kalensari Store untuk memasang iklan.<br><br><button class="btn p" id="bMasuk">Masuk / Daftar</button><br><br><a class="btn" href="#/">← Kembali ke lapak</a></div>`; $("bMasuk").onclick = () => keLogin(id ? "#/ubah/" + id : "#/pasang"); return; }
  let lama = null;
  if(id){ const r = await api(`lapak_iklan?select=*&id=eq.${id}&wa=eq.${encodeURIComponent(me.wa)}`); lama = r && r[0]; if(!lama){ v.innerHTML = '<div class="empty">Iklan tidak ditemukan.<br><br><a class="btn" href="#/saya">← Iklan saya</a></div>'; return; } }
  const foto = lama && Array.isArray(lama.foto) ? lama.foto.slice(0, 3) : [];
  v.innerHTML = `<a class="btn" href="${id ? "#/i/" + id : "#/"}" style="padding:7px 12px;font-size:13px">← Batal</a>
    <div class="card f"><h2 style="margin:0 0 4px;font-size:19px">${id ? "✏️ Ubah iklan" : "📢 Pasang iklan"}</h2>
      <label>Foto <small>(1–3 foto, foto pertama jadi foto utama)</small></label>
      <div class="fotos" id="fotos"></div><input type="file" id="fIn" accept="image/*" multiple hidden>
      <label>Nama pemilik</label><div class="ro">${esc(me.nama)}${me.alamat ? " • " + esc(me.alamat) : ""}<small>Otomatis dari akun pembeli Anda</small></div>
      <label>Nama produk</label><input id="fJudul" maxlength="80" placeholder="Contoh: Sepeda anak 16 inci" value="${esc(lama ? lama.judul : "")}">
      <label>Kondisi</label><input id="fKondisi" maxlength="80" list="kondisiList" placeholder="Contoh: Bekas, masih bagus" value="${esc(lama ? lama.kondisi : "")}">
      <datalist id="kondisiList"><option>Baru</option><option>Bekas, seperti baru</option><option>Bekas, masih bagus</option><option>Bekas, perlu perbaikan</option></datalist>
      <label>Harga <small>(opsional)</small></label><div class="rp"><span>Rp</span><input id="fHarga" inputmode="numeric" placeholder="250.000" value="${lama && lama.harga ? Number(lama.harga).toLocaleString("id-ID") : ""}"></div>
      <label>Mau barter dengan <small>(opsional)</small></label><input id="fBarter" maxlength="120" placeholder="Contoh: HP bekas / kambing / beras 10 kg" value="${esc(lama && lama.barter ? lama.barter : "")}">
      <p class="hint">Isi harga, barter, atau keduanya. Jika keduanya kosong, iklan tampil sebagai <b>Nego</b>.</p>
      <div class="err" id="fErr"></div>
      <button class="btn p full" id="fKirim">${id ? "💾 Simpan perubahan" : "📢 Tayangkan iklan"}</button></div>`;
  const gambarFoto = () => {
    $("fotos").innerHTML = [0, 1, 2].map(n => foto[n] ? `<div class="fs has" style="background-image:url('${foto[n]}')">${n === 0 ? '<span class="utama">Utama</span>' : ""}<button class="x" data-x="${n}" type="button" aria-label="Hapus foto">✕</button></div>`
      : `<div class="fs" data-add="1"><b>📷</b>${n === foto.length ? "Tambah foto" : ""}</div>`).join("");
    document.querySelectorAll("[data-x]").forEach(b => b.onclick = e => { e.stopPropagation(); foto.splice(+b.dataset.x, 1); gambarFoto(); });
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => $("fIn").click());
  };
  gambarFoto();
  $("fIn").onchange = async e => { const files = [...e.target.files].slice(0, 3 - foto.length); e.target.value = "";
    for(const f of files){ try{ foto.push(await kecilkan(f, 900, .74)); }catch(x){ toast(x.message); } } gambarFoto(); };
  $("fHarga").oninput = e => { const d = e.target.value.replace(/\D/g, "").slice(0, 10); e.target.value = d ? Number(d).toLocaleString("id-ID") : ""; };
  $("fKirim").onclick = async () => {
    const judul = $("fJudul").value.replace(/\s+/g, " ").trim(), kondisi = $("fKondisi").value.trim(), harga = Number($("fHarga").value.replace(/\D/g, "")) || null, barter = $("fBarter").value.trim() || null, err = $("fErr");
    if(!foto.length) return err.textContent = "Tambahkan minimal 1 foto.";
    if(judul.length < 2) return err.textContent = "Isi nama produk.";
    if(!kondisi) return err.textContent = "Isi kondisi barang.";
    err.textContent = ""; const b = $("fKirim"); b.disabled = true; b.textContent = "Menyimpan…";
    try{
      const data = {judul, kondisi, harga, barter, foto, thumb:await kotak(foto[0], 320), nama:me.nama, alamat:me.alamat, updated_at:new Date().toISOString()};
      let baru;
      if(id){ await api(`lapak_iklan?id=eq.${id}&wa=eq.${encodeURIComponent(me.wa)}`, {method:"PATCH", headers:{Prefer:"return=minimal"}, body:JSON.stringify(data)}); baru = id; }
      else { const r = await api("lapak_iklan", {method:"POST", body:JSON.stringify([{...data, wa:me.wa, status:"aktif"}])}); baru = r && r[0] && r[0].id; }
      CACHE = null; toast(id ? "💾 Iklan diperbarui" : "📢 Iklan tayang!"); go(baru ? "#/i/" + baru : "#/");
    }catch(e){ err.textContent = "Gagal menyimpan: " + String(e.message).slice(0, 120); b.disabled = false; b.textContent = id ? "💾 Simpan perubahan" : "📢 Tayangkan iklan"; }
  };
}

/* ---------- 4. IKLAN SAYA ---------- */
async function iklanSaya(){
  const v = $("v"), me = await akun();
  if(!me){ v.innerHTML = `<div class="empty">🔒 Masuk dengan akun pembeli untuk melihat iklan Anda.<br><br><button class="btn p" id="bMasuk">Masuk / Daftar</button></div>`; $("bMasuk").onclick = () => keLogin("#/saya"); return; }
  v.innerHTML = '<div class="load">Memuat…</div>';
  const l = await api(`lapak_iklan?select=id,created_at,judul,harga,barter,thumb,status&wa=eq.${encodeURIComponent(me.wa)}&order=created_at.desc`);
  const nm = {aktif:"Tayang", selesai:"Sudah laku", disembunyikan:"Disembunyikan admin"};
  v.innerHTML = `<a class="btn" href="#/" style="padding:7px 12px;font-size:13px">← Lapak</a>
    <div class="card"><h2 style="margin:0 0 4px;font-size:19px">📋 Iklan saya</h2><p class="hint" style="margin:0 0 6px">${esc(me.nama)} • ${l.length} iklan</p>
    ${l.length ? l.map(i => `<div class="mine"><div class="ph" style="${i.thumb ? `background-image:url('${i.thumb}')` : ""}">${i.thumb ? "" : "📦"}</div>
      <div><h4>${esc(i.judul)}<span class="st ${i.status}">${nm[i.status] || i.status}</span></h4><small>${i.harga ? rp(i.harga) : ""}${i.harga && i.barter ? " • " : ""}${i.barter ? "Barter" : ""}${!i.harga && !i.barter ? "Nego" : ""} • ${lalu(i.created_at)}</small>
      <div class="acts"><a class="btn" href="#/i/${i.id}">Lihat</a><a class="btn" href="#/ubah/${i.id}">Ubah</a></div></div></div>`).join("")
      : '<p class="hint">Anda belum memasang iklan.</p>'}
    <button class="btn p full" style="margin-top:12px" onclick="go('#/pasang')">+ Pasang iklan baru</button></div>`;
}

render();
</script>
</body>
</html>
