<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS2 V9 - Input & Dynamic Logo Clear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>KS2 V9 Search Bar</h2>
        <p>Ketik sesuatu pada kolom di bawah ini untuk melihat perubahan logo menjadi tombol "X". Tekan tombol "X" untuk me-reset kembali ke semula.</p>
        
        <div class="input-group">
            <input type="text" id="customInput" placeholder="Ketik sesuatu di sini..." autocomplete="off">
            <button id="actionBtn" class="icon-btn" aria-label="Search or Clear">
                <!-- Search Icon (Default) -->
                <svg id="searchIcon" class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <!-- Clear (X) Icon -->
                <svg id="clearIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
