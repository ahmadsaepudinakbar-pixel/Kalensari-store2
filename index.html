<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalensari Store - Search Component (KS2 V9)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Kalensari Store</h2>
        <p>Cari produk makanan atau minuman pilihan Anda.</p>
        
        <div class="input-group">
            <input type="text" id="search-input" placeholder="Cari makanan..." autocomplete="off">
            <button id="actionBtn" class="icon-btn" aria-label="Aksi Pencarian">
                <!-- Search Icon (Default) -->
                <svg id="searchIcon" class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <!-- Clear (X) Icon -->
                <svg id="clearIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Product Grid Placeholder for Testing -->
    <div class="product-section" style="margin-top: 30px; display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));">
        <div class="product-card" style="padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff;">
            <h3>Nasi Goreng Special</h3>
            <p style="color: #888;">Makanan</p>
        </div>
        <div class="product-card" style="padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff;">
            <h3>Mie Ayam Bakso</h3>
            <p style="color: #888;">Makanan</p>
        </div>
        <div class="product-card" style="padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff;">
            <h3>Es Teh Manis</h3>
            <p style="color: #888;">Minuman</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
