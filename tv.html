<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Kalensari TV: drama China, drama Indo, dan movie pilihan.">
<title>Kalensari TV</title>
<meta name="theme-color" content="#fbf8f4" id="metaTema">
<script>
(function(){var t;try{t=localStorage.getItem('kalensari_tv_tema')}catch(e){}
if(t!=='terang'&&t!=='gelap')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'gelap':'terang';
document.documentElement.setAttribute('data-tema',t);
var m=document.getElementById('metaTema');if(m)m.setAttribute('content',t==='gelap'?'#000000':'#fbf8f4')})();
</script>
<style>
:root{
  --bg:#fbf8f4;
  --card:#ffffff;
  --ink:#13203f;
  --mut:#6b7590;
  --sub:#6b7590;
  --line:#ece4da;
  --chip:#ffffff;
  --input:#ffffff;
  --accent:#ff4d4d;
  --grad:linear-gradient(90deg,#ff3d3d 0%,#ff6a2b 100%);
  --grad-btn:linear-gradient(90deg,#ff2d6f 0%,#ff6a3a 100%);
  --glow:0 6px 18px rgba(255,80,60,.28);
  --shadow:0 6px 22px rgba(60,40,20,.08);
  --accent-soft:#ffe9e3;
  --stage:#10141f;
  --red:#d92c2c;
  --red-soft:#fde8e8;
  --tv:#ff7a1a;
  --blob:radial-gradient(circle at 100% 0%,rgba(255,170,90,.42),rgba(255,170,90,0) 68%);
  --w1a:#ffb347;--w1b:#ff5e62;--w2a:#ff8a5c;--w2b:#ff3d7f;
  --r:20px;
  color-scheme:light;
}
html[data-tema="gelap"]{
  --bg:#000000;
  --card:#0d0d0d;
  --ink:#f4f6ff;
  --mut:#9a9a9a;
  --sub:#a8a8a8;
  --line:#232323;
  --chip:#141414;
  --input:#0a0a0a;
  --accent:#ff4f86;
  --grad:linear-gradient(90deg,#ff2d75 0%,#ff7a1a 100%);
  --grad-btn:linear-gradient(90deg,#ff2d75 0%,#ff7a2e 100%);
  --glow:0 6px 22px rgba(255,60,110,.35);
  --shadow:0 8px 26px rgba(0,0,0,.35);
  --accent-soft:#241519;
  --stage:#000000;
  --red:#ff6b6b;
  --red-soft:#2a1216;
  --tv:#ff9a1f;
  --blob:radial-gradient(circle at 100% 0%,rgba(255,255,255,.07),rgba(255,255,255,0) 68%);
  --w1a:#3a3a3a;--w1b:#d1307d;--w2a:#ff7a1a;--w2b:#ff2d75;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;position:relative;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI","Trebuchet MS",system-ui,-apple-system,Arial,sans-serif;line-height:1.45;min-height:100vh;transition:background .25s,color .25s}
body::before{content:"";position:absolute;top:0;right:0;width:100%;max-width:460px;height:380px;background:var(--blob);pointer-events:none;z-index:0}
.top,main,footer{position:relative;z-index:1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f2a93b;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:min(100% - 32px,1000px);margin:0 auto}

/* ---------- bilah atas ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:8px;padding:14px 0 8px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;flex:1 1 auto;text-decoration:none;color:inherit;min-width:0}
.brand-mark{width:42px;height:42px;flex:0 0 auto;display:block}
@media(min-width:520px){.brand-mark{width:50px;height:50px}.brand{gap:12px}}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:clamp(1.25rem,5.2vw,2.2rem);font-weight:800;letter-spacing:-.5px;line-height:1.05;white-space:nowrap}
.brand b i{font-style:normal;color:var(--tv)}
.brand small{font-size:clamp(.7rem,2.9vw,.9rem);color:var(--sub);letter-spacing:.2px;white-space:nowrap}
.icon-btn{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;text-decoration:none;box-shadow:var(--shadow);color:var(--ink)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.sm{width:36px;height:36px;box-shadow:none}
.icon-btn.sm svg{width:18px;height:18px}
.ic-sun{display:none}
html[data-tema="gelap"] .ic-sun{display:block}
html[data-tema="gelap"] .ic-moon{display:none}
.top .cari{display:none;padding:0 0 10px}
.top .cari.on{display:block}
.cari input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--input);font-size:16px}

/* ---------- chip kategori ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);box-shadow:var(--shadow);font-size:.6rem;font-weight:600;white-space:nowrap}
.chip svg{width:13px;height:13px;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}

/* ---------- sorotan utama ---------- */
.stage{margin-top:12px}
.hero{position:relative;display:block;width:100%;aspect-ratio:2/1;min-height:230px;border-radius:var(--r);overflow:hidden;background:var(--stage);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);padding:0;text-align:left;color:#fff}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.62) 42%,rgba(0,0,0,.08) 78%),linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 45%)}
.hero-body{position:absolute;z-index:1;left:0;top:0;bottom:0;width:68%;padding:clamp(16px,4.5vw,32px);display:flex;flex-direction:column;justify-content:center;gap:8px}
.hero h1{margin:0;font-size:clamp(1.5rem,7.4vw,2.8rem);font-weight:800;line-height:1.08;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero-sub{margin:0;font-size:clamp(.85rem,3.6vw,1.15rem);color:rgba(255,255,255,.9)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);font-size:.85rem;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill svg{width:16px;height:16px}
.pill.baru{background:#e5262f;border-color:transparent}
.btn-tonton{white-space:nowrap;align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:clamp(7px,2.1vw,11px) clamp(13px,3.5vw,27px);border-radius:999px;background:var(--grad-btn);box-shadow:0 8px 22px rgba(255,60,90,.4);font-weight:700;font-size:clamp(.72rem,2.8vw,.92rem);color:#fff}
.btn-tonton svg{width:16px;height:16px;fill:#fff}
.hero:hover .btn-tonton{filter:brightness(1.08)}
.dots{position:absolute;z-index:2;right:16px;bottom:14px;display:flex;gap:7px;padding:6px 8px;border-radius:999px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.dot{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.55)}
.dot.on{width:24px;border-radius:6px;background:linear-gradient(90deg,#ff2d6f,#ff8a2b)}

/* ---------- pemutar (setelah ditekan) ---------- */
.player{position:relative;aspect-ratio:16/9;background:var(--stage);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.judul{margin:14px 4px 0;font-size:1.2rem;font-weight:800;line-height:1.3}
.meta{margin:2px 4px 0;font-size:.9rem;color:var(--mut)}
.kosong{padding:34px 16px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);margin-top:14px}
.kosong b{display:block;color:var(--ink);margin-bottom:2px}

/* ---------- video lainnya ---------- */
.lain-head{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}
.lain-head h2{margin:0;font-size:clamp(1.3rem,5.4vw,1.7rem);font-weight:800;display:flex;align-items:center;gap:10px}
.lain-head h2 svg{width:30px;height:30px;color:#ff3d5e}
.lihat{background:none;border:0;padding:6px 0;display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-weight:600;font-size:.95rem}
.lihat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lihat[hidden]{display:none}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:2px 0 8px}
@media(min-width:700px){.row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:940px){.row{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.thumb{display:block;position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--stage)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.item:hover .thumb img{transform:scale(1.04)}
.thumb .mini{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.22);opacity:0;transition:opacity .15s}
.item:hover .mini,.item:focus-visible .mini{opacity:1}
.mini svg{width:30px;height:30px;fill:#fff}
.kat-badge{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);padding:3px 11px;border-radius:999px;color:#fff;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.thumb .sisa{position:absolute;right:6px;bottom:6px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.36rem;font-weight:600;padding:1px 5px;border-radius:999px;background:rgba(20,20,30,.72);color:#ffd54a}
.item .tx{display:block;padding:10px 12px 12px}
.item .jd{margin:0;font-size:.95rem;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item small{display:block;margin:4px 0 0;font-size:.82rem;color:var(--mut)}
.item.now{border-color:var(--accent)}

/* ---------- masa tayang akan habis (slide) ---------- */
.soon .lain-head{gap:10px}
.soon .lain-head h2{font-size:clamp(1.05rem,4.6vw,1.4rem);min-width:0}
.soon .lain-head h2 svg{width:26px;height:26px;flex:0 0 auto}
.geser{display:flex;gap:8px;flex:0 0 auto}
.geser[hidden]{display:none}
.slider{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.slider::-webkit-scrollbar{display:none}
.slider .item{display:block;flex:0 0 min(72%,270px);scroll-snap-align:start}
.sisa2{position:absolute;right:8px;bottom:8px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(20,20,30,.78);color:#ffd54a}
.sisa2.dekat{background:#e5262f;color:#fff}
.soon{margin-top:8px}

/* ---------- panel kelola ---------- */
.panel{margin:26px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel[hidden]{display:none}
.panel,.stage{scroll-margin-top:90px}
.panel h2{margin:0 0 12px;font-size:1.05rem}
.panel h3{margin:20px 0 8px;font-size:.95rem}
.panel label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
.panel input[type=text],.panel input[type=email],.panel input[type=password],.panel select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--input);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.cek{display:flex!important;align-items:center;gap:8px;color:var(--ink)!important;font-size:.92rem!important;margin:12px 0!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;border:0;background:var(--grad-btn);color:#fff;font-weight:700}
.btn.full{width:100%}
.btn.ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.pesan{margin:10px 0 0;font-size:.88rem;min-height:1.2em}
.pesan.err{color:var(--red)}
.pesan.ok{color:#1f9d63}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.panel-top h2{margin:0}
.link{background:none;border:0;padding:6px 2px;color:var(--mut);text-decoration:underline;font-size:.9rem}
.kat-list{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;padding:0;list-style:none}
.kat-list li{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--accent-soft);font-size:.9rem}
.kat-list button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--red);font-size:1.1rem;line-height:1}
.kat-list button:hover{background:var(--red-soft)}
.kat-add{display:flex;gap:8px}
.kat-add input{flex:1}
.adm{margin:0;padding:0;list-style:none}
.adm li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.adm img{width:62px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--stage);flex:0 0 auto}
.adm .tx{flex:1;min-width:0}
.adm .tx b{display:block;font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm .tx small{color:var(--mut);font-size:.76rem}
.adm .tx small.habis{color:var(--red);font-weight:600}
.adm button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--input);display:grid;place-items:center;flex:0 0 auto}
.adm button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adm .pin.on{background:#fff3d6;border-color:#f2c46b;color:#9a6200}
.adm .del{color:var(--red)}
.adm .del:hover{background:var(--red-soft)}

/* ---------- HP miring (landscape): pemutar kiri, daftar video kanan ---------- */
@media (orientation:landscape) and (max-height:520px){
  .top{position:static}
  .top .wrap{padding:8px 0 4px}
  .brand-mark{width:38px;height:38px}
  .brand small{display:none}
  .wrap{width:min(100% - 24px,1100px)}
  main.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,38%);column-gap:16px;align-items:start}
  .chips{grid-column:1/-1;padding:6px 2px 4px}
  .stage{grid-column:1;grid-row:2;margin-top:6px}
  .hero{aspect-ratio:auto;min-height:0;height:calc(100vh - 150px)}
  .player{width:min(100%,calc((100vh - 150px)*16/9))}
  .judul{font-size:1rem;margin-top:8px}
  #lain{grid-column:2;grid-row:2}
  #soon{grid-column:1/-1}
  .lain-head{margin:6px 2px 8px}
  .row{grid-template-columns:1fr;overflow-y:auto;max-height:calc(100vh - 140px);gap:10px;padding:2px 4px 8px 2px}
  .item{display:grid;grid-template-columns:44% 1fr;align-items:start}
  .item .tx{padding:8px 10px}
  .panel{grid-column:1/-1}
  .kosong{grid-column:1/-1}
}

/* ---------- tombol & mode layar miring ---------- */
.btn-miring{display:inline-flex;align-items:center;gap:8px;margin:12px 4px 0;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:.9rem;font-weight:600;box-shadow:var(--shadow)}
.btn-miring svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info-miring{display:none;position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));width:max-content;max-width:min(88%,520px);align-items:center;gap:10px;padding:10px 8px 10px 18px;border-radius:999px;background:rgba(232,238,248,.96);color:#1d2330;font-size:.85rem;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.info-miring.tampil{display:flex}
.info-miring button{width:30px;height:30px;flex:0 0 auto;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.1);color:#1d2330;font-size:1.3rem;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.player:fullscreen{border-radius:0;aspect-ratio:auto;width:100%;height:100%;background:#000}
.player:-webkit-full-screen{border-radius:0;aspect-ratio:auto;width:100%;height:100%;background:#000}
/* cadangan bila browser tidak mendukung layar penuh: putar tampilan lewat CSS */
.player.miring-css{position:fixed;z-index:1000;border-radius:0;aspect-ratio:auto;background:#000;top:0;left:0;width:100vw;height:100vh;width:100dvw;height:100dvh}
@media (orientation:portrait){
  .player.miring-css{width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
}
body.kunci-miring{overflow:hidden}

/* ---------- kaki halaman ---------- */
footer{padding:34px 0 120px;text-align:center;font-size:.92rem;color:var(--mut)}
.foot{display:flex;align-items:center;justify-content:center;gap:14px}
.foot::before,.foot::after{content:"";height:1px;width:clamp(30px,14vw,110px);background:var(--line)}
.foot i{width:1px;height:20px;background:var(--line)}
footer a,footer button{color:var(--mut)}
.wave{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:0;pointer-events:none}
.wave svg{display:block;width:100%;height:100%}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="icon-btn sm" href="index.html" aria-label="Kembali ke toko"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="brand" href="tv.html" aria-label="Kalensari TV, kembali ke awal">
      <svg class="brand-mark" viewBox="0 0 56 56" aria-hidden="true">
        <path d="M20 12 28 4 36 12" stroke="#ff7a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="28" cy="4" r="2.4" fill="#ff7a1a"/>
        <path d="M17 48 14 54M39 48 42 54" stroke="#ff7a1a" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="4" y="12" width="48" height="36" rx="10" fill="#13203f" stroke="#ff7a1a" stroke-width="1.5"/>
        <path transform="translate(0,-2)" d="M23 24.5v15a1.6 1.6 0 0 0 2.4 1.4l12.6-7.5a1.6 1.6 0 0 0 0-2.8l-12.6-7.5a1.6 1.6 0 0 0-2.4 1.4z" fill="#ff7a1a"/>
      </svg>
      <span class="brand-txt"><b>Kalensari <i>TV</i></b><small>Film &bull; Drama &bull; Hiburan</small></span>
    </a>
    <button class="icon-btn" id="btnTema" type="button" aria-label="Ganti ke mode gelap" aria-pressed="false">
      <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="btnCari" type="button" aria-label="Cari video" aria-expanded="false" aria-controls="boxCari">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </div>
  <div class="wrap cari" id="boxCari">
    <label class="sr" for="inCari">Cari judul video</label>
    <input id="inCari" type="search" placeholder="Cari judul video" autocomplete="off">
  </div>
</header>

<main class="wrap">
  <div class="chips" id="chips" role="group" aria-label="Kategori"></div>

  <section class="stage" id="stage" aria-live="polite"></section>

  <div id="lain" hidden>
    <div class="lain-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.5 10h17v10a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 20z"/><path fill="currentColor" d="M3.2 6.3 18.6 2.2l.9 3.2L4.1 9.5zM10 4.6l2.2 2.4M14.8 3.4l2.2 2.4" stroke="#fff" stroke-width=".6"/><rect x="7" y="13" width="6" height="2.4" rx="1" fill="#fff" opacity=".85"/></svg>Video lainnya</h2><button class="lihat" id="btnLihat" type="button" hidden><span>Lihat Semua</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="row" id="row"></div>
  </div>

  <div id="soon" class="soon" hidden>
    <div class="lain-head"><h2><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Masa tayang akan habis</h2>
      <div class="geser" id="soonNav"><button class="icon-btn sm" id="soonPrev" type="button" aria-label="Geser ke kiri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button class="icon-btn sm" id="soonNext" type="button" aria-label="Geser ke kanan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    </div>
    <div class="slider" id="slider" role="group" aria-label="Video yang masa tayangnya akan habis"></div>
  </div>

  <!-- ===== Panel kelola (hanya tampil setelah admin masuk) ===== -->
  <section class="panel" id="panel" hidden aria-label="Kelola video">
    <!-- masuk admin -->
    <div id="boxMasuk">
      <h2>Masuk sebagai admin</h2>
      <p style="margin:0 0 4px;color:var(--mut);font-size:.9rem">Pakai email dan kata sandi admin yang sama dengan halaman admin toko.</p>
      <label for="lEmail">Email</label>
      <input id="lEmail" type="email" autocomplete="username">
      <label for="lPass">Kata sandi</label>
      <input id="lPass" type="password" autocomplete="current-password">
      <div style="margin-top:14px"><button class="btn full" id="btnMasuk" type="button">Masuk</button></div>
      <p class="pesan" id="pesanMasuk" role="status"></p>
    </div>

    <!-- kelola -->
    <div id="boxKelola" hidden>
      <div class="panel-top">
        <h2>Tambah video</h2>
        <button class="link" id="btnKeluar" type="button">Keluar</button>
      </div>

      <label for="fLink">Link YouTube atau Facebook</label>
      <input id="fLink" type="text" inputmode="url" placeholder="https://youtu.be/... atau https://www.facebook.com/..." autocomplete="off">
      <div class="grid2">
        <div><label for="fKat">Kategori</label><select id="fKat"></select></div>
        <div><label for="fMasa">Masa tayang</label>
          <select id="fMasa">
            <option value="0">Tanpa batas</option>
            <option value="1">1 hari</option>
            <option value="3">3 hari</option>
            <option value="7">7 hari</option>
            <option value="10">10 hari</option>
            <option value="14">14 hari</option>
            <option value="30">30 hari</option>
          </select>
        </div>
      </div>
      <label for="fJudul">Judul</label>
      <input id="fJudul" type="text" maxlength="120" autocomplete="off" placeholder="Contoh: Drama China episode 1">
      <label class="cek"><input type="checkbox" id="fPin"> Jadikan video utama (disematkan)</label>
      <button class="btn full" id="btnTambah" type="button">Tambah video</button>
      <p class="pesan" id="pesanTambah" role="status"></p>

      <h3>Kategori</h3>
      <ul class="kat-list" id="katList"></ul>
      <div class="kat-add">
        <label class="sr" for="fKatBaru">Nama kategori baru</label>
        <input id="fKatBaru" type="text" maxlength="30" placeholder="Nama kategori baru" autocomplete="off">
        <button class="btn ghost" id="btnKatTambah" type="button">Tambah</button>
      </div>
      <p class="pesan" id="pesanKat" role="status"></p>

      <h3>Video aktif <span id="jml" style="color:var(--mut);font-weight:400"></span></h3>
      <ul class="adm" id="adm"></ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">&copy; Kalensari TV <i aria-hidden="true"></i> <button class="link" id="btnKelola" type="button">Kelola video</button></div>
</footer>
<div class="wave" aria-hidden="true">
  <svg viewBox="0 0 1024 120" preserveAspectRatio="none">
    <defs>
      <linearGradient id="w1" x1="0" x2="1"><stop offset="0" style="stop-color:var(--w1a)"/><stop offset="1" style="stop-color:var(--w1b)"/></linearGradient>
      <linearGradient id="w2" x1="0" x2="1"><stop offset="0" style="stop-color:var(--w2a)"/><stop offset="1" style="stop-color:var(--w2b)"/></linearGradient>
    </defs>
    <path d="M0 48C120 28 260 62 430 120H0z" fill="url(#w1)"/>
    <path d="M1024 14C930 30 820 78 650 120H1024z" fill="url(#w2)"/>
  </svg>
</div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
/* =====================================================================
   KALENSARI TV
   Data di Supabase (tabel tv_video & tv_kategori, lihat supabase-tv.sql).
   Login admin memakai sesi yang sama dengan admin.html.
   ===================================================================== */
var CFG=window.CLOUD_CONFIG||{};
var BASE=String(CFG.supabaseUrl||'').replace(/\/$/,'');
var KEY=CFG.supabaseAnonKey||'';
var AUTH_KEY='kalensari_admin_auth';
var $=function(s){return document.querySelector(s)};

var auth=null;
try{auth=JSON.parse(sessionStorage.getItem(AUTH_KEY)||'null')}catch(e){}
var saveAuth=function(a){auth=a;try{a?sessionStorage.setItem(AUTH_KEY,JSON.stringify(a)):sessionStorage.removeItem(AUTH_KEY)}catch(e){}};

var S={kat:[],vid:[],filter:'Semua',cur:null,q:'',err:'',tabelBelum:false,semua:false};

/* ---------- util ---------- */
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ytId(s){
  s=String(s||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s))return s;
  var m=s.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:'';
}
var FB_RE=/^https?:\/\/(?:[a-z0-9-]+\.)?(?:facebook\.com|fb\.com|fb\.watch)\/\S+$/i;
function sumberId(s){
  s=String(s||'').trim();
  var y=ytId(s);if(y)return y;
  return FB_RE.test(s)?'fb:'+s:'';
}
function isFb(id){return String(id||'').indexOf('fb:')===0}
var FB_COVER='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a5a"/><stop offset="1" stop-color="#0d1530"/></linearGradient></defs><rect width="640" height="400" fill="url(#g)"/><circle cx="320" cy="180" r="62" fill="#ff7a1a"/><path d="M302 148v64l54-32z" fill="#fff"/><text x="320" y="300" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">Video Facebook</text></svg>');
function embedUrl(id){
  if(isFb(id))return 'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(id.slice(3))+'&show_text=false&autoplay=true';
  return 'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';
}
function thumb(id){return isFb(id)?FB_COVER:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'}
function tgl(v){return new Date(v).getTime()}
function habis(v){return v.tayang_sampai&&tgl(v.tayang_sampai)<=Date.now()}
function sisa(v){
  if(!v.tayang_sampai)return '';
  var ms=tgl(v.tayang_sampai)-Date.now();
  if(ms<=0)return 'Sudah habis';
  var h=Math.ceil(ms/36e5);
  return h<24?'Tayang '+h+' jam lagi':'Tayang '+Math.ceil(h/24)+' hari lagi';
}
function umur(v){
  var d=Math.floor((Date.now()-tgl(v.created_at))/864e5);
  return d<=0?'ditambahkan hari ini':d===1?'ditambahkan kemarin':'ditambahkan '+d+' hari lalu';
}
function baru(v){return Date.now()-tgl(v.created_at)<2*864e5}
var IC_MIRING='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 12h.01M18 12h.01"/></svg>';
var IC_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';

/* ---------- API ---------- */
async function authReq(grant,body){
  var r=await fetch(BASE+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var d=await r.json().catch(function(){return{}});
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),email:(d.user&&d.user.email)||''};
}
async function fresh(){
  if(!auth||!auth.refresh_token)return false;
  if(auth.expires_at*1000-Date.now()>60000)return true;
  try{var a=await authReq('refresh_token',{refresh_token:auth.refresh_token});a.email=auth.email;saveAuth(a);return true}
  catch(e){saveAuth(null);return false}
}
async function rest(path,opt){
  opt=opt||{};
  var tok=auth?auth.access_token:KEY;
  var h=Object.assign({apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},opt.headers||{});
  var r=await fetch(BASE+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));
  if(!r.ok){
    var m='';try{var j=await r.json();m=j.message||j.hint||''}catch(e){}
    var err=new Error(m||('HTTP '+r.status));err.status=r.status;throw err;
  }
  return r.status===204?null:r.json().catch(function(){return null});
}

/* ---------- muat data ---------- */
async function muat(){
  S.err='';S.tabelBelum=false;
  if(!BASE||!KEY){S.err='config.js belum berisi data Supabase.';render();return}
  await fresh();
  try{
    var r=await Promise.all([
      rest('tv_kategori?select=*&order=urutan.asc,id.asc'),
      rest('tv_video?select=*&order=sematkan.desc,created_at.desc')
    ]);
    S.kat=r[0]||[];S.vid=r[1]||[];
  }catch(e){
    S.kat=[];S.vid=[];
    if(/tv_video|tv_kategori|PGRST205|does not exist/i.test(e.message)||e.status===404){S.tabelBelum=true}
    S.err=e.message;
  }
  render();
}
function aktif(){return S.vid.filter(function(v){return !habis(v)})}
function tersaring(){
  var q=S.q.trim().toLowerCase();
  return aktif().filter(function(v){
    return (S.filter==='Semua'||v.kategori===S.filter)&&(!q||v.judul.toLowerCase().indexOf(q)>-1);
  });
}

/* ---------- musik latar toko: jeda saat video diputar, lanjut saat halaman ditutup ---------- */
var musikDijeda=null;
function jedaMusik(){
  try{
    var a=window.parent!==window&&window.parent.document.getElementById('bgMusic');
    if(a&&!a.paused){a.pause();musikDijeda=a}
  }catch(e){}
}
addEventListener('pagehide',function(){
  try{
    var off=localStorage.getItem('kalensari_music_off')==='1';
    if(musikDijeda&&!off)musikDijeda.play().catch(function(){});
  }catch(e){}
});

/* ---------- tampilan pengunjung ---------- */
function render(){renderChips();renderStage();renderRow();renderSoon();if(isAdmin())renderPanel()}

/* ikon & warna kategori */
var IK={
  home:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8 2.6 10.6a1 1 0 0 0 .6 1.8H5V20a1.5 1.5 0 0 0 1.5 1.5H9.5V15h5v6.5h3A1.5 1.5 0 0 0 19 20v-7.6h1.8a1 1 0 0 0 .6-1.8z"/></svg>',
  clap:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 10h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path fill="currentColor" d="M3.4 5.6 18.8 2l1 3.8L4.4 9.4z"/><path stroke="currentColor" stroke-width="2" d="M8 3.6l2.4 4.4M13 2.6l2.4 4.4"/></svg>',
  reel:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><g fill="#fff" class="reel-h" style="fill:var(--chip)"><circle cx="12" cy="6.6" r="2"/><circle cx="12" cy="17.4" r="2"/><circle cx="6.6" cy="12" r="2"/><circle cx="17.4" cy="12" r="2"/><circle cx="12" cy="12" r="1.4"/></g></svg>',
  star:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path fill="#fff" style="fill:var(--chip)" d="M10 8v8l6.5-4z"/></svg>'
};
function katIcon(n){
  n=String(n||'').toLowerCase();
  if(n==='semua')return IK.home;
  if(/china|korea|asia|anime|kartun/.test(n))return IK.clap;
  if(/indo|nusantara|lokal/.test(n))return IK.reel;
  if(/movie|film|bioskop/.test(n))return IK.star;
  return IK.play;
}
var KAT_WARNA={'drama indo':'#1f7ae0','drama china':'#e5262f','movie':'#7b3fe4'};
var KAT_PALET=['#0f9d8a','#e07a1f','#c2307f','#4f6bed','#2f9e44','#b5651d'];
function katWarna(n){
  n=String(n||'').trim().toLowerCase();
  if(KAT_WARNA[n])return KAT_WARNA[n];
  var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  return KAT_PALET[h%KAT_PALET.length];
}
function ucfirst(t){t=String(t||'');return t.charAt(0).toUpperCase()+t.slice(1)}
function thumbBesar(id){return isFb(id)?FB_COVER:'https://i.ytimg.com/vi/'+id+'/maxresdefault.jpg'}

function renderChips(){
  var h='<button class="chip" type="button" data-k="Semua" aria-pressed="'+(S.filter==='Semua')+'">'+katIcon('Semua')+'Semua</button>';
  S.kat.forEach(function(k){h+='<button class="chip" type="button" data-k="'+esc(k.nama)+'" aria-pressed="'+(S.filter===k.nama)+'">'+katIcon(k.nama)+esc(k.nama)+'</button>'});
  $('#chips').innerHTML=h;
}
function pilihCur(){
  var list=tersaring();
  if(!list.length){S.cur=null;return list}
  if(!S.cur||!list.some(function(v){return v.id===S.cur}))S.cur=list[0].id;
  return list;
}
function renderStage(autoplay){
  var list=pilihCur(),box=$('#stage');
  if(!list.length){
    var teks=S.tabelBelum?'<b>Halaman ini belum aktif.</b>Admin perlu menjalankan supabase-tv.sql di Supabase.'
      :S.err?'<b>Video belum bisa dimuat.</b>Periksa sambungan internet lalu muat ulang halaman.'
      :S.q?'<b>Tidak ada hasil.</b>Coba kata kunci lain.'
      :S.filter!=='Semua'?'<b>Belum ada video di '+esc(S.filter)+'.</b>Pilih kategori lain atau lihat Semua.'
      :'<b>Belum ada video.</b>Video akan muncul di sini setelah ditambahkan.';
    box.innerHTML='<div class="kosong">'+teks+'</div>';
    return;
  }
  var v=list.filter(function(x){return x.id===S.cur})[0];
  if(autoplay){
    jedaMusik();
    box.innerHTML='<div class="player"><iframe src="'+esc(embedUrl(v.yt_id))+'" title="'+esc(v.judul)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>'
      +'<div class="info-miring" role="status"><span>Untuk keluar dari layar penuh, tekan tombol kembali</span><button type="button" data-info-tutup aria-label="Tutup pesan">&times;</button></div></div>'
      +'<button class="btn-miring" type="button" data-miring>'+IC_MIRING+'<span>Tonton layar miring</span></button>'
      +'<h1 class="judul">'+esc(v.judul)+'</h1>'
      +'<p class="meta">'+esc(v.kategori||'Tanpa kategori')+' &bull; '+umur(v)+'</p>';
    return;
  }
  var dots='';
  if(list.length>1){
    dots='<div class="dots" role="group" aria-label="Pilih video unggulan">'+list.slice(0,5).map(function(x,i){
      return '<button class="dot'+(x.id===S.cur?' on':'')+'" type="button" data-dot="'+x.id+'" aria-label="Video '+(i+1)+': '+esc(x.judul)+'" aria-pressed="'+(x.id===S.cur)+'"></button>';
    }).join('')+'</div>';
  }
  box.innerHTML='<div class="hero" id="hero">'
    +'<img src="'+thumbBesar(v.yt_id)+'" alt="">'
    +'<div class="hero-body">'
      +'<h1>'+esc(v.judul)+'</h1>'
      +'<p class="hero-sub">'+esc(v.tayang_sampai?sisa(v):ucfirst(umur(v)))+'</p>'
      +'<div class="pills"><span class="pill">'+katIcon(v.kategori)+esc(v.kategori||'Tanpa kategori')+'</span>'+(baru(v)?'<span class="pill baru">Baru</span>':'')+'</div>'
      +'<button class="btn-tonton" type="button" id="btnPutar" aria-label="Putar: '+esc(v.judul)+'">'+IC_PLAY+'Tonton Sekarang</button>'
    +'</div>'+dots+'</div>';
  var im=box.querySelector('.hero>img');
  var cadangan=function(){var u=thumb(v.yt_id);if(im.getAttribute('src')!==u)im.src=u};
  im.onerror=cadangan;
  im.onload=function(){if(im.naturalWidth&&im.naturalWidth<200)cadangan()};
}
function renderRow(){
  var list=tersaring(),lain=list.filter(function(v){return v.id!==S.cur});
  var batas=4,tampil=S.semua?lain:lain.slice(0,batas);
  $('#lain').hidden=!lain.length;
  var bl=$('#btnLihat');
  bl.hidden=lain.length<=batas;
  bl.firstElementChild.textContent=S.semua?'Ringkas':'Lihat Semua';
  bl.lastElementChild.style.transform=S.semua?'rotate(-90deg)':'';
  $('#row').innerHTML=tampil.map(function(v){
    return '<button class="item" type="button" data-id="'+v.id+'"><span class="thumb"><img src="'+thumb(v.yt_id)+'" alt="" loading="lazy">'
      +'<span class="mini">'+IC_PLAY+'</span>'
      +(v.tayang_sampai?'<span class="sisa">'+'Masa tayang '+esc(sisa(v).replace('Tayang ',''))+'</span>':'')
      +'</span><span class="tx"><span class="jd">'+esc(v.judul)+'</span><small>'+esc(v.kategori||'')+'</small></span></button>';
  }).join('');
}

function sisaPendek(v){
  var h=Math.ceil((tgl(v.tayang_sampai)-Date.now())/36e5);
  return h<24?h+' jam lagi':Math.ceil(h/24)+' hari lagi';
}
function renderSoon(){
  var list=tersaring().filter(function(v){return v.tayang_sampai}).sort(function(a,b){return tgl(a.tayang_sampai)-tgl(b.tayang_sampai)}).slice(0,8);
  $('#soon').hidden=!list.length;
  $('#soonNav').hidden=list.length<2;
  $('#slider').innerHTML=list.map(function(v){
    var dekat=tgl(v.tayang_sampai)-Date.now()<=3*864e5;
    return '<button class="item" type="button" data-id="'+v.id+'"><span class="thumb"><img src="'+thumb(v.yt_id)+'" alt="" loading="lazy">'
      +'<span class="mini">'+IC_PLAY+'</span>'
      +(v.kategori?'<span class="kat-badge" style="background:'+katWarna(v.kategori)+'">'+esc(v.kategori)+'</span>':'')
      +'<span class="sisa2'+(dekat?' dekat':'')+'">'+esc(sisaPendek(v))+'</span>'
      +'</span><span class="tx"><span class="jd">'+esc(v.judul)+'</span><small>'+esc(sisa(v))+'</small></span></button>';
  }).join('');
}

$('#chips').addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  S.filter=b.dataset.k;S.semua=false;render();
});
$('#stage').addEventListener('click',function(e){
  var d=e.target.closest('[data-dot]');
  if(d){S.cur=Number(d.dataset.dot);renderStage();renderRow();return}
  if(e.target.closest('#hero'))renderStage(true);
});
/* ---------- layar miring ---------- */
var fsRiwayat=false,infoTimer=0;
function infoMiring(on){
  var i=document.querySelector('.player .info-miring');if(!i)return;
  clearTimeout(infoTimer);i.classList.toggle('tampil',!!on);
  if(on)infoTimer=setTimeout(function(){i.classList.remove('tampil')},8000);
}
function masukRiwayat(){   // tombol kembali = keluar layar penuh dulu, bukan pindah halaman
  if(fsRiwayat)return;
  try{history.pushState({ksFs:1},'',location.href);fsRiwayat=true}catch(e){}
}
function tutupMiringCss(){
  try{var fe=document.fullscreenElement||document.webkitFullscreenElement;if(fe){var ex=document.exitFullscreen||document.webkitExitFullscreen;if(ex){var r=ex.call(document);if(r&&r.catch)r.catch(function(){})}}}catch(e){}
  var p=document.querySelector('.player.miring-css');
  if(p)p.classList.remove('miring-css');
  document.body.classList.remove('kunci-miring');
  infoMiring(false);
}
function bukaMiring(){
  var p=document.querySelector('.player');if(!p)return;
  var rf=p.requestFullscreen||p.webkitRequestFullscreen;
  masukRiwayat();infoMiring(true);
  if(rf){
    var h=rf.call(p);
    var kunci=function(){
      try{var o=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(o&&o.catch)o.catch(function(){})}catch(e){}
    };
    if(h&&h.then){h.then(kunci,function(){p.classList.add('miring-css');document.body.classList.add('kunci-miring')})}else{kunci()}
  }else{
    p.classList.add('miring-css');document.body.classList.add('kunci-miring');
  }
}
function lepasMiring(){
  if(!(document.fullscreenElement||document.webkitFullscreenElement)){
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
    if(document.querySelector('.player.miring-css'))return;
    infoMiring(false);
    if(fsRiwayat){fsRiwayat=false;try{history.back()}catch(e){}}   // buang entri riwayat yang tadi ditambahkan
  }
}
window.addEventListener('popstate',function(){
  if(fsRiwayat){fsRiwayat=false;tutupMiringCss()}
});
document.addEventListener('fullscreenchange',lepasMiring);
document.addEventListener('webkitfullscreenchange',lepasMiring);
$('#stage').addEventListener('click',function(e){
  if(e.target.closest('[data-miring]'))bukaMiring();
  else if(e.target.closest('[data-info-tutup]'))infoMiring(false);
});
$('#btnLihat').addEventListener('click',function(){S.semua=!S.semua;renderRow()});

/* ---------- mode terang / gelap ---------- */
function setTema(t,simpan){
  document.documentElement.setAttribute('data-tema',t);
  var m=document.getElementById('metaTema');if(m)m.setAttribute('content',t==='gelap'?'#000000':'#fbf8f4');
  var b=$('#btnTema');
  b.setAttribute('aria-pressed',t==='gelap');
  b.setAttribute('aria-label',t==='gelap'?'Ganti ke mode terang':'Ganti ke mode gelap');
  if(simpan){try{localStorage.setItem('kalensari_tv_tema',t)}catch(e){}}
}
setTema(document.documentElement.getAttribute('data-tema')||'terang',false);
$('#btnTema').addEventListener('click',function(){
  setTema(document.documentElement.getAttribute('data-tema')==='gelap'?'terang':'gelap',true);
});
if(window.matchMedia){
  var mq=matchMedia('(prefers-color-scheme: dark)'),ikut=function(e){
    var s=null;try{s=localStorage.getItem('kalensari_tv_tema')}catch(x){}
    if(s!=='terang'&&s!=='gelap')setTema(e.matches?'gelap':'terang',false);
  };
  if(mq.addEventListener)mq.addEventListener('change',ikut);
}
$('#row').addEventListener('click',function(e){
  var b=e.target.closest('.item');if(!b)return;
  S.cur=Number(b.dataset.id);
  renderStage(true);renderRow();
  $('#stage').scrollIntoView({behavior:'smooth',block:'start'});
});
$('#slider').addEventListener('click',function(e){
  var b=e.target.closest('.item');if(!b)return;
  S.cur=Number(b.dataset.id);
  renderStage(true);renderRow();
  $('#stage').scrollIntoView({behavior:'smooth',block:'start'});
});
$('#soonPrev').addEventListener('click',function(){var s=$('#slider');s.scrollBy({left:-s.clientWidth*.8,behavior:'smooth'})});
$('#soonNext').addEventListener('click',function(){var s=$('#slider');s.scrollBy({left:s.clientWidth*.8,behavior:'smooth'})});
$('#btnCari').addEventListener('click',function(){
  var box=$('#boxCari'),on=!box.classList.contains('on');
  box.classList.toggle('on',on);this.setAttribute('aria-expanded',on);
  if(on)$('#inCari').focus();else{S.q='';$('#inCari').value='';render()}
});
$('#inCari').addEventListener('input',function(){S.q=this.value;renderStage();renderRow();renderSoon()});

/* ---------- panel kelola ---------- */
function isAdmin(){return !$('#panel').hidden&&!!auth}
function pesan(id,t,jenis){var p=$(id);p.textContent=t||'';p.className='pesan'+(jenis?' '+jenis:'')}

function bukaPanel(){
  $('#panel').hidden=false;
  var masuk=!!(auth&&auth.refresh_token);
  $('#boxMasuk').hidden=masuk;$('#boxKelola').hidden=!masuk;
  if(masuk){renderPanel()}
  $('#panel').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#btnKelola').addEventListener('click',function(){
  if(!$('#panel').hidden&&!auth){$('#panel').hidden=true;return}
  bukaPanel();
});

$('#btnMasuk').addEventListener('click',async function(){
  var em=$('#lEmail').value.trim(),pw=$('#lPass').value,btn=this;
  if(!em||!pw){pesan('#pesanMasuk','Isi email dan kata sandi.','err');return}
  btn.disabled=true;btn.textContent='Memeriksa...';pesan('#pesanMasuk','');
  try{
    var sess=await authReq('password',{email:em,password:pw});
    var r=await fetch(BASE+'/rest/v1/rpc/is_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok)throw new Error('cek-admin-gagal');
    if((await r.json())!==true){
      fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access_token}}).catch(function(){});
      throw new Error('bukan-admin');
    }
    saveAuth(sess);$('#lPass').value='';
    $('#boxMasuk').hidden=true;$('#boxKelola').hidden=false;
    await muat();
  }catch(e){
    var m=String(e.message||e);
    pesan('#pesanMasuk',m==='bukan-admin'?'Akun ini bukan admin.':m==='cek-admin-gagal'?'Jalankan supabase-admin-auth.sql di Supabase dulu.':/invalid|credentials/i.test(m)?'Email atau kata sandi salah.':'Gagal masuk: '+m.slice(0,80),'err');
  }finally{btn.disabled=false;btn.textContent='Masuk'}
});
$('#lPass').addEventListener('keydown',function(e){if(e.key==='Enter')$('#btnMasuk').click()});

$('#btnKeluar').addEventListener('click',async function(){
  if(auth)fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+auth.access_token}}).catch(function(){});
  saveAuth(null);$('#panel').hidden=true;await muat();
});

function renderPanel(){
  /* pilihan kategori di formulir */
  var sel=$('#fKat'),lama=sel.value;
  sel.innerHTML=S.kat.length?S.kat.map(function(k){return '<option>'+esc(k.nama)+'</option>'}).join(''):'<option value="">(belum ada kategori)</option>';
  if(lama&&S.kat.some(function(k){return k.nama===lama}))sel.value=lama;

  /* daftar kategori */
  $('#katList').innerHTML=S.kat.length?S.kat.map(function(k){
    return '<li><span>'+esc(k.nama)+'</span><button type="button" data-hapus-kat="'+k.id+'" aria-label="Hapus kategori '+esc(k.nama)+'">&times;</button></li>';
  }).join(''):'<li>Belum ada kategori</li>';

  /* daftar video */
  $('#jml').textContent='('+S.vid.length+')';
  $('#adm').innerHTML=S.vid.length?S.vid.map(function(v){
    var h=habis(v);
    return '<li><img src="'+thumb(v.yt_id)+'" alt="" loading="lazy">'
      +'<div class="tx"><b>'+esc(v.judul)+'</b><small'+(h?' class="habis"':'')+'>'+esc(v.kategori||'Tanpa kategori')+' &bull; '+(h?'Masa tayang habis':v.tayang_sampai?esc(sisa(v)):'Tanpa batas')+'</small></div>'
      +'<button class="pin'+(v.sematkan?' on':'')+'" type="button" data-pin="'+v.id+'" aria-pressed="'+!!v.sematkan+'" aria-label="'+(v.sematkan?'Lepas sematan':'Sematkan')+': '+esc(v.judul)+'"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></button>'
      +'<button class="del" type="button" data-hapus="'+v.id+'" aria-label="Hapus video: '+esc(v.judul)+'"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></li>';
  }).join(''):'<li style="color:var(--mut);font-size:.9rem">Belum ada video. Tambahkan lewat formulir di atas.</li>';

  if(S.tabelBelum)pesan('#pesanTambah','Tabel belum ada. Jalankan supabase-tv.sql di Supabase.','err');
}

/* tempel link -> coba isi judul otomatis */
var cobaJudul=0;
$('#fLink').addEventListener('input',async function(){
  var id=ytId(this.value);
  if(!id||$('#fJudul').value.trim())return;
  var n=++cobaJudul;
  try{
    var r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));
    if(!r.ok)return;
    var d=await r.json();
    if(n===cobaJudul&&!$('#fJudul').value.trim())$('#fJudul').value=String(d.title||'').slice(0,120);
  }catch(e){/* tidak apa-apa, judul diisi manual */}
});

$('#btnTambah').addEventListener('click',async function(){
  var btn=this,id=sumberId($('#fLink').value),judul=$('#fJudul').value.trim(),kat=$('#fKat').value,hari=Number($('#fMasa').value),pin=$('#fPin').checked;
  if(!id){pesan('#pesanTambah','Link tidak dikenali. Tempel link YouTube atau link video Facebook (dari tombol Bagikan).','err');return}
  if(!judul){pesan('#pesanTambah','Isi judul video.','err');return}
  if(!kat){pesan('#pesanTambah','Buat kategori dulu di bagian Kategori.','err');return}
  btn.disabled=true;pesan('#pesanTambah','Menyimpan...');
  try{
    if(!(await fresh()))throw new Error('Sesi habis, masuk lagi.');
    if(pin)await rest('tv_video?sematkan=eq.true',{method:'PATCH',body:JSON.stringify({sematkan:false})});
    var baris={yt_id:id,judul:judul,kategori:kat,sematkan:pin,tayang_sampai:hari?new Date(Date.now()+hari*864e5).toISOString():null};
    var r=await rest('tv_video',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(baris)});
    $('#fLink').value='';$('#fJudul').value='';$('#fPin').checked=false;
    S.filter='Semua';S.cur=r&&r[0]?r[0].id:null;
    await muat();
    pesan('#pesanTambah','Video ditambahkan.','ok');
  }catch(e){
    pesan('#pesanTambah','Gagal menambah: '+String(e.message).slice(0,100),'err');
    if(/Sesi/.test(e.message)){$('#boxMasuk').hidden=false;$('#boxKelola').hidden=true}
  }finally{btn.disabled=false}
});

$('#adm').addEventListener('click',async function(e){
  var del=e.target.closest('[data-hapus]'),pin=e.target.closest('[data-pin]');
  try{
    if(!(await fresh()))throw new Error('Sesi habis, masuk lagi.');
    if(del){
      var v=S.vid.filter(function(x){return x.id===Number(del.dataset.hapus)})[0];
      if(!v||!confirm('Hapus video "'+v.judul+'"?'))return;
      await rest('tv_video?id=eq.'+v.id,{method:'DELETE'});
      await muat();
    }else if(pin){
      var id=Number(pin.dataset.pin),sudah=S.vid.some(function(x){return x.id===id&&x.sematkan});
      if(!sudah)await rest('tv_video?sematkan=eq.true',{method:'PATCH',body:JSON.stringify({sematkan:false})});
      await rest('tv_video?id=eq.'+id,{method:'PATCH',body:JSON.stringify({sematkan:!sudah})});
      await muat();
    }
  }catch(err){pesan('#pesanTambah','Gagal: '+String(err.message).slice(0,100),'err')}
});

/* kategori: tambah & hapus */
$('#btnKatTambah').addEventListener('click',async function(){
  var nama=$('#fKatBaru').value.trim().replace(/\s+/g,' ');
  if(!nama){pesan('#pesanKat','Isi nama kategori.','err');return}
  if(S.kat.some(function(k){return k.nama.toLowerCase()===nama.toLowerCase()})){pesan('#pesanKat','Kategori itu sudah ada.','err');return}
  this.disabled=true;
  try{
    if(!(await fresh()))throw new Error('Sesi habis, masuk lagi.');
    var urut=S.kat.reduce(function(m,k){return Math.max(m,k.urutan||0)},0)+1;
    await rest('tv_kategori',{method:'POST',body:JSON.stringify({nama:nama,urutan:urut})});
    $('#fKatBaru').value='';
    await muat();
    pesan('#pesanKat','Kategori ditambahkan.','ok');
  }catch(e){pesan('#pesanKat','Gagal: '+String(e.message).slice(0,100),'err')}
  finally{this.disabled=false}
});
$('#fKatBaru').addEventListener('keydown',function(e){if(e.key==='Enter')$('#btnKatTambah').click()});
$('#katList').addEventListener('click',async function(e){
  var b=e.target.closest('[data-hapus-kat]');if(!b)return;
  var k=S.kat.filter(function(x){return x.id===Number(b.dataset.hapusKat)})[0];if(!k)return;
  var n=S.vid.filter(function(v){return v.kategori===k.nama}).length;
  var tanya='Hapus kategori "'+k.nama+'"?'+(n?'\n\n'+n+' video di dalamnya tidak ikut terhapus. Video itu tetap tampil di Semua, tanpa kategori.':'');
  if(!confirm(tanya))return;
  try{
    if(!(await fresh()))throw new Error('Sesi habis, masuk lagi.');
    await rest('tv_kategori?id=eq.'+k.id,{method:'DELETE'});
    if(S.filter===k.nama)S.filter='Semua';
    await muat();
    pesan('#pesanKat','Kategori dihapus.','ok');
  }catch(err){pesan('#pesanKat','Gagal: '+String(err.message).slice(0,100),'err')}
});

/* ---------- mulai ---------- */
muat().then(function(){
  if(location.hash==='#kelola')bukaPanel();
});
})();
</script>
