<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Notif • Kalensari Store</title>
<meta name="theme-color" content="#7b3f1d">
<link rel="manifest" href="manifest-adminnotif.webmanifest">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--br:#7b3f1d;--br2:#5b2e1a;--bg:#f6efe6;--card:#fffaf2;--g:#228b4e;--red:#c0392b;--mut:#8a7565;--line:#e8dac9}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 Roboto,system-ui,sans-serif;background:var(--bg);color:#3b2416;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--br);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}header small{opacity:.8;font-size:12px;display:block;font-weight:400}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 90px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(80,45,20,.08)}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:6px 0;background:#fff}
.btn{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--g);color:#fff}
.btn.red{background:var(--red)}.btn.lt{background:#fff;color:var(--br2);border:1px solid var(--line)}.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row .btn{flex:1;min-width:110px}
.tabs{display:flex;gap:6px;position:sticky;top:calc(56px + env(safe-area-inset-top,0));z-index:4;background:var(--bg);padding:8px 0}
.tab{flex:1;border:0;background:#fff;border-radius:12px;padding:10px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--br2);position:relative}
.tab.on{background:var(--br);color:#fff}.tab i{font-style:normal;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.amt{font-size:19px;font-weight:700;color:var(--g)}.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff1d6;color:#9a5a00}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3b2416;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;font-size:14px}
.hide{display:none!important}img.bkt{max-width:100%;border-radius:12px;margin-top:8px}
.ksn{border-radius:16px;padding:12px 14px;background:#fffaf2;box-shadow:0 2px 10px rgba(80,45,20,.08);margin:10px 0;font-size:14px}
.ksn b{display:block;margin-bottom:4px}.ksn p{margin:0 0 8px;color:#6b5546}.ksn.ok{background:#e9f7ee}.ksn.ok p{margin:0;color:#14502c}
.ksn .ksb{display:flex;gap:8px;flex-wrap:wrap}.ksn button{border:0;border-radius:12px;padding:9px 14px;font-weight:600;font:inherit;background:#228b4e;color:#fff}.ksn button.ks2{background:#fff;color:#5b2e1a;border:1px solid #e3d3c3}
</style>
</head>
<body>
<div id="login" class="wrap hide">
  <div class="card" style="margin-top:40px">
    <h2 style="margin:0 0 4px">🔔 Admin Notif</h2>
    <p class="mut" style="margin:0 0 10px">Masuk dengan akun admin Kalensari Store (email &amp; kata sandi Supabase yang sama dengan menu Admin).</p>
    <input class="inp" id="em" type="email" placeholder="Email admin" autocomplete="username">
    <input class="inp" id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
    <button class="btn" id="goLogin" style="width:100%;margin-top:6px">Masuk</button>
    <p id="lerr" class="mut" style="color:var(--red)"></p>
  </div>
</div>

<div id="app" class="hide">
  <header><h1>🔔 Admin Notif<small id="who"></small></h1><button id="rf">⟳ Muat</button><button id="out">Keluar</button></header>
  <div class="wrap">
    <div id="notifBox"></div>
    <div class="tabs">
      <button class="tab on" data-t="qris">💳 QRIS<i id="bq" class="hide">0</i></button>
      <button class="tab" data-t="topup">💰 Isi Saldo<i id="bt" class="hide">0</i></button>
      <button class="tab" data-t="cair">💸 Pencairan<i id="bc" class="hide">0</i></button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="notif.js"></script>
<script src="pwa.js"></script>
<script>
const CFG=window.CLOUD_CONFIG||{},BASE=String(CFG.supabaseUrl||'').replace(/\/$/,'');
const AUTH_KEY='kalensari_adminnotif_auth',SEEN_KEY='kalensari_adminnotif_seen';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const wk=v=>String(v||'').replace(/\D/g,'').replace(/^0/,'62');
const fmt=t=>{try{return new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
let auth=(()=>{try{return JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){return null}})();
const saveAuth=a=>{auth=a;try{a?localStorage.setItem(AUTH_KEY,JSON.stringify(a)):localStorage.removeItem(AUTH_KEY)}catch(e){}};
let tab='qris',D={qris:[],topup:[],cair:[]},first=true,busyLoad=false;

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
async function authReq(grant,body){
  const r=await fetch(`${BASE}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),email:(d.user&&d.user.email)||''};
}
async function fresh(){
  if(!auth||!auth.refresh_token)throw new Error('login');
  if(auth.expires_at*1000-Date.now()>60000)return;
  try{saveAuth({...await authReq('refresh_token',{refresh_token:auth.refresh_token}),email:auth.email})}catch(e){saveAuth(null);throw new Error('login')}
}
async function api(path,opt={}){
  try{await fresh()}catch(e){showLogin();throw e}
  const r=await fetch(`${BASE}/rest/v1/${path}`,{...opt,headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+auth.access_token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  const t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t?JSON.parse(t):[];
}
const readKey=async(k,def)=>{const r=await api('store_settings?select=value&key=eq.'+encodeURIComponent(k));return r[0]&&r[0].value!=null?r[0].value:def};
const setSetting=(key,value)=>api('store_settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{key,value}])});

function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide')}
async function masuk(){
  $('#lerr').textContent='';const b=$('#goLogin');b.disabled=true;b.textContent='Memeriksa...';
  try{
    const s=await authReq('password',{email:$('#em').value.trim(),password:$('#pw').value});saveAuth(s);
    const r=await fetch(`${BASE}/rest/v1/rpc/is_admin`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:'{}'});
    if((await r.json())!==true){saveAuth(null);throw new Error('Akun ini bukan admin.')}
    $('#pw').value='';start();
  }catch(e){$('#lerr').textContent=String(e.message||e)}
  b.disabled=false;b.textContent='Masuk';
}
$('#goLogin').onclick=masuk;$('#pw').onkeydown=e=>{if(e.key==='Enter')masuk()};
$('#out').onclick=()=>{if(!confirm('Keluar dari Admin Notif di HP ini?'))return;saveAuth(null);location.reload()};
$('#rf').onclick=()=>muat(true);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});

/* ===== data ===== */
async function muat(manual){
  if(busyLoad||!auth)return;busyLoad=true;
  try{
    const [q,t,ct,ck]=await Promise.all([
      api('orders?select=*&pay_status=eq.verifikasi&order=created_at.desc&limit=60').catch(()=>[]),
      api('kurir_topup?select=id,nama,wa,jumlah,status,t&status=eq.menunggu&order=t.desc&limit=60').catch(()=>[]),
      readKey('cair_toko',[]).catch(()=>[]),
      api('kurir_cair?select=*&status=eq.menunggu&order=t.desc&limit=60').catch(()=>[])
    ]);
    // QRIS: satukan nota satu grup (1 QR bisa membayar beberapa nota)
    const g=new Map();(Array.isArray(q)?q:[]).forEach(o=>{const k=o.grup?'g'+o.grup:'o'+o.id;const e=g.get(k)||{key:k,grup:o.grup||null,ids:[],kode:[],total:0,nama:o.customer_name,wa:o.customer_phone,t:o.pay_klaim_at||o.created_at};e.ids.push(o.id);e.kode.push(o.order_code||('#'+o.id));e.total+=Number(o.total)||0;g.set(k,e)});
    D.qris=[...g.values()];
    D.topup=(Array.isArray(t)?t:[]).map(x=>({...x,key:'t'+x.id}));
    const tk=(Array.isArray(ct)?ct:[]).filter(x=>x&&x.status==='menunggu').map(x=>({...x,src:'toko',key:'ct'+(x.id||x.t||((x.toko||x.nama||'')+x.jumlah))}));
    const kk=(Array.isArray(ck)?ck:[]).map(x=>({...x,src:'kurir',key:'ck'+x.id}));
    D.cair=[...tk,...kk].sort((a,b)=>new Date(b.t)-new Date(a.t));
    kabari();render();
  }catch(e){if(manual)toast('Gagal memuat: '+String(e.message||e).slice(0,60))}
  busyLoad=false;
}
function seen(){try{return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'))}catch(e){return new Set()}}
function bunyi(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[[0,988],[.18,1319],[.36,1568]].forEach(([t,f])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.3);o.start(c.currentTime+t);o.stop(c.currentTime+t+.32)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}}
async function kabari(){
  const all=[...D.qris,...D.topup,...D.cair],s=seen(),baru=all.filter(x=>!s.has(x.key));
  try{localStorage.setItem(SEEN_KEY,JSON.stringify([...new Set([...s,...all.map(x=>x.key)])].slice(-400)))}catch(e){}
  if(first){first=false;return}
  if(!baru.length)return;
  bunyi();
  const bq=baru.filter(x=>D.qris.includes(x)),bt=baru.filter(x=>D.topup.includes(x)),bc=baru.filter(x=>D.cair.includes(x));
  const msg=[];if(bq.length)msg.push(`💳 ${bq.length} QRIS perlu dicek`);if(bt.length)msg.push(`💰 ${bt.length} isi saldo`);if(bc.length)msg.push(`💸 ${bc.length} pencairan`);
  toast(msg.join(' • '));
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    try{const reg=await navigator.serviceWorker.getRegistration();reg&&reg.showNotification('Kalensari Admin',{body:msg.join(' • '),icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'admin-notif',renotify:true,vibrate:[300,120,300],data:{url:'admin-notif.html'}})}catch(e){}
  }
}

/* ===== tampilan ===== */
function badge(id,n){const e=$(id);e.textContent=n;e.classList.toggle('hide',!n)}
function render(){
  badge('#bq',D.qris.length);badge('#bt',D.topup.length);badge('#bc',D.cair.length);
  try{navigator.setAppBadge&&(D.qris.length+D.topup.length+D.cair.length?navigator.setAppBadge(D.qris.length+D.topup.length+D.cair.length):navigator.clearAppBadge())}catch(e){}
  const L=$('#list');
  if(tab==='qris')L.innerHTML=D.qris.length?D.qris.map(x=>`<div class="card"><span class="tag">🔎 Menunggu cek mutasi</span>
    <div style="margin-top:6px"><b>${esc(x.nama||'Pembeli')}</b> · ${esc(x.kode.join(', '))}</div>
    <div class="amt">${rp(x.total)}</div><div class="mut">Klaim bayar ${fmt(x.t)}${x.ids.length>1?' · '+x.ids.length+' nota':''}</div>
    <div id="bk-${esc(x.key)}"></div>
    <div class="row"><button class="btn lt" onclick="bukti('${esc(x.key)}')">🧾 Bukti</button>${x.wa?`<a class="btn lt" style="text-decoration:none;text-align:center" href="https://wa.me/${wk(x.wa)}" target="_blank" rel="noopener">💬 WA</a>`:''}<button class="btn red" onclick="tolakQris('${esc(x.key)}',this)">✖ Tolak</button><button class="btn" onclick="accQris('${esc(x.key)}',this)">✅ Sudah masuk, ACC</button></div></div>`).join(''):'<div class="empty">Tidak ada pembayaran QRIS yang menunggu 🎉</div>';
  else if(tab==='topup')L.innerHTML=D.topup.length?D.topup.map(x=>`<div class="card"><b>${esc(x.nama||'Kurir')}</b> minta isi saldo
    <div class="amt">${rp(x.jumlah)}</div><div class="mut">${fmt(x.t)}</div><div id="bk-${esc(x.key)}"></div>
    <div class="row"><button class="btn lt" onclick="buktiTopup(${x.id},'${esc(x.key)}')">🧾 Bukti</button><button class="btn red" onclick="topup(${x.id},false,this)">Tolak</button><button class="btn" onclick="topup(${x.id},true,this)">✅ ACC</button></div></div>`).join(''):'<div class="empty">Tidak ada permintaan isi saldo 🎉</div>';
  else L.innerHTML=D.cair.length?D.cair.map(x=>{const net=x.diterima!=null?x.diterima:x.jumlah;return`<div class="card"><span class="tag">${x.src==='kurir'?'🛵 Kurir':'🏪 Toko'}</span>
    <div style="margin-top:6px"><b>${esc(x.nama||x.toko||'-')}</b></div>
    <div class="amt">Transfer ${rp(net)}</div><div class="mut">${x.biaya?'Saldo '+rp(x.jumlah)+' − biaya bank '+rp(x.biaya)+'<br>':''}Ke: ${esc(x.rek||'-')}<br>${fmt(x.t)}</div>
    <div class="row">${x.wa?`<a class="btn lt" style="text-decoration:none;text-align:center" href="https://wa.me/${wk(x.wa)}" target="_blank" rel="noopener">💬 WA</a>`:''}<button class="btn red" onclick="cair('${esc(x.key)}',false,this)">Tolak</button><button class="btn" onclick="cair('${esc(x.key)}',true,this)">✅ Sudah ditransfer</button></div></div>`}).join(''):'<div class="empty">Tidak ada permintaan pencairan 🎉</div>';
}
async function lock(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(String(e.message||e).slice(0,90))}if(btn)btn.disabled=false}

async function bukti(key){
  const x=D.qris.find(y=>y.key===key),box=document.getElementById('bk-'+key);if(!x||!box)return;box.textContent='Memuat bukti...';
  try{const r=await api('bukti_bayar?select=foto&order_codes=cs.'+encodeURIComponent('{"'+x.kode[0]+'"}')+'&order=id.desc&limit=1');
    box.innerHTML=r[0]&&r[0].foto?`<img class="bkt" src="${esc(r[0].foto)}" alt="Bukti">`:'<div class="mut">Pembeli belum mengirim bukti.</div>'}catch(e){box.textContent='Bukti belum bisa dimuat.'}
}
async function buktiTopup(id,key){
  const box=document.getElementById('bk-'+key);if(!box)return;box.textContent='Memuat bukti...';
  try{const r=await api('kurir_topup?select=bukti&id=eq.'+Number(id));const f=r[0]&&r[0].bukti;box.innerHTML=f?`<img class="bkt" src="${esc(f)}" alt="Bukti">`:'<div class="mut">Tidak ada bukti.</div>'}catch(e){box.textContent='Bukti belum bisa dimuat.'}
}
async function accQris(key,btn){
  const x=D.qris.find(y=>y.key===key);if(!x)return;
  if(!confirm(`Tandai ${x.kode.join(', ')} SUDAH DIBAYAR (QRIS) sebesar ${rp(x.total)}?\n\nPastikan uang benar-benar sudah masuk ke mutasi.`))return;
  await lock(btn,async()=>{
    const t=new Date().toISOString();let ids=x.ids.slice();
    if(x.grup){try{const sib=await api('orders?select=id&grup=eq.'+encodeURIComponent(x.grup)+'&payment=ilike.qris*&pay_status=neq.lunas&status=neq.dibatalkan');sib.forEach(s=>{if(!ids.includes(s.id))ids.push(s.id)})}catch(e){}}
    for(const id of ids)await api('orders?id=eq.'+Number(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({pay_status:'lunas',paid_at:t,updated_at:t})});
    toast('✅ QRIS ditandai lunas');await muat();
  });
}
async function tolakQris(key,btn){
  const x=D.qris.find(y=>y.key===key);if(!x)return;
  const al=prompt(`Tolak pembayaran QRIS ${x.kode.join(', ')} (${rp(x.total)})?\n\nPesanan akan DIBATALKAN. Tulis alasan (mis. uang belum masuk / nominal tidak sesuai):`,'Uang belum masuk');
  if(al===null)return;
  const alasan=('Pembayaran QRIS ditolak admin'+(al.trim()?': '+al.trim():'')).slice(0,120);
  await lock(btn,async()=>{
    const t=new Date().toISOString();let ids=x.ids.slice();
    if(x.grup){try{const sib=await api('orders?select=id&grup=eq.'+encodeURIComponent(x.grup)+'&payment=ilike.qris*&pay_status=neq.lunas&status=neq.dibatalkan');sib.forEach(s=>{if(!ids.includes(s.id))ids.push(s.id)})}catch(e){}}
    let ok=0,lewat=0;
    for(const id of ids){
      // pay_status=neq.lunas: bila sudah terlanjur lunas (mis. lunas otomatis), jangan dibatalkan
      const r=await api('orders?id=eq.'+Number(id)+'&pay_status=neq.lunas',{method:'PATCH',body:JSON.stringify({status:'dibatalkan',pay_status:'ditolak',batal_alasan:alasan,batal_at:t,updated_at:t})});
      if(Array.isArray(r)&&r.length)ok++;else lewat++;
    }
    toast(ok?('✖ QRIS ditolak, pesanan dibatalkan'+(lewat?` (${lewat} nota sudah lunas, dilewati)`:'')):'Tidak ada yang dibatalkan: pesanan sudah lunas / diproses.');
    await muat();
  });
}
async function topup(id,ok,btn){
  let cat='';if(!ok){cat=prompt('Alasan ditolak (mis. bukti tidak jelas):','');if(cat===null)return}
  else{const x=D.topup.find(y=>y.id===id);if(!confirm(`Pastikan uang ${rp(x&&x.jumlah)} dari ${x&&x.nama||'kurir'} SUDAH masuk. ACC isi saldo?`))return}
  await lock(btn,async()=>{await api('rpc/proses_topup',{method:'POST',body:JSON.stringify({p_id:Number(id),p_terima:ok,p_catatan:cat})});toast(ok?'✅ Saldo kurir ditambahkan':'Permintaan ditolak');await muat()});
}
async function cair(key,ok,btn){
  const x=D.cair.find(y=>y.key===key);if(!x)return;let cat='';
  if(!ok){cat=prompt('Alasan ditolak (mis. nomor rekening salah):','');if(cat===null)return}
  else if(!confirm('Pastikan uangnya SUDAH Anda transfer. Tandai selesai?'))return;
  await lock(btn,async()=>{
    if(x.src==='kurir'){await api('rpc/kurir_cair_proses',{method:'POST',body:JSON.stringify({p_id:Number(x.id),p_selesai:ok,p_catatan:cat})})}
    else{const cur=await readKey('cair_toko',[]),l=Array.isArray(cur)?cur:[];
      const y=l.find(z=>z&&(x.id?z.id===x.id:(z.t===x.t&&z.jumlah===x.jumlah)));
      if(!y)throw new Error('Permintaan tidak ditemukan');if(y.status!=='menunggu')throw new Error('Sudah diproses sebelumnya');
      Object.assign(y,{status:ok?'selesai':'ditolak',catatan:cat.trim(),diproses_t:new Date().toISOString()});await setSetting('cair_toko',l)}
    toast(ok?'✅ Pencairan ditandai sudah ditransfer':'Pencairan ditolak');await muat();
  });
}

/* ===== mulai ===== */
function start(){
  $('#login').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=auth&&auth.email||'';
  if(window.KSNotif)KSNotif.kartu($('#notifBox'),{key:'admin_push',token:async()=>{await fresh();return auth.access_token},extra:{email:(auth&&auth.email)||''},
    judul:'🔔 Aktifkan notifikasi HP',ajakan:'Agar HP berbunyi saat ada QRIS, isi saldo, atau pencairan — walau aplikasi ditutup.',aktifTeks:'HP ini akan berbunyi untuk QRIS, isi saldo & pencairan.',tanpaMatikan:true});
  muat(true);
}
setInterval(()=>{if(auth&&!$('#app').classList.contains('hide'))muat()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth)muat()});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='bunyi-pesanan'){bunyi();muat()}});
