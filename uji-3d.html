<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buatBotOcong } from './duel-bot.js';

// ================== PENGATURAN ==================
const HERO = new URLSearchParams(location.search).get('hero') === 'kunti' ? 'kunti' : 'ocong';   // pilih hero: uji-3d.html?hero=kunti
const LAWAN = new URLSearchParams(location.search).get('lawan') === 'ocong' ? 'ocong' : 'boneka';   // lawan: uji-3d.html?lawan=ocong
const MODEL = HERO === 'kunti' ? 'model-3d/skinkunti.glb' : 'model-3d/skinocong.glb';   // model bertulang + animasi
const EFEK = 'gambar-game/skin-boneka/efek/';           // gambar efek skill (.webp)
const TINGGI = 1.7;                                      // tinggi boneka (meter)
const BATAS = { x0: -13.5, x1: 13.5, z0: -8.5, z1: 12 };  // area bisa dilewati
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);

// ================== RENDERER, SCENE, KAMERA ==================
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a1a22, 32, 70);
// pantulan cahaya lembut untuk bahan model 3D (supaya kain & topi tidak terlalu gelap)
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .35;
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const CAM_OFF = new THREE.Vector3(0, 12.5, 11.5);

// langit senja (gradasi)
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#1a1030'); g.addColorStop(.45, '#5a2a3a'); g.addColorStop(.75, '#c8643a'); g.addColorStop(1, '#f2a65a');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

// cahaya: matahari sore + langit + api
const hemi = new THREE.HemisphereLight(0xffc89a, 0x2a1a30, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffa860, 2.2);
sun.position.set(-18, 16, 10); sun.target.position.set(0, 0, 0);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22; sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 60; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ================== TEKSTUR BUATAN (tanpa file) ==================
function tex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}
const T_PAVING = tex(512, 512, (x, w, h) => {      // paving blok
  x.fillStyle = '#5a4a3e'; x.fillRect(0, 0, w, h);
  const bw = 64, bh = 32;
  for (let r = 0; r < h / bh; r++) for (let c = -1; c < w / bw + 1; c++) {
    const ox = (r % 2) * bw / 2, l = 52 + Math.random() * 18, s = 14 + Math.random() * 10;
    x.fillStyle = `hsl(${24 + Math.random() * 10},${s}%,${l}%)`; x.fillRect(c * bw + ox + 2, r * bh + 2, bw - 4, bh - 4);
    x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(c * bw + ox + 2, r * bh + bh - 7, bw - 4, 5);
  }
}, 14, 10);
const T_LAPANG = tex(1024, 704, (x, w, h) => {      // lapangan tanah basah + garis
  x.fillStyle = '#7a5236'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? '40,24,14' : '170,120,80'},${Math.random() * .12})`; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, rnd(3, 30), 0, 7); x.fill(); }
  for (let i = 0; i < 9; i++) { const g = x.createRadialGradient(0, 0, 4, 0, 0, 90); g.addColorStop(0, 'rgba(70,80,110,.55)'); g.addColorStop(1, 'rgba(70,80,110,0)'); x.save(); x.translate(rnd(60, w - 60), rnd(60, h - 60)); x.scale(rnd(1, 2.4), 1); x.fillStyle = g; x.beginPath(); x.arc(0, 0, 90, 0, 7); x.fill(); x.restore(); }
  x.strokeStyle = 'rgba(240,235,225,.85)'; x.lineWidth = 7;
  x.strokeRect(14, 14, w - 28, h - 28); x.beginPath(); x.moveTo(w / 2, 14); x.lineTo(w / 2, h - 14); x.stroke();
  x.beginPath(); x.arc(w / 2, h / 2, 110, 0, 7); x.stroke(); x.fillStyle = 'rgba(240,235,225,.85)'; x.beginPath(); x.arc(w / 2, h / 2, 9, 0, 7); x.fill();
});
const T_GENTENG = tex(256, 256, (x, w, h) => {      // genteng merah
  x.fillStyle = '#7a2216'; x.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const g = x.createLinearGradient(0, r * 32, 0, r * 32 + 32); g.addColorStop(0, `hsl(8,${55 + Math.random() * 10}%,${30 + Math.random() * 8}%)`); g.addColorStop(1, 'hsl(6,50%,18%)');
    x.fillStyle = g; x.beginPath(); x.roundRect(c * 32 + (r % 2) * 16 + 1, r * 32 + 1, 30, 31, [0, 0, 12, 12]); x.fill();
  }
}, 8, 3);
const T_DINDING = tex(256, 256, (x, w, h) => {
  x.fillStyle = '#e8dcc0'; x.fillRect(0, 0, w, h); x.fillStyle = '#2f6b4a'; x.fillRect(0, h * .62, w, h * .38);
  x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(0, h * .6, w, 6);
}, 6, 1);

const M = {
  paving: new THREE.MeshLambertMaterial({ map: T_PAVING }),
  lapang: new THREE.MeshStandardMaterial({ map: T_LAPANG, roughness: .55, metalness: .05 }),
  genteng: new THREE.MeshLambertMaterial({ map: T_GENTENG }),
  dinding: new THREE.MeshLambertMaterial({ map: T_DINDING }),
  hijau: new THREE.MeshLambertMaterial({ color: 0x2f6b4a }),
  krem: new THREE.MeshLambertMaterial({ color: 0xd8ccb0 }),
  batu: new THREE.MeshLambertMaterial({ color: 0x9a8f86 }),
  kayu: new THREE.MeshLambertMaterial({ color: 0x6a4428 }),
  pintu: new THREE.MeshLambertMaterial({ color: 0x4a3020 }),
  jendela: new THREE.MeshBasicMaterial({ color: 0xffc46a }),
  daun: [0x3f6b2a, 0x557a2e, 0x6b8a32].map(c => new THREE.MeshLambertMaterial({ color: c, flatShading: true })),
  batang: new THREE.MeshLambertMaterial({ color: 0x4a3524 }),
  hitam: new THREE.MeshLambertMaterial({ color: 0x1a1414 }),
};
const box = (w, h, d, m, x, y, z, p = scene) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; p.add(o); return o; };
const cyl = (r1, r2, h, m, x, y, z, p = scene, s = 12) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, s), m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; p.add(o); return o; };

// ================== ARENA: LAPANGAN SD KALENSARI ==================
function buatArena() {
  const lantai = new THREE.Mesh(new THREE.PlaneGeometry(44, 34), M.paving); lantai.rotation.x = -Math.PI / 2; lantai.position.z = 1; lantai.receiveShadow = true; scene.add(lantai);
  const lap = new THREE.Mesh(new THREE.PlaneGeometry(17, 11.7), M.lapang); lap.rotation.x = -Math.PI / 2; lap.position.set(0, .015, 1); lap.receiveShadow = true; scene.add(lap);
  const tanah = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshLambertMaterial({ color: 0x2c2418 })); tanah.rotation.x = -Math.PI / 2; tanah.position.y = -.05; scene.add(tanah);
  // selokan di kiri-kanan lapangan
  [-9.6, 9.6].forEach(x => box(.35, .04, 2.2, M.hitam, x, .03, 1));

  // gedung kelas: belakang, kiri, kanan
  gedung(34, 0, -13.5, 0);
  gedung(22, -18.5, 0, Math.PI / 2);
  gedung(22, 18.5, 0, -Math.PI / 2);

  // tiang bendera di atas podium
  box(4, .25, 2.6, M.batu, 0, .12, -9.2); box(3, .25, 1.8, M.batu, 0, .37, -9.3); box(2.6, .2, 1, M.batu, 0, .1, -7.8);
  cyl(.06, .08, 8.5, new THREE.MeshLambertMaterial({ color: 0xd8d8d8 }), 0, 4.6, -9.3);
  const fg = new THREE.PlaneGeometry(1.5, 1, 12, 6);
  const fc = document.createElement('canvas'); fc.width = 64; fc.height = 42; const fx = fc.getContext('2d'); fx.fillStyle = '#d71920'; fx.fillRect(0, 0, 64, 21); fx.fillStyle = '#f5f5f5'; fx.fillRect(0, 21, 64, 21);
  const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace;
  BENDERA = new THREE.Mesh(fg, new THREE.MeshLambertMaterial({ map: ft, side: THREE.DoubleSide })); BENDERA.position.set(.77, 8.2, -9.3); BENDERA.castShadow = true; scene.add(BENDERA);
  BENDERA.userData.base = fg.attributes.position.array.slice();

  // pohon: deret depan gedung + pojok depan (tempat sembunyi)
  [[-12, -10.2], [-6, -10.4], [6, -10.4], [12, -10.2], [-14.6, -5], [14.6, -5], [-14.8, 5.5], [14.8, 5.5]].forEach(p => pohon(p[0], p[1], 1));
  [[-16, 16.8], [-12.5, 17.5], [16, 16.8], [12.5, 17.5]].forEach(p => pohon(p[0], p[1], 1.2));
  // pot tanaman & bangku di teras
  for (let x = -13; x <= 13; x += 4.3) { pot(x, -10.8); if (Math.abs(x) > 2) bangku(x + 2, -11.3, 0); }
  [-8, -3, 3, 8].forEach(z => { pot(-15.6, z); pot(15.6, z); });
  // tembok depan + gerbang berlampu
  box(10, .9, .5, M.batu, -9, .45, 15.2); box(10, .9, .5, M.batu, 9, .45, 15.2);
  [-3.6, 3.6].forEach(x => { box(.9, 2.4, .9, M.batu, x, 1.2, 15.2); const lam = box(.5, .5, .5, new THREE.MeshBasicMaterial({ color: 0xffd08a }), x, 2.65, 15.2); lam.castShadow = false; API.push({ x, y: 2.65, z: 15.2, s: .5, lampu: 1 }); });
  // 4 tungku api di pojok lapangan
  [[-8.9, -5.6], [8.9, -5.6], [-9.6, 7.6], [9.6, 7.6]].forEach(p => {
    box(1.3, .5, 1.3, M.batu, p[0], .25, p[1]); cyl(.55, .35, .45, M.hitam, p[0], .72, p[1]);
    API.push({ x: p[0], y: 1, z: p[1], s: 1 });
  });
  // pepohonan gelap di luar sekolah
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, r = rnd(30, 42); const t = new THREE.Mesh(new THREE.ConeGeometry(rnd(2, 4), rnd(7, 12), 6), new THREE.MeshLambertMaterial({ color: 0x1c2418 })); t.position.set(Math.cos(a) * r, 4, Math.sin(a) * r - 4); scene.add(t); }
}
let BENDERA = null;
const API = [];   // titik api: tungku & lampu

function gedung(panjang, x, z, rotY) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  const d = 6, h = 3.2;
  box(panjang, h, d - 2, M.dinding, 0, h / 2, -1, g);                      // ruang kelas
  box(panjang + .6, .35, d, M.batu, 0, .17, 0, g);                         // lantai teras
  for (let i = 0; i <= Math.round(panjang / 3.4); i++) {                  // tiang teras
    const px = -panjang / 2 + i * (panjang / Math.round(panjang / 3.4)); cyl(.14, .16, h, M.hijau, px, h / 2 + .3, 2.6, g, 8);
  }
  for (let px = -panjang / 2 + 1.6; px < panjang / 2 - 1; px += 3.4) {     // jendela menyala & pintu
    const j = box(1.3, .9, .06, M.jendela, px, 2.05, 1.02, g); j.castShadow = false;
    box(1.45, .08, .1, M.krem, px, 1.56, 1.04, g);
    if (Math.round((px + panjang / 2) / 3.4) % 3 === 1) box(.95, 2.1, .08, M.pintu, px + 1.7, 1.15, 1.03, g);
  }
  // atap pelana genteng
  const sh = new THREE.Shape(); sh.moveTo(-d / 2 - .9, 0); sh.lineTo(0, 2.3); sh.lineTo(d / 2 + .9, 0); sh.lineTo(-d / 2 - .9, 0);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: panjang + 1.2, bevelEnabled: false });
  geo.translate(0, 0, -(panjang + 1.2) / 2); geo.rotateY(Math.PI / 2);
  const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * .25, uv.getY(i) * .5);
  const atap = new THREE.Mesh(geo, M.genteng); atap.position.set(0, h + .3, 0); atap.castShadow = atap.receiveShadow = true; g.add(atap);
  return g;
}
function pohon(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  cyl(.16, .24, 2.4, M.batang, 0, 1.2, 0, g, 7);
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(.8, 1.25), 0), M.daun[i % 3]);
    m.position.set(rnd(-.8, .8), rnd(2.4, 3.6), rnd(-.8, .8)); m.castShadow = true; g.add(m);
  }
  box(1.1, .45, 1.1, M.batu, 0, .22, 0, g);

  ['bA', 'b1', 'b2', 'b3'].forEach((id, i) => { const b = $('#' + id), c = P.cd[i], v = c > 0 ? Math.ceil(c) : 0; b.querySelector('.cd').style.background = c > 0 ? `conic-gradient(#000c ${c / CD_MAX[i]}turn,#0006 0)` : ''; b.querySelector('em').textContent = c > .5 && i ? v : ''; });
}

// ================== KAMERA ==================
const camPos = new THREE.Vector3(), camLihat = new THREE.Vector3();
function updKamera(dt) {
  const tg = P.root.position.clone().setY(.8), off = innerWidth < innerHeight ? CAM_OFF.clone().multiplyScalar(1.25) : CAM_OFF;
  camLihat.lerp(tg, Math.min(1, dt * 6)); camPos.copy(camLihat).add(off);
  if (goyang > 0) { goyang -= dt; camPos.x += rnd(-1, 1) * goyang * .6; camPos.y += rnd(-1, 1) * goyang * .6; }
  camera.position.copy(camPos); camera.lookAt(camLihat);
}

// ================== DUEL LAWAN OCONG BOT ==================
let BOT = null, SELESAI = false;
const barPemain = document.createElement('div'); barPemain.className = 'hp me'; barPemain.innerHTML = '<i></i>'; barPemain.style.display = 'none'; $('#bars').appendChild(barPemain);
function kenaPemain(dmg, dari, dorong = 3) {
  if (P.state === 'kalah' || SELESAI) return;
  P.hp = Math.max(0, P.hp - dmg);
  const d = P.root.position.clone().sub(dari).setY(0); if (d.lengthSq() > 1e-4) P.root.position.addScaledVector(d.normalize(), dorong * .12);
  angka(P.root.position, dmg, '#ff5a5a'); goyang = Math.max(goyang, .2); hentiSejenak = Math.max(hentiSejenak, .06);
  if (P.hp <= 0) selesai('kalah');
}
function selesai(hasil) {
  if (SELESAI) return; SELESAI = true;
  if (hasil === 'kalah') { P.state = 'kalah'; K.bidik = false; if (P.act.kalah) { P.cur = ''; main('kalah', .1); } else main('diam', .2); if (HERO === 'kunti') kuntiTembus(.4); }
  setTimeout(() => { const t = $('#hasilT'); t.textContent = hasil === 'menang' ? 'MENANG!' : 'KALAH'; t.className = hasil; $('#hasil').classList.add('on'); }, 1200);
}
function mainLagi() {
  SELESAI = false; $('#hasil').classList.remove('on'); K.terbangT = 0; K.lesat = 0;
  P.hp = 1000; P.state = 'bebas'; P.cd = [0, 0, 0, 0]; P.cur = ''; main('diam', .1); P.root.position.set(0, 0, 4); P.arah = Math.PI; P.root.rotation.y = Math.PI;
  if (HERO === 'kunti') kuntiTembus(1);
  if (BOT) BOT.reset();
}
$('#lagi').onclick = mainLagi;
function updBarPemain() {
  if (!BOT) return; const [x, y, ok] = layar(V.copy(P.root.position).setY(P.root.position.y + 2.35));
  barPemain.style.display = ok ? '' : 'none'; barPemain.style.left = x + 'px'; barPemain.style.top = y + 'px'; barPemain.firstChild.style.width = P.hp / 10 + '%';
}
async function siapkanBot() {
  const bar = document.createElement('div'); bar.className = 'hp lawan'; bar.innerHTML = '<i></i>'; $('#bars').appendChild(bar);
  BOT = await buatBotOcong({
    scene, model: 'model-3d/skinocong.glb', tinggi: TINGGI, pemain: P, kenaPemain,
    pemainAktif: () => P.state !== 'kalah',
    batasi: v => { v.x = THREE.MathUtils.clamp(v.x, BATAS.x0, BATAS.x1); v.z = THREE.MathUtils.clamp(v.z, BATAS.z0, BATAS.z1); return v; },
    skala: () => 1, jarak: 1, cepat: 1,
    efek: { gelombang, percik, kilat, goyang: v => { goyang = Math.max(goyang, v); } },
    rapikanKlip, bar, posAwal: new THREE.Vector3(0, 0, -4), selesai,
  });
  MUSUH.push(BOT.mt);
  P.arah = Math.PI; P.root.rotation.y = Math.PI;   // pemain menghadap lawan
}

// ================== MULAI ==================
const bar = $('#load .bar u');
function prog(x) { bar.style.width = Math.round(x * 100) + '%'; }
async function mulai() {
  buatArena(); siapkanApi();
  if (LAWAN === 'boneka') [[-4, -2], [4, -1], [0, 6]].forEach(p => buatMusuh(p[0], p[1]));
  let lv = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 1 : 2; try { const s = localStorage.getItem('uji3dKual'); if (s !== null) lv = +s; } catch (e) { }
  setKual(lv);
  try { await Promise.all([muatBoneka(prog), muatEfek()]); if (LAWAN === 'ocong') await siapkanBot(); }
  catch (e) { $('#load b').textContent = 'Model tidak bisa dimuat'; $('#lmsg').textContent = 'Pastikan file ' + MODEL + ' sudah diunggah satu folder dengan halaman ini.'; return; }
  camLihat.copy(P.root.position).setY(.8);
  $('#load').classList.add('off');
  let last = performance.now(), fN = 0, fT = 0, t0 = 0;
  renderer.setAnimationLoop(now => {
    let dt = Math.min(.05, (now - last) / 1000); last = now; t0 += dt;
    fN++; fT += dt; if (fT > .5) { $('#fps').textContent = Math.round(fN / fT) + ' fps · ' + ['Rendah', 'Sedang', 'Tinggi'][KUAL.lv]; fN = 0; fT = 0; }
    if (hentiSejenak > 0) { hentiSejenak -= dt; dt *= .15; }   // hit-stop: terasa "berat" saat kena
    updPemain(dt); updMusuh(dt); if (BOT) BOT.upd(dt); updEfek(dt); updApi(t0, dt); updKamera(dt); updLabel(dt); updBarPemain();
    if (KUAL.bloom && composer) composer.render(); else renderer.render(scene, camera);
  });
}
mulai();
</script>
