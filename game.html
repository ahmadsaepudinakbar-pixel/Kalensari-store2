<html lang="id"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--red:#c1121f;--gold:#ffb703;--ink:#f2efe9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#03050b;color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.d,h1,h2,em,.bar b,.mid span{font-family:'Permanent Marker',Impact,'Arial Black',sans-serif;font-weight:400}
#wrap{position:relative;width:min(100vw,200vh);aspect-ratio:2/1;container-type:size;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;background:#050813d9;font-size:2.2cqw;text-align:center}
.scr.on{display:flex}
h1{margin:0;font-size:8.5cqw;line-height:.95;color:#e8e8ee;transform:rotate(-3deg)}
h1 i{display:block;color:var(--red);font-style:normal;text-shadow:.3cqw .3cqw 0 #fff3}
h2{margin:0;font-size:3.6cqw;color:#fff;background:var(--red);padding:.3cqw 3cqw;transform:skewX(-12deg)}
.btn{font:inherit;font-size:2.4cqw;color:var(--ink);background:#101a33;border:.3cqw solid #2c3f73;padding:.7cqw 7cqw;border-radius:.8cqw;cursor:pointer;pointer-events:auto}
.btn.g{background:var(--gold);color:#201400;border-color:#ffd166;font-weight:700}
small{font-size:1.5cqw;color:#9aa3b8}
#grid{display:grid;grid-template-columns:repeat(4,13cqw);gap:1cqw}
.card{background:#0e1526;border:.3cqw solid #2a3350;padding:.7cqw;font-size:1.7cqw;cursor:pointer}
.card i{display:block;width:5cqw;height:5cqw;border-radius:50%;margin:0 auto .4cqw;box-shadow:inset -.5cqw -.5cqw 1cqw #0008}
.card.sel{border-color:var(--gold);box-shadow:0 0 1.6cqw #ffb70388}
.card.off{opacity:.45}
#bat{background:none;justify-content:flex-start;pointer-events:none}
#hud{position:absolute;top:1.5cqw;left:2cqw;right:2cqw;display:flex;align-items:center;gap:2cqw}
.pl{flex:1}.pl b{font-size:2.8cqw}.pl.r{text-align:right}
.bar{display:block;height:2.6cqw;background:#2a0a0f;border:.25cqw solid var(--red);position:relative;transform:skewX(-18deg)}
.bar u{display:block;height:100%;width:100%;background:#4cc23a;transition:width .15s}
.pl.r .bar u{margin-left:auto}
.bar span{position:absolute;inset:0;font-size:1.8cqw;line-height:2.4cqw}
.mid{text-align:center}.mid em{display:block;font-size:6cqw;line-height:1;color:#ff8c1a;font-style:normal}.mid span{font-size:2.8cqw}
#joy{position:absolute;left:3cqw;bottom:3cqw;width:20cqw;height:20cqw;border-radius:50%;border:.5cqw solid #8a93a8aa;background:#1b223466;pointer-events:auto}
#knob{position:absolute;inset:0;margin:auto;width:8cqw;height:8cqw;border-radius:50%;background:radial-gradient(#c4c8d2,#6b7180)}
#btns{position:absolute;right:2cqw;bottom:2cqw;width:32cqw;height:30cqw;pointer-events:none}.rw{display:contents}#btns button{position:absolute;pointer-events:auto}#btns #bA{right:0;bottom:0;width:13cqw;height:13cqw}#btns #bS1{right:15cqw;bottom:0}#btns #bS2{right:11.5cqw;bottom:10cqw}#btns #bS3{right:1.5cqw;bottom:15cqw}#bB{display:none!important}
#btns button{width:9cqw;height:9cqw;opacity:.92;border-radius:50%;border:.5cqw solid;font:inherit;font-size:1.3cqw;line-height:1.1;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
#btns b{font-size:3cqw;line-height:1.1}
#bA{background:#5a0f12;border-color:#ff3b30}#bB{background:#0b2a5a;border-color:#2e8bff}#bS1,#bS2,#bS3{background:#2f0f5a;border-color:#9b5de5}
#win h2{font-size:7cqw;background:none;color:var(--red);transform:rotate(-3deg);text-shadow:.3cqw .3cqw 0 #fff4}

function hurt(o,d,f){if(o.hp<=0||o.inv>0)return;const b=o.blk&&((f.x>o.x)==(o.f>0));if(b)d*=.15;o.hp=Math.max(0,o.hp-d);if(!o.hp)died(o,f);o.flash=8;o.kb=8;o.vy=0;o.vx=(o.x>f.x?1:-1)*(b?2:6)}
function step(f,o,k){
 if(f.stun>0){f.stun--;k={l:0,r:0,u:0,a:0,b:0,s:0}}if(f.inv>0)f.inv--;if(f.hp<=0){f.vx*=.9;f.vy=0;if(--f.rs<=0){f.hp=f.mhp;f.mp=100;f.x=f.bot?WW-260:260;f.y=LY;f.vx=0;f.inv=120}}else{
  {const t=tg(f,o);f.f=t?(t.x>f.x?1:-1):(k.r?1:k.l?-1:f.f)}f.blk=false;
  if(f.dash>0){f.dash--;f.vx=f.f*12;f.vy=Math.max(-5,Math.min(5,(o.y-f.y)*.2));if(!f.dh&&Math.abs(o.x-f.x)<65&&Math.abs(o.y-f.y)<32){f.dh=1;hurt(o,140,f)}}
  else if(f.fl>0){f.fl--;f.blk=false;f.vx=f.f*5.5;f.vy=Math.max(-3,Math.min(3,(o.y-f.y)*.15));if(f.fl<20&&!f.fh&&Math.abs(o.x-f.x)<60&&Math.abs(o.y-f.y)<32){f.fh=1;hurt(o,110,f)}}
  else if(f.kb>0)f.kb--;
  else{f.vx=((k.r?1:0)-(k.l?1:0))*f.c.spd;f.vy=((k.d?1:0)-(k.u?1:0))*f.c.spd*.85;
   
   if(k.a&&f.ac<=0&&!f.blk){f.atk=14;f.ac=26}
   if(k.s&&f.cds[k.s-1]<=0&&f.mp>=30*k.s&&f.atk<=0&&!f.blk){f.mp-=30*k.s;const s=f.c.sk[k.s-1];f.cds[k.s-1]=s.cd;cast(f,o,s.k)}}
  if(f.atk===8&&!f.sc){const t=tg(f,o);if(t)dmg(t,f.c.atk*(1+.12*(f.lv-1)+f.gold/4000),f)}
  if(f.atk>0&&--f.atk===0)f.sc=0;
  if(f.ac>0)f.ac--;f.mp=Math.min(100,f.mp+.04);f.cds=f.cds.map(c=>c>0?c-1:0);if(f.flash>0)f.flash--}

function cast(f,o,t){
 if(t=='dash'){f.dash=18;f.dh=0}
 else if(t=='grab'){f.atk=14;f.sc=1;if(Math.abs(o.x-f.x)<125&&Math.abs(o.y-f.y)<32){hurt(o,80,f);o.stun=70;o.kb=0}}
 else if(t=='vanish'){f.inv=80;f.y=o.y;f.x=Math.max(60,Math.min(WW-60,o.x+(f.x<o.x?75:-75)));f.ac=0}
 else if(t=='spirit'){f.atk=14;f.sc=1;pj.push({x:f.x,y:f.y-70,vx:0,o:f,d:28,l:300,sp:1,hc:0})}
 else if(t=='fly'){f.fl=45;f.fh=0;f.inv=30}
 else{f.atk=14;f.sc=1;const a=Math.atan2(o.y-f.y,o.x-f.x);pj.push({x:f.x+Math.cos(a)*40,y:f.y-60+Math.sin(a)*40,vx:Math.cos(a)*9,vy:Math.sin(a)*9,o:f,d:130,l:90})}}
const sd=f=>f.bot?-1:1,hs=f=>f.id?f:f.s>0?P:E;
