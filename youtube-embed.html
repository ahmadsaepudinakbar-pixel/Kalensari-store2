<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halaman video YouTube">
  <title>Video YouTube</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ee;
      --card: #ffffff;
      --text: #252525;
      --accent: #c62828;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      background: var(--accent);
      color: #fff;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
    }

    header p {
      margin: 0;
      opacity: 0.95;
    }

    main {
      width: min(100% - 32px, 1000px);
      margin: 32px auto;
    }

    .video-card {
      background: var(--card);
      padding: clamp(16px, 3vw, 28px);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
    }

    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-card h2 {
      margin: 20px 0 8px;
      font-size: 1.35rem;
    }

    .video-card p {
      margin: 0;
      line-height: 1.6;
      color: #555;
    }

    .open-youtube {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 16px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .open-youtube:hover { background: #a91f1f; }

    footer {
      padding: 20px 16px;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Video YouTube</h1>
    <p>Tonton video langsung dari halaman ini</p>
  </header>

  <main>
    <section class="video-card" aria-labelledby="video-title">
      <div class="video-frame">
        <iframe
          src="https://www.youtube.com/embed/yWlpCdoXTpY"
          title="Video YouTube"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <h2 id="video-title">Video pilihan</h2>
      <p>Video YouTube ditampilkan langsung di halaman ini. Tekan tombol putar pada video untuk mulai menonton.</p>
      <a class="open-youtube"
         href="https://www.youtube.com/watch?v=yWlpCdoXTpY"
         target="_blank"
         rel="noopener noreferrer">Buka di YouTube</a>
    </section>
  </main>

  <footer>
    &copy; 2026 Halaman Video YouTube
  </footer>
</body>
</html>
