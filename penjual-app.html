<style>

.ln{display:flex;justify-content:space-between;padding:4px 0}.ph0{width:100%;height:150px;border-radius:14px;background:#fff;border:1px dashed var(--ln);object-fit:cover;display:grid;place-items:center;margin-bottom:12px;cursor:pointer;font-size:34px}
#dr{position:absolute;inset:0;background:#0007;z-index:20}#dr>div{width:78%;height:100%;background:#fff;overflow:auto}#dr .h{background:var(--bg);padding:20px 16px;font-weight:700}#dr a,#dr button.m{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 18px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}

</style></head><body>
<section id="auth"><div class="logo">KS</div><h1>Kalensari Store</h1><p>Bersama dalam setiap manisnya hari</p>
<div id="lf" hidden style="text-align:left"><label>No. WhatsApp<input id="lw" class="fld" type="tel" inputmode="numeric" placeholder="08xxxxxxxxxx"></label><label>PIN<input id="lp" class="fld" type="password" inputmode="numeric" maxlength="8"></label><button class="btn" id="go">Masuk</button></div>
<button class="btn" id="bm">Masuk</button><a class="btn o" href="penjual.html">Daftar</a><p style="margin-top:20px;font-size:13px">Aplikasi Penjual - Kalensari Store</p></section>
<div id="app" hidden><header id="hd"></header><main id="v"></main><nav id="nav"></nav><div id="dr" hidden></div></div><div id="toast"></div>
<script src="config.js" onerror="void 0"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),rp=n=>"Rp "+Number(n||0).toLocaleString("id-ID"),K=s=>String(s||"").trim().toLowerCase();
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("s");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("s"),3000)};
const cloud=()=>window.CLOUD_CONFIG&&CLOUD_CONFIG.enabled&&CLOUD_CONFIG.supabaseUrl&&CLOUD_CONFIG.supabaseAnonKey;
async function cf(p,o={}){const r=await fetch(String(CLOUD_CONFIG.supabaseUrl).replace(/\/$/,"")+"/rest/v1/"+p,{...o,headers:{apikey:CLOUD_CONFIG.supabaseAnonKey,Authorization:"Bearer "+CLOUD_CONFIG.supabaseAnonKey,"Content-Type":"application/json",...(o.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(t||r.status);return t?JSON.parse(t):[]}
const LG=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v}catch{return d}},LS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
async function getS(k,d){if(cloud()){const r=await cf("store_settings?select=value&key=eq."+encodeURIComponent(k));return r[0]&&r[0].value!=null?r[0].value:d}return LG("kalensari_"+k,d)}
async function hashPin(wa,pin){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("kalensari-penjual:"+wa+":"+pin));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const norm=v=>String(v||"").replace(/\D/g,"").replace(/^0/,"62"),SESS="kalensari_penjual_sess";
const STL={menunggu:"Menunggu",diproses:"Diproses",dikirim:"Dikirim",selesai:"Selesai",dibatalkan:"Ditolak"},SI={menunggu:"⏳",diproses:"🔵",dikirim:"🚚",selesai:"✅",dibatalkan:"✖️"};
let me=null,WA=localStorage.getItem(SESS),P=[],O=[],cats=[],view="home",arg=null,fo="semua",pc="Semua",q="",known=null;
const mine=s=>String(s||"").split(",").some(x=>K(x)===K(me.toko||me.usaha));
const LIMIT=15,base=o=>!o.status||o.status==="baru"?"menunggu":o.status,exp=o=>new Date(o.created_at).getTime()+LIMIT*60000,stOf=o=>base(o)==="menunggu"&&exp(o)<=Date.now()?"dibatalkan":base(o),mineItems=o=>(o.items||[]).filter(p=>mine(p.seller)),isOnly=o=>mineItems(o).length===(o.items||[]).length;
const tot=o=>{const m=mineItems(o),s=m.reduce((t,p)=>t+(p.sale||p.price||0)*p.qty,0);return isOnly(o)?Number(o.total||s):s};
/* auth */
$("bm").onclick=()=>{$("lf").hidden=false;$("bm").hidden=true};
$("go").onclick=async()=>{const wa=norm($("lw").value),pin=$("lp").value;if(!wa||!pin)return toast("Isi nomor WhatsApp dan PIN");try{const acc=await getS("penjual_accounts",{}),a=acc[wa];if(!a||a.h!==await hashPin(wa,pin))return toast("Nomor atau PIN salah");localStorage.setItem(SESS,wa);WA=wa;boot()}catch(e){toast(e.message)}};
async function boot(){const acc=await getS("penjual_accounts",{}),a=acc[WA];if(!a)throw 0;const l=await getS("penjual_members",[]);me=(Array.isArray(l)?l:[]).find(x=>x.id===a.id)||{id:a.id};me.wa=WA;$("auth").hidden=true;$("app").hidden=false;await load();go("home");setInterval(()=>load(true),25000)}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[[0,880],[.2,1175]].forEach(([t,f])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.25);o.start(c.currentTime+t);o.stop(c.currentTime+t+.26)})}catch{}}
async function load(poll){try{const [pr,or,ct]=await Promise.all([cloud()?cf("products?select=*&order=id.desc"):LG("kalensari_products",[]),cloud()?cf("orders?select=id,order_code,created_at,items,status,total,shipping&order=created_at.desc&limit=200"):LG("kalensari_orders",[]),getS("categories",[])]);P=pr.filter(p=>mine(p.seller));O=or.filter(o=>mineItems(o).length);cats=[...new Set(["Makanan","Minuman",...(ct||[]),...pr.map(p=>p.category)].filter(Boolean))];
const codes=O.map(o=>o.order_code);if(known&&poll){const n=codes.filter(c=>!known.includes(c));if(n.length){beep();toast("🔔 "+n.length+" pesanan baru")}}known=codes;expireOld();if(poll&&["home","orders"].includes(view))go(view,arg)}catch(e){if(!poll)toast("Gagal memuat: "+(e.message||e).toString().slice(0,80))}}
const tried=new Set();async function expireOld(){for(const o of O.filter(o=>base(o)==="menunggu"&&exp(o)<=Date.now()&&isOnly(o)&&!tried.has(o.id))){tried.add(o.id);try{if(cloud())await cf("orders?id=eq."+encodeURIComponent(o.id)+"&status=in.(baru,menunggu)",{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:"dibatalkan",updated_at:new Date().toISOString()})});o.status="dibatalkan"}catch{}}}
const mmss=l=>Math.floor(l/60000)+":"+String(Math.floor(l%60000/1000)).padStart(2,"0");
setInterval(()=>{const els=[...document.querySelectorAll("[data-exp]")];if(!els.length)return;let done=false;els.forEach(e=>{const l=e.dataset.exp-Date.now();if(l<=0)done=true;else e.textContent=mmss(l)});if(done){expireOld();go(view,arg)}},1000);
/* shell */
const NAV=[["home","🏠","Beranda"],["orders","📋","Pesanan"],["prods","📦","Produk"],["menu","☰","Menu"]];
function go(v,a){if(v==="menu")return drawer();view=v;arg=a??null;const sub=["detail","form","io"].includes(v),T={home:"Kalensari Store",orders:"Daftar Pesanan",prods:"Daftar Produk",detail:"Detail Pesanan",form:a?"Edit Produk":"Tambah Produk",io:"Export / Import"};
$("hd").innerHTML=(sub?'<button id="bk">←</button>':'<button id="mn">☰</button>')+`<div class="t">${T[v]}${v==="home"?"<small>Penjual • "+esc(me.toko||me.usaha||"")+"</small>":""}</div>`;
$("hd").querySelector("button").onclick=()=>sub?go(v==="detail"?"orders":v==="form"?"prods":"home"):drawer();
$("nav").innerHTML=NAV.map(([k,i,t])=>`<button data-k="${k}" class="${k===(sub?({detail:"orders",form:"prods",io:"menu"})[v]:v)?"on":""}"><b>${i}</b>${t}</button>`).join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.k));
$("v").innerHTML=($("v").dataset.w||"")+({home,orders,prods,detail,form,io})[v]();$("v").scrollTop=0;bind[v]&&bind[v]()}
function drawer(){const d=$("dr");d.hidden=false;const L=[["home","🏠 Dashboard"],["orders","📋 Kelola Pesanan"],["form","➕ Tambah Produk"],["io","☁️ Export / Import Produk"],["prods","📦 Daftar Produk"]];d.innerHTML=`<div><div class="h"><div class="logo" style="width:60px;height:60px;font-size:20px;margin:0 0 8px">KS</div>Kalensari Store<small style="display:block;font-weight:400;color:var(--mu)">${esc(me.nama||"Penjual")} • +${esc(WA)}</small></div>${L.map(([k,t])=>`<button class="m" data-k="${k}">${t}</button>`).join("")}<a href="penjual.html">⚙️ Pengaturan toko & lokasi</a><button class="m" id="lo" style="color:#b83c2b">🚪 Keluar</button></div>`;d.onclick=e=>{if(e.target===d)d.hidden=true};d.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{d.hidden=true;go(b.dataset.k)});$("lo").onclick=()=>{localStorage.removeItem(SESS);location.reload()}}
const bind={};
/* beranda */
function home(){const c=s=>O.filter(o=>stOf(o)===s).length,td=O.filter(o=>new Date(o.created_at).toDateString()===new Date().toDateString()),om=td.filter(o=>stOf(o)!=="dibatalkan").reduce((t,o)=>t+tot(o),0);
return `${me.pending?'<div class="warn">⏳ Akun menunggu persetujuan admin.</div>':""}${cloud()?"":'<div class="warn">⚠️ Database online belum aktif (mode uji coba).</div>'}<h2 style="margin:4px 0">Halo, ${esc(me.nama||"Penjual")} 👋</h2><p style="margin:0 0 12px;color:var(--mu)">Semangat terus mengelola toko ${esc(me.toko||"")}!</p>
<div class="stats">${["menunggu","diproses","dikirim","selesai"].map(s=>`<div>${SI[s]}<b>${c(s)}</b>${STL[s]}</div>`).join("")}</div><h3>Ringkasan Hari Ini</h3><div class="two"><div class="card"><small>Total Pesanan</small><b>${td.length}</b></div><div class="card"><small>Omset Hari Ini</small><b>${rp(om)}</b></div></div>
<h3>Menu Cepat</h3><div class="two">${[["form","➕","Tambah Produk"],["prods","📦","Daftar Produk"],["orders","📋","Kelola Pesanan"],["io","☁️","Export / Import"]].map(([k,i,t])=>`<div class="q" data-k="${k}"><i>${i}</i>${t}</div>`).join("")}</div>`}
bind.home=()=>document.querySelectorAll(".q").forEach(e=>e.onclick=()=>go(e.dataset.k));
/* pesanan */
function orders(){const l=O.filter(o=>(fo==="semua"||stOf(o)===fo)&&(!q||String(o.order_code).toLowerCase().includes(q.toLowerCase())));
return `<div class="chips">${["semua",...Object.keys(STL)].map(s=>`<button data-f="${s}" class="${s===fo?"on":""}">${s==="semua"?"Semua":STL[s]}</button>`).join("")}</div><input id="sq" class="fld" style="margin-top:0" placeholder="🔍 Cari nomor pesanan..." value="${esc(q)}">${l.length?l.map(o=>`<div class="row" data-id="${esc(o.id)}"><div class="g"><b>${esc(o.order_code)}</b><small>${new Date(o.created_at).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}</small><small>${mineItems(o).length} produk | ${rp(tot(o))}</small>${stOf(o)==="menunggu"?`<small style="color:#9a5a00">⏱ Sisa <b data-exp="${exp(o)}">${mmss(Math.max(0,exp(o)-Date.now()))}</b></small>`:""}</div><span class="pill ${stOf(o)}">${STL[stOf(o)]||stOf(o)}</span>›</div>`).join(""):'<p style="color:var(--mu);text-align:center;margin-top:30px">Belum ada pesanan.</p>'}`}
bind.orders=()=>{document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fo=b.dataset.f;go("orders")});$("sq").onchange=e=>{q=e.target.value;go("orders")};document.querySelectorAll(".row").forEach(r=>r.onclick=()=>go("detail",r.dataset.id))};
const gO=id=>O.find(o=>String(o.id)===String(id));
function detail(){const o=gO(arg);if(!o)return"<p>Pesanan tidak ditemukan.</p>";const s=stOf(o),m=mineItems(o);
return `<div style="display:flex;justify-content:space-between"><div><b style="font-size:19px">${esc(o.order_code)}</b><small style="display:block;color:var(--mu)">${new Date(o.created_at).toLocaleString("id-ID")}</small></div><span class="pill ${s}" style="align-self:start">${STL[s]||s}</span></div>
<h3>Daftar Produk</h3><div class="card">${m.map(p=>`<div class="ln"><span>${esc(p.name)} ×${p.qty}</span><b>${rp((p.sale||p.price||0)*p.qty)}</b></div>`).join("")}<div class="ln" style="border-top:1px solid var(--ln);margin-top:6px;padding-top:8px"><b>Total Pesanan</b><b>${rp(tot(o))}</b></div></div>
${!isOnly(o)?'<p class="warn" style="margin-top:12px">Pesanan gabungan beberapa toko: diproses oleh admin.</p>':s==="menunggu"?`<p class="warn" style="margin-top:12px">⏱ Sisa waktu menanggapi: <b data-exp="${exp(o)}">${mmss(Math.max(0,exp(o)-Date.now()))}</b>. Jika lewat ${LIMIT} menit, pesanan ditolak otomatis.</p><button class="btn" id="ac">Terima & Proses Pesanan</button><button class="btn d" id="rj">Tolak Pesanan</button>`:`<p class="warn" style="margin-top:12px">${({diproses:"Pesanan diterima. Selanjutnya kurir yang mengantar dan mengubah status.",dikirim:"Pesanan sedang diantar kurir.",selesai:"Pesanan selesai diantar.",dibatalkan:"Pesanan ditolak (atau waktu menanggapi habis)."})[s]||""}</p>`}`}
async function setSt(id,s){try{const b={status:s,updated_at:new Date().toISOString()};if(cloud())await cf("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});else LS("kalensari_orders",LG("kalensari_orders",[]).map(o=>String(o.id)===String(id)?{...o,...b}:o));Object.assign(gO(id),b);toast("✅ Status: "+STL[s]);return true}catch(e){toast("Gagal: "+(e.message||e).toString().slice(0,80))}}
bind.detail=()=>{$("ac")&&($("ac").onclick=async()=>{if(exp(gO(arg))<=Date.now()){toast("Waktu menanggapi sudah habis");return go("detail",arg)}if(await setSt(arg,"diproses"))go("detail",arg)});$("rj")&&($("rj").onclick=async()=>{if(confirm("Tolak pesanan ini? Tindakan ini tidak bisa dibatalkan.")&&await setSt(arg,"dibatalkan"))go("detail",arg)})};
/* produk */
const PS=p=>p.status==="Show"?"on":"off";
function prods(){const l=P.filter(p=>(pc==="Semua"||p.category===pc)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
return `<input id="sq" class="fld" style="margin-top:0" placeholder="🔍 Cari produk..." value="${esc(q)}"><div class="chips">${["Semua",...new Set(P.map(p=>p.category).filter(Boolean))].map(c=>`<button data-c="${esc(c)}" class="${c===pc?"on":""}">${esc(c)}</button>`).join("")}</div>${l.length?l.map(p=>`<div class="row" data-id="${p.id}">${p.image?`<img src="${esc(p.image)}" alt="">`:'<div class="ph">🍪</div>'}<div class="g"><b>${esc(p.name)}</b><small>${rp(p.sale||p.price)}</small><small>${p.stock!=null?"Stok: "+p.stock:esc(p.unit||"")}${p.status==="Sold Out"?" • Habis":""}</small></div><label class="sw"><input type="checkbox" ${p.status==="Show"||p.status==="Sold Out"?"checked":""}><span></span></label></div>`).join(""):'<p style="color:var(--mu);text-align:center;margin-top:30px">Belum ada produk. Tekan + untuk menambah.</p>'}<button class="fab" id="fb">+</button>`}
bind.prods=()=>{$("sq").onchange=e=>{q=e.target.value;go("prods")};document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{pc=b.dataset.c;go("prods")});$("fb").onclick=()=>go("form");document.querySelectorAll(".row").forEach(r=>{r.onclick=()=>go("form",r.dataset.id);const c=r.querySelector("input");r.querySelector(".sw").onclick=e=>e.stopPropagation();c.onchange=async()=>{const p=P.find(x=>String(x.id)===r.dataset.id),st=c.checked?(p.stock===0?"Sold Out":"Show"):"Hidden";try{await cf("products?id=eq."+p.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:st})});p.status=st;toast(c.checked?"Produk ditampilkan":"Produk disembunyikan")}catch(e){c.checked=!c.checked;toast("Gagal: "+(e.message||e).toString().slice(0,80))}}})};
let img=null;
function form(){const p=arg?P.find(x=>String(x.id)===String(arg)):{};img=p.image||null;return `<div class="ph0" id="ft" ${img?`style="background:url('${esc(img)}') center/cover"`:""}>${img?"":"📷"}</div><input type="file" id="ff" accept="image/*" hidden><label>Nama Produk *<input id="fn" class="fld" value="${esc(p.name||"")}"></label><div class="two"><label>Harga *<input id="fh" class="fld" type="number" inputmode="numeric" value="${p.price??""}"></label><label>Stok *<input id="fs" class="fld" type="number" inputmode="numeric" value="${p.stock??""}"></label></div><label>Kategori *<input id="fk" class="fld" list="cl" value="${esc(p.category||"")}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label><label>Satuan<input id="fu" class="fld" placeholder="mis. 1 porsi" value="${esc(p.unit||"")}"></label><label>Deskripsi<textarea id="fd" class="fld">${esc(p.description||"")}</textarea></label><button class="btn" id="fv">Simpan</button>${arg?'<button class="btn d" id="fx">Hapus Produk</button>':""}`}
bind.form=()=>{$("ft").onclick=()=>$("ff").click();$("ff").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const r=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.8);$("ft").style.background=`url(${img}) center/cover`;$("ft").textContent=""};im.src=URL.createObjectURL(f)};
$("fv").onclick=async()=>{const name=$("fn").value.trim(),price=Math.round(Number($("fh").value)),stock=$("fs").value===""?NaN:Math.round(Number($("fs").value)),category=$("fk").value.trim();if(!name||!(price>=0)||$("fh").value===""||isNaN(stock)||!category)return toast("Nama, harga, stok, dan kategori wajib diisi");
const old=arg?P.find(x=>String(x.id)===String(arg)):null,row={name,price,stock,category,unit:$("fu").value.trim()||"1 porsi",description:$("fd").value.trim(),image:img,seller:old?old.seller:(me.toko||me.usaha),status:stock===0?"Sold Out":(old&&old.status==="Hidden"?"Hidden":"Show")};
const save=async r=>old?cf("products?id=eq."+old.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(r)}):cf("products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:Date.now(),...r})});
try{try{await save(row)}catch(e){if(!/stock|description/.test(e.message))throw e;const{stock:_s,description:_d,...r2}=row;await save(r2);toast("Jalankan SQL supabase-penjual-app.sql agar stok & deskripsi tersimpan")}await load();toast("✅ Produk disimpan");go("prods")}catch(e){toast("Gagal: "+(e.message||e).toString().slice(0,80))}};
$("fx")&&($("fx").onclick=async()=>{if(!confirm("Hapus produk ini?"))return;try{await cf("products?id=eq."+arg,{method:"DELETE"});await load();toast("Produk dihapus");go("prods")}catch(e){toast("Gagal: "+e.message)}})};
/* export / import */
function io(){return `<div class="card"><b>⬇️ Export produk</b><p style="color:var(--mu);margin:4px 0">Unduh ${P.length} produk toko Anda sebagai file CSV (bisa dibuka di Excel).</p><button class="btn" id="ex">Export CSV</button></div><div class="card" style="margin-top:12px"><b>⬆️ Import produk</b><p style="color:var(--mu);margin:4px 0">Kolom: nama,harga,stok,kategori,satuan,deskripsi. Nama yang sama akan diperbarui, yang baru ditambahkan.</p><input type="file" id="im" accept=".csv,text/csv" hidden><button class="btn o" id="ib">Pilih file CSV</button></div>`}
const csvParse=t=>{const R=[];let r=[],c="",inq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}else if(ch=='"')inq=true;else if(ch==","||ch==";"){r.push(c);c=""}else if(ch=="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!="\r")c+=ch}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))};
bind.io=()=>{$("ex").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',t=["nama,harga,stok,kategori,satuan,deskripsi",...P.map(p=>[p.name,p.price,p.stock??"",p.category,p.unit,p.description].map(q).join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="produk-"+K(me.toko).replace(/\W+/g,"-")+".csv";a.click()};
$("ib").onclick=()=>$("im").click();$("im").onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=csvParse(await f.text()).slice(1);let n=0,u=0;try{for(const r of rows){const name=(r[0]||"").trim(),price=Math.round(Number(r[1])),stock=r[2]===""||r[2]==null?null:Math.round(Number(r[2]));if(!name||isNaN(price))continue;const o=P.find(p=>K(p.name)===K(name)),b={name,price,stock,category:(r[3]||"").trim()||"Makanan",unit:(r[4]||"").trim()||"1 porsi",description:(r[5]||"").trim()};if(o){await cf("products?id=eq."+o.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});u++}else{await cf("products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:Date.now()+n,...b,seller:me.toko||me.usaha,status:b.stock===0?"Sold Out":"Show"})});n++}}await load();toast(`✅ ${n} ditambah, ${u} diperbarui`);go("prods")}catch(e){toast("Gagal import: "+(e.message||e).toString().slice(0,80))}}};
(async()=>{if(WA){try{await boot()}catch{localStorage.removeItem(SESS)}}})();
</script></body></html>
