async function muatJadwal(){const [a,b,c]=await Promise.all([getS("seller_schedule",{}),getS("closed_sellers",{}),getS("tutup_toko",{})]);JAD={sched:ob(a),closed:ob(b),tutup:ob(c),t:Date.now()}}
const tM=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(t||""));return m?+m[1]*60+ +m[2]:null};

/* ===== STOK OTOMATIS =====

let STOKLOG=null;const STOK_MENIPIS=3;

async function stokUbah(o,arah){const q=new Map();mineItems(o).forEach(p=>{if(p.id==null)return;const k=String(p.id);q.set(k,(q.get(k)||0)+(Number(p.qty)||1))});

    if(cloud())await cf("products?id=eq."+encodeURIComponent(r.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});

  return n}

   Dihitung dari pesanan yang sudah diterima toko (Diproses, Dikirim, Selesai). Ditolak / gagal antar tidak dihitung.

let uPer="bulan",SETQ=null;
const hargaU=p=>Number(p.sale)>0&&Number(p.sale)<Number(p.price)?Number(p.sale):Number(p.price)||0;
const barangKu=o=>mineItems(o).reduce((a,p)=>a+hargaU(p)*(Number(p.qty)||1),0);
const tglKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
function uRange(){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  return({hari:[t0,"Hari ini"],"7":[t0-6*864e5,"7 hari"],bulan:[new Date(n.getFullYear(),n.getMonth(),1).getTime(),"Bulan ini"],"30":[t0-29*864e5,"30 hari"],semua:[0,"Semua"]})}
function uang(){
  const R=uRange(),[dari]=R[uPer],inR=o=>new Date(o.created_at).getTime()>=dari;

  const cara={qris:{t:0,sudah:0},cod:{t:0,sudah:0},lain:{t:0}};
  ok.forEach(o=>{const v=barangKu(o);if(isQris(o)){cara.qris.t+=v;if(sq[o.order_code+"|t:"+k]||o.status==="selesai")cara.qris.sudah+=v}else if(isCodO(o)){cara.cod.t+=v;if(utOf(o)[k])cara.cod.sudah+=v}else cara.lain.t+=v});
  const pm=new Map();ok.forEach(o=>mineItems(o).forEach(p=>{const n=p.name||"Produk";const x=pm.get(n)||{q:0,v:0};x.q+=Number(p.qty)||1;x.v+=hargaU(p)*(Number(p.qty)||1);pm.set(n,x)}));
  const top=[...pm.entries()].sort((a,b)=>b[1].q-a[1].q).slice(0,5);
  const hariN=uPer==="hari"?1:uPer==="7"?7:uPer==="bulan"?new Date().getDate():30,hm=new Map();

return `<input id="sq" class="fld" style="margin-top:0" placeholder="🔍 Cari produk..." value="${esc(q)}"><small style="display:block;color:var(--mu);margin:-4px 2px 6px">⭐ = produk unggulan, tampil paling atas di toko Anda (maks ${MAX_UNG}).</small><div class="chips">${["Semua",...new Set(P.map(p=>p.category).filter(Boolean))].map(c=>`<button data-c="${esc(c)}" class="${c===pc?"on":""}">${esc(c)}</button>`).join("")}</div>${l.length?l.map(p=>`<div class="row" data-id="${p.id}">${p.image?`<img src="${esc(p.image)}" alt="">`:'<div class="ph">🍪</div>'}<div class="g"><b>${esc(p.name)}</b><small>${Number(p.sale)>0&&Number(p.sale)<Number(p.price)?`<s>${rp(p.price)}</s> <b style="color:#b8460b">${rp(p.sale)}</b> 🏷️${promoSisa(p)!==null?(promoHabis(p)?' <span style="color:#b00">(promo habis)</span>':` <span style="color:#b8460b">⏳ ${promoSisa(p)} hari lagi</span>`):""}`:rp(p.price)}${p.product_group?` • 🧩 ${esc(p.product_group)}`:""}${p.toppings?" • 🍲 racik":""}</small><small${p.stock!=null&&p.stock!==""&&Number(p.stock)<=STOK_MENIPIS?' style="color:#b8460b;font-weight:700"':""}>${p.stock!=null&&p.stock!==""?"Stok: "+p.stock:esc(p.unit||"")}${p.status==="Sold Out"?" • Habis":""}</small></div><button class="star${unggulanKu().includes(String(p.id))?" on":""}" data-star="${esc(String(p.id))}" title="Produk unggulan">⭐</button><label class="sw"><input type="checkbox" ${p.status==="Show"||p.status==="Sold Out"?"checked":""}><span></span></label></div>`).join(""):'<p style="color:var(--mu);text-align:center;margin-top:30px">Belum ada produk. Tekan + untuk menambah.</p>'}<button class="fab" id="fb">+</button>`}
bind.prods=()=>{if(!UNG)muatUng().then(()=>{if(view==="prods"&&unggulanKu().length)go("prods")}).catch(()=>{UNG={}});document.querySelectorAll("[data-star]").forEach(b=>b.onclick=async e=>{e.stopPropagation();b.disabled=true;try{await toggleUng(b.dataset.star)}catch(err){toast("Gagal: "+String(err.message||err).slice(0,60))}b.disabled=false});$("sq").onchange=e=>{q=e.target.value;go("prods")};document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{pc=b.dataset.c;go("prods")});$("fb").onclick=()=>go("form");document.querySelectorAll(".row").forEach(r=>{r.onclick=()=>go("form",r.dataset.id);const c=r.querySelector("input");r.querySelector(".sw").onclick=e=>e.stopPropagation();c.onchange=async()=>{const p=P.find(x=>String(x.id)===r.dataset.id),st=c.checked?(p.stock===0?"Sold Out":"Show"):"Hidden";try{await cf("products?id=eq."+p.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:st})});p.status=st;toast(c.checked?"Produk ditampilkan":"Produk disembunyikan")}catch(e){c.checked=!c.checked;toast("Gagal: "+(e.message||e).toString().slice(0,80))}}})};
let img=null;
function form(){const p=arg?P.find(x=>String(x.id)===String(arg)):{};img=p.image||null;return `<div class="ph0" id="ft" ${img?`style="background:url('${esc(img)}') center/cover"`:""}>${img?"":"📷"}</div><input type="file" id="ff" accept="image/*" hidden><label>Nama Produk *<input id="fn" class="fld" value="${esc(p.name||"")}"></label><div class="two"><label>Harga *<input id="fh" class="fld" type="number" inputmode="numeric" value="${p.price??""}"></label><label>Stok *<input id="fs" class="fld" type="number" inputmode="numeric" value="${p.stock??""}"></label></div><label>Harga promo <small style="color:var(--mu)">(opsional, harga coret)</small><input id="fp" class="fld" type="number" inputmode="numeric" placeholder="Kosongkan jika tidak promo" value="${Number(p.sale)>0?p.sale:""}"></label><label>Lama promo <small style="color:var(--mu)">(hari)</small><input id="fpd" class="fld" type="number" inputmode="numeric" min="1" placeholder="mis. 7 (kosongkan = tanpa batas)" value="${Number(p.sale)>0&&promoSisa(p)>0?promoSisa(p):""}"></label><label>Kategori *<input id="fk" class="fld" list="cl" value="${esc(p.category||"")}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label><label>Satuan<input id="fu" class="fld" placeholder="mis. 1 porsi" value="${esc(p.unit||"")}"></label><label>Deskripsi<textarea id="fd" class="fld">${esc(p.description||"")}</textarea></label>
<div class="sec"><b>🧩 Varian (opsional)</b><small>Produk dengan <b>Nama grup</b> yang sama tampil jadi 1 kartu dengan pilihan varian. Contoh grup "Pecel Lele", varian "Lele saja" dan "+ Nasi".</small>
<div class="two"><label>Nama grup<input id="fg" class="fld" list="gl" placeholder="mis. Pecel Lele" value="${esc(p.product_group||"")}"><datalist id="gl">${[...new Set(P.map(x=>x.product_group).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join("")}</datalist></label><label>Nama varian<input id="fvr" class="fld" placeholder="mis. + Nasi" value="${esc(p.variant||"")}"></label></div></div>
<div class="sec"><b>🍲 Topping / racik sendiri (opsional)</b><small>Kalau diisi, pembeli memilih topping sendiri (seperti seblak prasmanan). Harga di atas jadi harga dasar (isi 0 bila tidak ada).</small>
<div id="tpBox"></div><button type="button" class="btn o" id="tpAdd" style="padding:10px">+ Tambah topping</button>
<label style="display:block;margin-top:8px">Batas belanja per porsi (Rp, opsional)<input id="ftl" class="fld" type="number" inputmode="numeric" placeholder="mis. 15000" value="${p.topping_limit||""}"></label></div>
<button class="btn" id="fv">Simpan</button>${arg?'<button class="btn d" id="fx">Hapus Produk</button>':""}`}
bind.form=()=>{{const p0=arg?P.find(x=>String(x.id)===String(arg)):null;TP=parseTp(p0&&p0.toppings);tpRender();$("tpAdd").onclick=()=>{TP.push({n:"",h:"",img:""});tpRender();const l=$("tpBox").querySelectorAll("[data-tn]");l[l.length-1].focus()}}$("ft").onclick=()=>$("ff").click();$("ff").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const r=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.8);$("ft").style.background=`url(${img}) center/cover`;$("ft").textContent=""};im.src=URL.createObjectURL(f)};
$("fv").onclick=async()=>{const name=$("fn").value.trim(),price=Math.round(Number($("fh").value)),stock=$("fs").value===""?NaN:Math.round(Number($("fs").value)),category=$("fk").value.trim();if(!name||!(price>=0)||$("fh").value===""||isNaN(stock)||!category)return toast("Nama, harga, stok, dan kategori wajib diisi");
const sale=$("fp").value===""?null:Math.round(Number($("fp").value));if(sale!==null&&!(sale>0&&sale<price))return toast("Harga promo harus lebih kecil dari harga biasa");
const hari=$("fpd").value===""?null:Math.round(Number($("fpd").value));if(sale!==null&&hari!==null&&!(hari>=1&&hari<=365))return toast("Lama promo diisi 1 sampai 365 hari");
const tps=TP.filter(t=>t.n.trim()||t.h!=="");if(tps.some(t=>!t.n.trim()||t.h===""||!(Number(t.h)>=0)||/[|=]/.test(t.n)))return toast("Isi nama dan harga setiap topping (tanpa tanda | atau =)");
const tl=Math.round(Number($("ftl").value))||0,grp=$("fg").value.replace(/\s+/g," ").trim(),vr=$("fvr").value.trim();
const old=arg?P.find(x=>String(x.id)===String(arg)):null,sale_until=sale===null||hari===null?null:(old&&old.sale_until&&Number(old.sale)===sale&&promoSisa(old)===hari?old.sale_until:new Date(Date.now()+hari*864e5).toISOString()),row={name,price,stock,category,sale,sale_until,product_group:grp||null,variant:vr||null,toppings:tps.length?tps.map(t=>[t.n.trim(),Math.round(Number(t.h)),t.img].filter(x=>x!=="").join(" | ")).join("\n"):null,topping_limit:tps.length&&tl>0?tl:null,unit:$("fu").value.trim()||"1 porsi",description:$("fd").value.trim(),image:img,seller:old?old.seller:(me.toko||me.usaha),status:stock===0?"Sold Out":(old&&old.status==="Hidden"?"Hidden":"Show")};
const save=async r=>old?cf("products?id=eq."+old.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(r)}):cf("products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:Date.now(),...r})});
try{try{await save(row)}catch(e){const opt=["stock","description","product_group","variant","toppings","topping_limit","sale_until"],kena=opt.filter(c=>String(e.message).includes(c));if(!kena.length)throw e;const r2={...row};opt.forEach(c=>delete r2[c]);await save(r2);toast("⚠️ Kolom "+kena.join(", ")+" belum ada di Supabase, sebagian data belum tersimpan")}await load();toast("✅ Produk disimpan");go("prods")}catch(e){toast("Gagal: "+(e.message||e).toString().slice(0,80))}};
$("fx")&&($("fx").onclick=async()=>{if(!confirm("Hapus produk ini?"))return;try{await cf("products?id=eq."+arg,{method:"DELETE"});await load();toast("Produk dihapus");go("prods")}catch(e){toast("Gagal: "+e.message)}})};
/* topping editor (format sama dengan admin: "Nama | Harga | URL foto") */
let TP=[];
const parseTp=t=>String(t||"").split(/\r?\n/).map(l=>{const m=/^(.+?)\s*[|=]\s*(?:rp\.?\s*)?([\d.,]+)\s*(?:\|\s*(\S+))?\s*$/i.exec(l.trim());return m?{n:m[1].trim(),h:String(Number(m[2].replace(/[.,]/g,""))),img:m[3]||""}:null}).filter(Boolean);
function tpRender(){const b=$("tpBox");if(!b)return;b.innerHTML=TP.map((t,i)=>`<div class="tp"><input class="fld" data-tn="${i}" placeholder="Nama topping" value="${esc(t.n)}"><input class="fld" data-th="${i}" type="number" inputmode="numeric" placeholder="Harga" value="${esc(t.h)}"><button type="button" data-tx="${i}">✕</button></div>`).join("")||'<small style="color:var(--mu)">Belum ada topping.</small>';
  b.querySelectorAll("[data-tn]").forEach(e=>e.oninput=()=>TP[e.dataset.tn].n=e.value);b.querySelectorAll("[data-th]").forEach(e=>e.oninput=()=>TP[e.dataset.th].h=e.value);b.querySelectorAll("[data-tx]").forEach(e=>e.onclick=()=>{TP.splice(+e.dataset.tx,1);tpRender()})}
/* export / import */
function io(){return `<div class="card"><b>⬇️ Export produk</b><p style="color:var(--mu);margin:4px 0">Unduh ${P.length} produk toko Anda sebagai file CSV (bisa dibuka di Excel).</p><button class="btn" id="ex">Export CSV</button></div><div class="card" style="margin-top:12px"><b>⬆️ Import produk</b><p style="color:var(--mu);margin:4px 0">Kolom: nama,harga,stok,kategori,satuan,deskripsi. Nama yang sama akan diperbarui, yang baru ditambahkan.</p><input type="file" id="im" accept=".csv,text/csv" hidden><button class="btn o" id="ib">Pilih file CSV</button></div>`}
const csvParse=t=>{const R=[];let r=[],c="",inq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}else if(ch=='"')inq=true;else if(ch==","||ch==";"){r.push(c);c=""}else if(ch=="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!="\r")c+=ch}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))};
bind.io=()=>{$("ex").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',t=["nama,harga,stok,kategori,satuan,deskripsi",...P.map(p=>[p.name,p.price,p.stock??"",p.category,p.unit,p.description].map(q).join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="produk-"+K(me.toko).replace(/\W+/g,"-")+".csv";a.click()};
$("ib").onclick=()=>$("im").click();$("im").onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=csvParse(await f.text()).slice(1);let n=0,u=0;try{for(const r of rows){const name=(r[0]||"").trim(),price=Math.round(Number(r[1])),stock=r[2]===""||r[2]==null?null:Math.round(Number(r[2]));if(!name||isNaN(price))continue;const o=P.find(p=>K(p.name)===K(name)),b={name,price,stock,category:(r[3]||"").trim()||"Makanan",unit:(r[4]||"").trim()||"1 porsi",description:(r[5]||"").trim()};if(o){await cf("products?id=eq."+o.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});u++}else{await cf("products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:Date.now()+n,...b,seller:me.toko||me.usaha,status:b.stock===0?"Sold Out":"Show"})});n++}}await load();toast(`✅ ${n} ditambah, ${u} diperbarui`);go("prods")}catch(e){toast("Gagal import: "+(e.message||e).toString().slice(0,80))}}};
(async()=>{if(WA&&!(window.KSID&&KSID.sesi("penjual"))){localStorage.removeItem(SESS);WA=null}if(WA){try{await boot()}catch{localStorage.removeItem(SESS)}}})();
</script></body></html>
