async function setS(k,v){LS("kalensari_"+k,v);if(!cloud())return;await cf("store_settings?on_conflict=key",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{key:k,value:v}])})}
async function saveMe(){let l=await getS("penjual_members",[]);if(!Array.isArray(l))l=[];const i=l.findIndex(x=>x&&x.id===me.id);const cur=i>=0?l[i]:{};const rec={...cur,...me};delete rec.wa_disp;if(i>=0)l[i]=rec;else l.push(rec);await setS("penjual_members",l)}
const pCoord=v=>{const t=String(v==null?"":v).trim().replace(",",".");return t===""?NaN:Number(t)};
const okCoord=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&a>=-90&&a<=90&&b>=-180&&b<=180&&!(a===0&&b===0);
const inID=(a,b)=>a>=-11.5&&a<=6.5&&b>=94&&b<=141.5;
const mapsUrl=(a,b)=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a+","+b);
function parseLL(t){t=String(t||"").trim();if(!t)return null;const m=t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)||t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)||t.match(/[?&](?:q|query|ll)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i)||t.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/);return m?[Number(String(m[1]).replace(",",".")),Number(String(m[2]).replace(",","."))]:null}
function toko(){
  const st=me.pending?'<div class="warn">⏳ Menunggu persetujuan admin. Setelah disetujui, toko dapat ditampilkan.</div>':me.status==="Hide"?'<div class="warn" style="background:#f6dcd7">🚫 Toko sedang disembunyikan oleh admin.</div>':'<div class="warn" style="background:#dcf2e3;color:#14502c">✅ Akun penjual aktif.</div>';
  return `${st}${me.kode&&window.KSID?`<div style="margin:0 0 10px">${KSID.lencana(me.kode)}</div>`:""}<div class="card"><b>🏪 Data toko</b>
  <label style="display:block;margin-top:10px">Nama pemilik<input id="sNama" class="fld" maxlength="60" value="${esc(me.nama||"")}"></label>
  <label style="display:block">Nama toko / usaha<input id="sToko" class="fld" maxlength="60" value="${esc(me.toko||me.usaha||"")}"></label>
  <label style="display:block">Alamat / Dusun<textarea id="sDusun" class="fld" maxlength="150" placeholder="Alamat toko atau dusun">${esc(me.dusun||"")}</textarea></label>
  <div class="two"><label>Jam buka<input id="sBuka" class="fld" type="time" value="${esc(me.buka||"08:00")}"></label><label>Jam tutup<input id="sTutup" class="fld" type="time" value="${esc(me.tutup||"17:00")}"></label></div>
  <label style="display:block">No. WhatsApp<input class="fld" value="+${esc(WA)}" disabled></label>
  <button class="btn" id="sSave">💾 Simpan perubahan</button></div>
  <div class="card" style="margin-top:12px;background:#fffaf2"><b>📍 Lokasi toko</b><p id="sLoc" style="margin:6px 0"></p>
  <button class="btn o" id="sGps">📍 Simpan lokasi saya sekarang</button><button class="btn o" id="sMap" hidden>🗺️ Lihat di Google Maps</button>
  <p style="color:var(--mu);font-size:13px;margin:8px 0 0">Tekan tombol ini saat Anda berada di toko.</p>
  <label style="display:block;margin-top:12px">Atau tempel koordinat / link Google Maps<input id="sMan" class="fld" placeholder="mis. -6.123456, 107.123456"></label>
  <button class="btn o" id="sManB">💾 Simpan dari koordinat</button>
  <p style="color:var(--mu);font-size:13px;margin:8px 0 0">Cara: buka Google Maps, tekan lama titik toko, lalu salin angka koordinat yang muncul di bagian atas.</p></div>
  <div class="card" style="margin-top:12px"><b>🔐 Ganti PIN</b><div class="two" style="margin-top:10px"><label>PIN lama<input id="sPo" class="fld" type="password" inputmode="numeric" maxlength="8"></label><label>PIN baru<input id="sPn" class="fld" type="password" inputmode="numeric" maxlength="8"></label></div><button class="btn o" id="sPin">Simpan PIN baru</button></div>
  <div style="height:16px"></div>`;
}
function locView(){const a=pCoord(me.latitude),b=pCoord(me.longitude),ok=okCoord(a,b);$("sLoc").textContent=ok?"✅ Lokasi toko sudah tersimpan.":"Belum ada lokasi tersimpan.";$("sMap").hidden=!ok;if(ok)$("sMap").onclick=()=>window.open(mapsUrl(a,b),"_blank","noopener")}
async function saveLoc(a,b){if(!okCoord(a,b))return toast("Koordinat tidak valid (tidak boleh kosong atau 0,0).");if(!inID(a,b))return toast("Titik di luar Indonesia. Cek apakah latitude dan longitude tertukar.");const old=[me.latitude,me.longitude];me.latitude=Number(a.toFixed(6));me.longitude=Number(b.toFixed(6));try{await saveMe();locView();toast("✅ Lokasi toko berhasil disimpan")}catch(e){[me.latitude,me.longitude]=old;toast("Gagal menyimpan lokasi: "+String(e.message||e).slice(0,60))}}
bind.toko=()=>{
  locView();
  $("sSave").onclick=async()=>{const nama=$("sNama").value.trim(),tk=$("sToko").value.replace(/\s+/g," ").trim();if(!nama||!tk)return toast("Nama pemilik dan nama toko wajib diisi");
    const oldT=me.toko||me.usaha||"",rename=K(oldT)!==K(tk)&&oldT;
    if(rename&&!confirm(`Ganti nama toko dari "${oldT}" ke "${tk}"? ${P.length} produk Anda ikut dipindah ke nama baru.`))return;
    const b=$("sSave");b.disabled=true;b.textContent="Menyimpan...";
    try{
      if(rename&&cloud()){for(const p of P){const sel=String(p.seller||"").split(",").map(x=>x.trim()).map(x=>K(x)===K(oldT)?tk:x).join(", ");await cf("products?id=eq."+encodeURIComponent(p.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({seller:sel})});p.seller=sel}}
      Object.assign(me,{nama,toko:tk,usaha:tk,dusun:$("sDusun").value.trim(),buka:$("sBuka").value,tutup:$("sTutup").value,updated:Date.now()});
      await saveMe();toast("✅ Data toko berhasil disimpan");if(rename)await load();go("toko");
    }catch(e){toast("Gagal menyimpan: "+String(e.message||e).slice(0,70))}finally{b.disabled=false;b.textContent="💾 Simpan perubahan"}};
  $("sGps").onclick=()=>{if(!navigator.geolocation)return toast("HP/browser ini tidak mendukung lokasi.");toast("📍 Meminta izin lokasi...");navigator.geolocation.getCurrentPosition(p=>saveLoc(+p.coords.latitude,+p.coords.longitude),e=>toast(e.code===1?"Izin lokasi diblokir. Izinkan lokasi untuk situs ini, atau isi manual di bawah.":e.code===3?"Waktu habis. Coba lagi atau isi manual di bawah.":"Lokasi tidak tersedia. Isi manual di bawah."),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})};
  $("sManB").onclick=()=>{const v=parseLL($("sMan").value);if(!v)return toast("Format tidak dikenali. Contoh: -6.123456, 107.123456");saveLoc(v[0],v[1]).then(()=>{$("sMan").value=""})};
  $("sPin").onclick=async()=>{const o=$("sPo").value,n=$("sPn").value;if(!/^\d{4,8}$/.test(n))return toast("PIN baru harus 4–8 angka");try{const acc=(await getS("penjual_accounts",{}))||{},a=acc[WA];if(!a||a.h!==await hashPin(WA,o))return toast("PIN lama salah");a.h=await hashPin(WA,n);acc[WA]=a;await setS("penjual_accounts",acc);$("sPo").value=$("sPn").value="";toast("✅ PIN berhasil diubah")}catch(e){toast("Gagal mengubah PIN: "+String(e.message||e).slice(0,60))}};
};
/* beranda */
function home(){const c=s=>O.filter(o=>stOf(o)===s).length,td=O.filter(o=>new Date(o.created_at).toDateString()===new Date().toDateString()),om=td.filter(o=>stOf(o)!=="dibatalkan").reduce((t,o)=>t+tot(o),0);
return `${me.pending?'<div class="warn">⏳ Akun menunggu persetujuan admin.</div>':""}${cloud()?"":'<div class="warn">⚠️ Database online belum aktif (mode uji coba).</div>'}<h2 style="margin:4px 0">Halo, ${esc(me.nama||"Penjual")} 👋</h2><p style="margin:0 0 12px;color:var(--mu)">Semangat terus mengelola toko ${esc(me.toko||"")}!</p>
<div class="stats">${["menunggu","diproses","dikirim","selesai"].map(s=>`<div>${SI[s]}<b>${c(s)}</b>${STL[s]}</div>`).join("")}</div><h3>Ringkasan Hari Ini</h3><div class="two"><div class="card"><small>Total Pesanan</small><b>${td.length}</b></div><div class="card"><small>Omset Hari Ini</small><b>${rp(om)}</b></div></div>
<h3>Menu Cepat</h3><div class="two">${[["form","➕","Tambah Produk"],["prods","📦","Daftar Produk"],["orders","📋","Kelola Pesanan"],["io","☁️","Export / Import"]].map(([k,i,t])=>`<div class="q" data-k="${k}"><i>${i}</i>${t}</div>`).join("")}<a class="q" href="${lihatTokoUrl()}"><i>🏪</i>Lihat Toko Saya</a><a class="q q-ks" href="index.html"><img src="icons/logo-kalensari.png" alt="">Ke Kalensari Store</a></div>`}
bind.home=()=>document.querySelectorAll(".q[data-k]").forEach(e=>e.onclick=()=>go(e.dataset.k));
/* pesanan */
function orders(){const l=O.filter(o=>(fo==="semua"||stOf(o)===fo)&&(!q||String(o.order_code).toLowerCase().includes(q.toLowerCase())));
return `<div class="chips">${["semua",...Object.keys(STL)].map(s=>`<button data-f="${s}" class="${s===fo?"on":""}">${s==="semua"?"Semua":STL[s]}</button>`).join("")}</div><input id="sq" class="fld" style="margin-top:0" placeholder="🔍 Cari nomor pesanan..." value="${esc(q)}">${l.length?l.map(o=>`<div class="row" data-id="${esc(o.id)}"><div class="g"><b>${esc(o.order_code)}</b><small>${new Date(o.created_at).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}</small><small>${mineItems(o).length} produk | ${rp(tot(o))}</small>${payTag(o)}${stOf(o)==="menunggu"?`<small style="color:#9a5a00">⏱ Sisa <b data-exp="${exp(o)}">${mmss(Math.max(0,exp(o)-Date.now()))}</b></small>`:""}</div><span class="pill ${stOf(o)}">${STL[stOf(o)]||stOf(o)}</span>›</div>`).join(""):'<p style="color:var(--mu);text-align:center;margin-top:30px">Belum ada pesanan.</p>'}`}
bind.orders=()=>{document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fo=b.dataset.f;go("orders")});$("sq").onchange=e=>{q=e.target.value;go("orders")};document.querySelectorAll(".row").forEach(r=>r.onclick=()=>go("detail",r.dataset.id))};
const gO=id=>O.find(o=>String(o.id)===String(id));
function detail(){const o=gO(arg);if(!o)return"<p>Pesanan tidak ditemukan.</p>";const s=stOf(o),m=mineItems(o);
return `<div style="display:flex;justify-content:space-between"><div><b style="font-size:19px">${esc(o.order_code)}</b><small style="display:block;color:var(--mu)">${new Date(o.created_at).toLocaleString("id-ID")}</small>${payTag(o)}</div><span class="pill ${s}" style="align-self:start">${STL[s]||s}</span></div>
<h3>Daftar Produk</h3><div class="card">${m.map(p=>`<div class="ln"><span>${esc(p.name)} ×${p.qty}</span><b>${rp((p.sale||p.price||0)*p.qty)}</b></div>`).join("")}<div class="ln" style="border-top:1px solid var(--ln);margin-top:6px;padding-top:8px"><b>Total Pesanan</b><b>${rp(tot(o))}</b></div></div>
${!isOnly(o)?'<p class="warn" style="margin-top:12px">Pesanan gabungan beberapa toko: diproses oleh admin.</p>':s==="menunggu"?`<p class="warn" style="margin-top:12px">⏱ Sisa waktu menanggapi: <b data-exp="${exp(o)}">${mmss(Math.max(0,exp(o)-Date.now()))}</b>. Jika lewat ${LIMIT} menit, pesanan ditolak otomatis.</p><button class="btn" id="ac">Terima & Proses Pesanan</button><button class="btn d" id="rj">Tolak Pesanan</button>`:`<p class="warn" style="margin-top:12px">${({diproses:"Pesanan diterima. Selanjutnya kurir yang mengantar dan mengubah status.",dikirim:"Pesanan sedang diantar kurir.",selesai:"Pesanan selesai diantar.",gagal:"❌ Gagal diantar kurir"+(o.gagal_alasan?": "+esc(o.gagal_alasan):"")+". Hubungi admin bila perlu.",dibatalkan:"Pesanan ditolak (atau waktu menanggapi habis)."})[s]||""}</p>`}${utHtml(o)}`}
async function setSt(id,s){try{const b={status:s,updated_at:new Date().toISOString()};if(cloud())await cf("orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});else LS("kalensari_orders",LG("kalensari_orders",[]).map(o=>String(o.id)===String(id)?{...o,...b}:o));Object.assign(gO(id),b);toast("✅ Status: "+STL[s]);return true}catch(e){toast("Gagal: "+(e.message||e).toString().slice(0,80))}}
bind.detail=()=>{$("ut")&&($("ut").onclick=()=>utTerima(arg,$("ut")));$("ac")&&($("ac").onclick=async()=>{if(exp(gO(arg))<=Date.now()){toast("Waktu menanggapi sudah habis");return go("detail",arg)}if(await setSt(arg,"diproses"))go("detail",arg)});$("rj")&&($("rj").onclick=async()=>{if(confirm("Tolak pesanan ini? Tindakan ini tidak bisa dibatalkan.")&&await setSt(arg,"dibatalkan"))go("detail",arg)})};
/* produk */
const PS=p=>p.status==="Show"?"on":"off";
function prods(){const l=P.filter(p=>(pc==="Semua"||p.category===pc)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
return `<input id="sq" class="fld" style="margin-top:0" placeholder="🔍 Cari produk..." value="${esc(q)}"><div class="chips">${["Semua",...new Set(P.map(p=>p.category).filter(Boolean))].map(c=>`<button data-c="${esc(c)}" class="${c===pc?"on":""}">${esc(c)}</button>`).join("")}</div>${l.length?l.map(p=>`<div class="row" data-id="${p.id}">${p.image?`<img src="${esc(p.image)}" alt="">`:'<div class="ph">🍪</div>'}<div class="g"><b>${esc(p.name)}</b><small>${rp(p.sale||p.price)}</small><small>${p.stock!=null?"Stok: "+p.stock:esc(p.unit||"")}${p.status==="Sold Out"?" • Habis":""}</small></div><label class="sw"><input type="checkbox" ${p.status==="Show"||p.status==="Sold Out"?"checked":""}><span></span></label></div>`).join(""):'<p style="color:var(--mu);text-align:center;margin-top:30px">Belum ada produk. Tekan + untuk menambah.</p>'}<button class="fab" id="fb">+</button>`}
bind.prods=()=>{$("sq").onchange=e=>{q=e.target.value;go("prods")};document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{pc=b.dataset.c;go("prods")});$("fb").onclick=()=>go("form");document.querySelectorAll(".row").forEach(r=>{r.onclick=()=>go("form",r.dataset.id);const c=r.querySelector("input");r.querySelector(".sw").onclick=e=>e.stopPropagation();c.onchange=async()=>{const p=P.find(x=>String(x.id)===r.dataset.id),st=c.checked?(p.stock===0?"Sold Out":"Show"):"Hidden";try{await cf("products?id=eq."+p.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:st})});p.status=st;toast(c.checked?"Produk ditampilkan":"Produk disembunyikan")}catch(e){c.checked=!c.checked;toast("Gagal: "+(e.message||e).toString().slice(0,80))}}})};
let img=null;
function form(){const p=arg?P.find(x=>String(x.id)===String(arg)):{};img=p.image||null;return `<div class="ph0" id="ft" ${img?`style="background:url('${esc(img)}') center/cover"`:""}>${img?"":"📷"}</div><input type="file" id="ff" accept="image/*" hidden><label>Nama Produk *<input id="fn" class="fld" value="${esc(p.name||"")}"></label><div class="two"><label>Harga *<input id="fh" class="fld" type="number" inputmode="numeric" value="${p.price??""}"></label><label>Stok *<input id="fs" class="fld" type="number" inputmode="numeric" value="${p.stock??""}"></label></div><label>Kategori *<input id="fk" class="fld" list="cl" value="${esc(p.category||"")}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label><label>Satuan<input id="fu" class="fld" placeholder="mis. 1 porsi" value="${esc(p.unit||"")}"></label><label>Deskripsi<textarea id="fd" class="fld">${esc(p.description||"")}</textarea></label><button class="btn" id="fv">Simpan</button>${arg?'<button class="btn d" id="fx">Hapus Produk</button>':""}`}
bind.form=()=>{$("ft").onclick=()=>$("ff").click();$("ff").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const r=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.8);$("ft").style.background=`url(${img}) center/cover`;$("ft").textContent=""};im.src=URL.createObjectURL(f)};
$("fv").onclick=async()=>{const name=$("fn").value.trim(),price=Math.round(Number($("fh").value)),stock=$("fs").value===""?NaN:Math.round(Number($("fs").value)),category=$("fk").value.trim();if(!name||!(price>=0)||$("fh").value===""||isNaN(stock)||!category)return toast("Nama, harga, stok, dan kategori wajib diisi");
const old=arg?P.find(x=>String(x.id)===String(arg)):null,row={name,price,stock,category,unit:$("fu").value.trim()||"1 porsi",description:$("fd").value.trim(),image:img,seller:old?old.seller:(me.toko||me.usaha),status:stock===0?"Sold Out":(old&&old.status==="Hidden"?"Hidden":"Show")};
const save=async r=>old?cf("products?id=eq."+old.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(r)}):cf("products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:Date.now(),...r})});
try{try{await save(row)}catch(e){if(!/stock|description/.test(e.message))throw e;const{stock:_s,description:_d,...r2}=row;await save(r2);toast("Jalankan SQL supabase-penjual-app.sql agar stok & deskripsi tersimpan")}await load();toast("✅ Produk disimpan");go("prods")}catch(e){toast("Gagal: "+(e.message||e).toString().slice(0,80))}};
$("fx")&&($("fx").onclick=async()=>{if(!confirm("Hapus produk ini?"))return;try{await cf("products?id=eq."+arg,{method:"DELETE"});await load();toast("Produk dihapus");go("prods")}catch(e){toast("Gagal: "+e.message)}})};
/* export / import */
function io(){return `<div class="card"><b>⬇️ Export produk</b><p style="color:var(--mu);margin:4px 0">Unduh ${P.length} produk toko Anda sebagai file CSV (bisa dibuka di Excel).</p><button class="btn" id="ex">Export CSV</button></div><div class="card" style="margin-top:12px"><b>⬆️ Import produk</b><p style="color:var(--mu);margin:4px 0">Kolom: nama,harga,stok,kategori,satuan,deskripsi. Nama yang sama akan diperbarui, yang baru ditambahkan.</p><input type="file" id="im" accept=".csv,text/csv" hidden><button class="btn o" id="ib">Pilih file CSV</button></div>`}
const csvParse=t=>{const R=[];let r=[],c="",inq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}else if(ch=='"')inq=true;else if(ch==","||ch==";"){r.push(c);c=""}else if(ch=="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!="\r")c+=ch}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))};
bind.io=()=>{$("ex").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',t=["nama,harga,stok,kategori,satuan,deskripsi",...P.map(p=>[p.name,p.price,p.stock??"",p.category,p.unit,p.description].map(q).join(","))].join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="produk-"+K(me.toko).replace(/\W+/g,"-")+".csv";a.click()};
$("ib").onclick=()=>$("im").click();$("im").onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=csvParse(await f.text()).slice(1);let n=0,u=0;try{for(const r of rows){const name=(r[0]||"").trim(),price=Math.round(Number(r[1])),stock=r[2]===""||r[2]==null?null:Math.round(Number(r[2]));if(!name||isNaN(price))continue;const o=P.find(p=>K(p.name)===K(name)),b={name,price,stock,category:(r[3]||"").trim()||"Makanan",unit:(r[4]||"").trim()||"1 porsi",description:(r[5]||"").trim()};if(o){await cf("products?id=eq."+o.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(b)});u++}else{await cf("products",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id:Date.now()+n,...b,seller:me.toko||me.usaha,status:b.stock===0?"Sold Out":"Show"})});n++}}await load();toast(`✅ ${n} ditambah, ${u} diperbarui`);go("prods")}catch(e){toast("Gagal import: "+(e.message||e).toString().slice(0,80))}}};
(async()=>{if(WA){try{await boot()}catch{localStorage.removeItem(SESS)}}})();
</script></body></html>
