<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalensari Store</title>
<style>
  .view { display: none; }
  .view.active { display: block; }
  /* Contoh gaya tombol musik (tanpa posisi). Kalau CSS tombol lamamu sudah ada,
     hapus blok ini dan cukup pakai class "mati" untuk tampilan 🔇 (cincin + garis merah). */
  #speakerBtn { width: 62px; height: 62px; border-radius: 50%; border: 0; background: #fff;
    font-size: 30px; box-shadow: 0 6px 16px rgba(0,0,0,.15); cursor: pointer; position: relative; }
  #speakerBtn.mati { box-shadow: 0 0 0 6px rgba(160,125,95,.6); }
  #speakerBtn.mati::after { content: ""; position: absolute; left: 50%; top: 50%; width: 38px; height: 4px;
    background: #e0242b; border-radius: 2px; transform: translate(-50%,-50%) rotate(45deg); }
</style>
</head>
<body>

<!-- AUDIO: di LUAR semua view, jadi tidak pernah ke-reload / putus.
     Tombol speaker ada DI DALAM view-toko, jadi hanya muncul di layar utama. -->
<audio id="bgMusic" src="musik.mp3" loop preload="auto"></audio>

<!-- Menu navigasi (ganti dengan menu ☰ milikmu, cukup pakai data-view) -->
<nav>
  <a href="#toko"    data-view="toko">Toko</a>
  <a href="#jasa"    data-view="jasa">Penyedia Jasa</a>
  <a href="#akun"    data-view="akun">Akun</a>
  <a href="#santunan" data-view="santunan">Info Santunan</a>
</nav>

<main>
  <section class="view" id="view-toko">
    <!-- Pakai tombol musik lamamu di tempat yang sama; cukup beri id="speakerBtn" -->
    <button id="speakerBtn" aria-label="Musik"><!-- isi ikon speaker lamamu --></button>
    <!-- isi halaman toko / index lama -->
  </section>
  <section class="view" id="view-jasa">    <!-- isi jasa.html lama --> </section>
  <section class="view" id="view-akun">    <!-- isi akun-*.html lama --> </section>
  <section class="view" id="view-santunan"><!-- isi info santunan --> </section>
</main>

<script>
/* ========== 1. PINDAH TAMPILAN TANPA RELOAD ========== */
const VIEWS = ['toko', 'jasa', 'akun', 'santunan'];

function show(name, push = true) {
  if (!VIEWS.includes(name)) name = 'toko';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo(0, 0);
  if (push) history.pushState({ name }, '', '#' + name);
}

// tombol Back / Forward browser
window.addEventListener('popstate', e => {
  const name = (e.state && e.state.name) || location.hash.slice(1) || 'toko';
  show(name, false);
});

// semua link/tombol dengan data-view pindah tanpa reload
document.addEventListener('click', e => {
  const el = e.target.closest('[data-view]');
  if (!el) return;
  e.preventDefault();
  show(el.dataset.view);
});

// tampilan awal (sesuai #hash di URL)
show(location.hash.slice(1) || 'toko', false);
history.replaceState({ name: location.hash.slice(1) || 'toko' }, '');

/* ========== 2. MUSIK LATAR + TOMBOL SPEAKER ========== */
const music = document.getElementById('bgMusic');
const btn   = document.getElementById('speakerBtn');
let userMuted = localStorage.getItem('musikMati') === '1'; // ingat pilihan pengguna

music.volume = 0.4;

// Tampilan tombol TIDAK diubah script ini. Script hanya menambah/menghapus
// class pada tombolmu saat musik mati. Ganti MUTED_CLASS dengan class
// yang sudah kamu pakai untuk tampilan "speaker dicoret" (yang ada cincinnya).
const MUTED_CLASS = 'muted';

function updateIcon() {
  const mati = userMuted || music.paused;
  btn.classList.toggle(MUTED_CLASS, mati);
  btn.setAttribute('aria-pressed', String(!mati));
}

// browser memblokir autoplay -> mulai di sentuhan/klik pertama
function startOnFirstTouch() {
  if (!userMuted) music.play().then(updateIcon).catch(() => {});
}
['click', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, startOnFirstTouch, { once: true })
);

btn.addEventListener('click', e => {
  e.stopPropagation();
  if (music.paused) {
    userMuted = false;
    music.play().catch(() => {});
  } else {
    userMuted = true;
    music.pause();
  }
  localStorage.setItem('musikMati', userMuted ? '1' : '0');
  updateIcon();
});

// pause otomatis saat tab disembunyikan / aplikasi ke background
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    music.pause();
  } else if (!userMuted) {
    music.play().catch(() => {});
  }
  updateIcon();
});

updateIcon();
</script>
</body>
</html>
